<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b0e14">
<title>تماريني 💪</title>
<style>
:root{--bg:#0b0e14;--card:#141b29;--line:#243049;--text:#f4f6fb;--muted:#96a1b8;--b1:#ff7a18;--b2:#ff2d55;--green:#22c55e;--green2:#15803d;--red:#ef4444;--gold:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;background:radial-gradient(1100px 500px at 50% -8%,#22304f 0%,var(--bg) 60%) fixed,var(--bg)}
::selection{background:rgba(255,122,24,.4)}
header{background:rgba(11,14,20,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.2px}
.logo .tile{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--b1),var(--b2));display:inline-flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 20px rgba(255,70,60,.4)}
main{padding:14px 12px 116px;max-width:620px;margin:auto}
#app>*{animation:pop .28s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,#182031,#111724);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
button{background:#232e45;color:var(--text);border:1px solid #31405e;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;margin:3px;cursor:pointer;font-family:inherit;transition:transform .06s,box-shadow .15s,filter .15s}
button:active{transform:scale(.96)}
button:hover{filter:brightness(1.12)}
button.red{background:linear-gradient(135deg,#b91c1c,var(--red));border:0;box-shadow:0 6px 18px rgba(239,68,68,.35)}
button.gray{background:#1a2233;border:1px solid #2c3a57;color:#c6d0e2}
button.green{background:linear-gradient(135deg,var(--green2),var(--green));border:0;box-shadow:0 6px 18px rgba(34,197,94,.35)}
button.orange{background:linear-gradient(135deg,#ea580c,var(--gold));border:0;color:#231303;box-shadow:0 6px 18px rgba(245,158,11,.35)}
button.big{background:linear-gradient(135deg,var(--b1),var(--b2));border:0;color:#fff;font-size:16px;padding:16px;box-shadow:0 8px 24px rgba(255,80,50,.4);border-radius:16px}
input,select{padding:11px 8px;font-size:16px;border-radius:12px;border:1px solid #31405e;background:#0c1220;color:#fff;text-align:center;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--b1);box-shadow:0 0 0 3px rgba(255,122,24,.25)}
input.w{width:84px} input.r{width:84px} input.full{width:100%;text-align:right;margin:6px 0}
.row{display:flex;align-items:center;gap:6px;margin:7px 0;flex-wrap:wrap}
.title{font-size:19px;font-weight:800;margin-bottom:6px}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.done-set{background:rgba(34,197,94,.14) !important;border:1px solid var(--green) !important;box-shadow:0 0 0 1px rgba(34,197,94,.4) inset}
.setbox{background:#0d1424;border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0}
nav{position:fixed;bottom:12px;right:12px;left:12px;background:rgba(15,20,32,.96);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;display:flex;max-width:596px;margin:auto;z-index:10;box-shadow:0 14px 40px rgba(0,0,0,.55);overflow:hidden}
nav button{flex:1;background:transparent;border:0;color:#8b96ad;border-radius:16px;padding:10px 2px;font-size:11px;margin:4px}
nav button .ni{display:block;font-size:22px;line-height:1.25}
nav button .nl{font-weight:800}
nav button.active{background:linear-gradient(135deg,rgba(255,122,24,.25),rgba(255,45,85,.25));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,122,24,.4)}
.badge{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;color:#cfd8ea}
.timer{position:sticky;top:62px;background:linear-gradient(135deg,#4c1d95,#7c3aed);border:1px solid #8b5cf6;border-radius:18px;padding:12px;text-align:center;font-size:20px;font-weight:800;margin-bottom:12px;z-index:5;box-shadow:0 8px 26px rgba(124,58,237,.45)}
.progress{height:10px;background:#0b111e;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:linear-gradient(90deg,var(--green2),#4ade80);transition:width .3s}
details{background:#0d1424;border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
summary{cursor:pointer;font-weight:800;color:#ffd9a8}
.exname{font-size:16px;font-weight:800;flex:1}
.kbd{background:#000;border:1px solid #444;border-radius:6px;padding:2px 8px}
canvas.chart{width:100%;height:220px;background:#080c15;border:1px solid var(--line);border-radius:16px;margin-top:8px}
select.full{width:100%;text-align:right;margin:6px 0}
</style>
</head>
<body>
<header>
  <span class="logo"><span class="tile">💪</span> تماريني</span>
  <span class="badge" id="statBadge">0 نظام</span>
</header>
<main id="app"></main>
<nav>
  <button id="nav-home" onclick="go('home')"><span class="ni">🏠</span><span class="nl">الرئيسية</span></button>
  <button id="nav-workout" onclick="go('today')"><span class="ni">🏋️</span><span class="nl">تمرين اليوم</span></button>
  <button id="nav-history" onclick="go('history')"><span class="ni">📊</span><span class="nl">السجل</span></button>
  <button id="nav-backup" onclick="go('backup')"><span class="ni">⚙️</span><span class="nl">الإعدادات</span></button>
</nav>

<script>
// ===== قاعدة البيانات =====
let db = null;
try { db = JSON.parse(localStorage.getItem('gymdb_v2') || localStorage.getItem('gymdb') || '{"programs":[],"logs":[]}'); }
catch(e){ db = {programs:[], logs:[]}; }
if(!db.programs) db.programs = [];
if(!db.logs) db.logs = [];
// ترحيل للنسخة الجديدة
if(!localStorage.getItem('gymdb_v2')){ localStorage.setItem('gymdb_v2', JSON.stringify(db)); }

let view = {name:'home'};
let session = null;
let restSec = 0, restInt = null;

const save = () => { localStorage.setItem('gymdb_v2', JSON.stringify(db)); updateBadge(); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updateBadge(){ document.getElementById('statBadge').textContent = db.programs.length + ' نظام • ' + db.logs.length + ' تمرينة'; }
function go(name, extra={}){ view = {...view, name, ...extra}; stopRest(); render(); window.scrollTo(0,0); }
const prog = () => db.programs.find(p => p.id === view.pid);
const day = () => { const p = prog(); return p ? p.days.find(d => d.id === view.did) : null; };

function lastLog(exName){
  for(let i=db.logs.length-1;i>=0;i--){
    const e = db.logs[i].exercises.find(x=>x.name===exName);
    if(e) return {date:db.logs[i].date, sets:e.sets};
  }
  return null;
}
function allExerciseNames(){
  const s=new Set();
  db.programs.forEach(p=>p.days.forEach(d=>d.exercises.forEach(e=>s.add(e.name))));
  db.logs.forEach(l=>l.exercises.forEach(e=>s.add(e.name)));
  return [...s];
}
function drawProgressChart(canvasId, exName){
  const c=document.getElementById(canvasId); if(!c) return;
  const h=exerciseHistory(exName); if(!h.length) return;
  const dpr=window.devicePixelRatio||1;
  const W=c.clientWidth||560, H=220;
  c.width=W*dpr; c.height=H*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr);
  x.clearRect(0,0,W,H);
  const vals=h.slice(-12).map(o=>o.best);
  const max=Math.max(...vals,10), min=Math.min(...vals,0);
  const pad={t:16,r:12,b:28,l:38};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  x.strokeStyle='#333'; x.fillStyle='#999'; x.font='11px Tahoma'; x.lineWidth=1;
  for(let g=0;g<=4;g++){ const v=min+(max-min)*g/4; const y=pad.t+ih-(ih*g/4);
    x.beginPath(); x.moveTo(pad.l,y); x.lineTo(W-pad.r,y); x.stroke();
    x.fillText((Math.round(v*10)/10)+' كجم',2,y+4); }
  const px=i=> vals.length===1 ? pad.l+iw/2 : pad.l+iw*i/(vals.length-1);
  const py=v=> pad.t+ih-((v-min)/((max-min)||1)*ih);
  // area
  x.beginPath(); vals.forEach((v,i)=>{ const X=px(i),Y=py(v); i?x.lineTo(X,Y):x.moveTo(X,Y); });
  x.strokeStyle='#1e88e5'; x.lineWidth=3; x.stroke();
  x.lineTo(px(vals.length-1),pad.t+ih); x.lineTo(px(0),pad.t+ih); x.closePath();
  x.fillStyle='rgba(30,136,229,.18)'; x.fill();
  // dots + labels
  vals.forEach((v,i)=>{ const X=px(i),Y=py(v);
    x.beginPath(); x.arc(X,Y,5,0,7); x.fillStyle='#2e7d32'; x.fill();
    x.fillStyle='#fff'; x.fillText(v,X-10,Y-10); });
  const n=h.slice(-12);
  x.fillStyle='#777'; n.forEach((o,i)=>{ if(i%2===0) x.fillText(String(i+1),px(i)-3,H-8); });
}
function refreshChart(){
  const sel=document.getElementById('chartEx'); if(!sel) return;
  const h=exerciseHistory(sel.value);
  const info=document.getElementById('chartInfo');
  if(!h.length){ if(info) info.innerHTML='<p class="muted">لسه ملعبتش التمرين ده ولا مرة.</p>'; const c=document.getElementById('pchart'); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height); return; }
  const best=Math.max(...h.map(o=>o.best));
  const first=h[0].best, last=h[h.length-1].best;
  const diff=Math.round((last-first)*10)/10;
  if(info) info.innerHTML=`لعبت <b>${h.length}</b> مرة • أول وزن: <b>${first} كجم</b> • آخر وزن: <b>${last} كجم</b> • أحسن وزن: <b>${best} كجم</b> • الفرق: <b style="color:${diff>=0?'#66bb6a':'#ef5350'}">${diff>=0?'+':''}${diff} كجم</b>`;
  drawProgressChart('pchart', sel.value);
}
function exerciseHistory(exName){
  const out=[];
  db.logs.forEach(l=>{
    const e=l.exercises.find(x=>x.name===exName);
    if(e){
      let best=0; e.sets.forEach(s=>{ const w=parseFloat(s.w)||0; if(w>best) best=w; });
      out.push({date:l.date, best, sets:e.sets});
    }
  });
  return out;
}

// ===== الأنظمة =====
function addProg(){
  const n = prompt('اسم النظام (مثال: نظام تضخيم - مستوى متقدم):');
  if(!n) return;
  db.programs.push({id:uid(), name:n.trim(), days:[]});
  save(); render();
}
function renameProg(id){ const p=db.programs.find(x=>x.id===id); const n=prompt('الاسم الجديد:',p.name); if(n){p.name=n.trim();save();render();} }
function delProg(id){ if(confirm('حذف النظام ده بالكامل بكل أيامه؟')){ db.programs=db.programs.filter(p=>p.id!==id); save(); go('home'); } }
function dupProg(id){
  const p=db.programs.find(x=>x.id===id); if(!p) return;
  const c=JSON.parse(JSON.stringify(p)); c.id=uid(); c.name=p.name+' (نسخة)';
  c.days.forEach(d=>{ d.id=uid(); });
  db.programs.push(c); save(); render();
}

// ===== الأيام =====
function addDay(){
  const n=prompt('اسم اليوم (مثال: صدر + تراي / Pull / رجل):');
  if(!n) return;
  prog().days.push({id:uid(), name:n.trim(), exercises:[]});
  save(); render();
}
function renameDay(id){ const d=prog().days.find(x=>x.id===id); const n=prompt('الاسم الجديد:',d.name); if(n){d.name=n.trim();save();render();} }
function delDay(id){ if(confirm('حذف اليوم ده بكل تمارينه؟')){ prog().days=prog().days.filter(d=>d.id!==id); save(); render(); } }

// ===== التمارين =====
function addEx(){
  const n=prompt('اسم التمرين (مثال: بنش مستوي بار):');
  if(!n) return;
  day().exercises.push({name:n.trim(), sets:[{w:'',r:''}]});
  save(); render();
}
function renameEx(i){ const e=day().exercises[i]; const n=prompt('اسم التمرين الجديد:',e.name); if(n){e.name=n.trim();save();render();} }
function delEx(i){ if(confirm('حذف التمرين ده؟')){ day().exercises.splice(i,1); save(); render(); } }
function moveEx(i,dir){ const ex=day().exercises; const j=i+dir; if(j<0||j>=ex.length) return; [ex[i],ex[j]]=[ex[j],ex[i]]; save(); render(); }
function addSet(i){ const s=day().exercises[i].sets; const last=s[s.length-1]||{w:'',r:''}; s.push({w:last.w,r:last.r}); save(); render(); }
function delSet(i,j){ if(day().exercises[i].sets.length<=1) return alert('لازم يفضل دور واحد على الأقل'); day().exercises[i].sets.splice(j,1); save(); render(); }
function setT(i,j,k,v){ day().exercises[i].sets[j][k]=v; save(); }
function fillDown(i,j,k){
  // انسخ قيمة الدور ده لكل الأدوار اللي بعده
  const sets=day().exercises[i].sets; const v=sets[j][k];
  for(let x=j+1;x<sets.length;x++) sets[x][k]=v;
  save(); render();
}

// ===== شاشة تمرين اليوم (اختيار سريع) =====
function quickStart(pid,did){ view.pid=pid; view.did=did; startWorkout(); }

// ===== جلسة التمرين =====
function startWorkout(){
  const d=day();
  if(!d) return alert('اختار يوم الأول');
  if(!d.exercises.length) return alert('ضيف تمارين الأول في الجدول');
  session={pname:prog().name, dname:d.name, pid:view.pid, did:view.did, startTime:new Date().toLocaleString('ar-EG'),
    exercises:d.exercises.map(e=>({name:e.name, sets:e.sets.map(s=>({w:s.w,r:s.r,done:false}))}))};
  go('workout');
}
function setS(i,j,k,v){ session.exercises[i].sets[j][k]=v; updateProgress(); }
function toggleDone(i,j){ const s=session.exercises[i].sets[j]; s.done=!s.done; if(s.done) startRest(90); render(); }
function addSSet(i){ const s=session.exercises[i].sets; const l=s[s.length-1]||{w:'',r:''}; s.push({w:l.w,r:l.r,done:false}); render(); }
function delSSet(i,j){ session.exercises[i].sets.splice(j,1); render(); }
function cancelWorkout(){ if(confirm('إلغاء التمرين بدون حفظ؟')){ session=null; stopRest(); go('day',{pid:view.pid,did:view.did}); } }
function finishWorkout(){
  const log={id:uid(), date:new Date().toLocaleString('ar-EG'), pname:session.pname, dname:session.dname,
    exercises:session.exercises.map(e=>({name:e.name, sets:e.sets.filter(s=>s.w!==''||s.r!=='').map(s=>({w:s.w,r:s.r}))}))};
  if(!log.exercises.length || log.exercises.every(e=>!e.sets.length)) return alert('سجّل وزن وعدات الأول');
  db.logs.push(log);
  const upd = confirm('تم حفظ التمرين ✅\n\nتحب تحدّث الجدول الأساسي بأرقام النهارده؟\n(يعني لو شلت وزن 30 وزوّدت 45، الجدول يتعدل تلقائي)');
  if(upd){
    const p=db.programs.find(x=>x.id===session.pid);
    if(p){ const d=p.days.find(x=>x.id===session.did);
      if(d){ d.exercises = log.exercises.map(e=>({name:e.name, sets:e.sets.length?e.sets:[{w:'',r:''}]})); } }
  }
  save(); session=null; stopRest();
  go('history');
}
function doneCount(){ if(!session) return 0; let t=0,d=0; session.exercises.forEach(e=>e.sets.forEach(s=>{t++; if(s.done)d++;})); return {d,t}; }
function updateProgress(){ const el=document.getElementById('pbar'); if(!el||!session) return; const {d,t}=doneCount(); el.style.width=(t?Math.round(d/t*100):0)+'%'; const tx=document.getElementById('ptxt'); if(tx) tx.textContent=d+' / '+t+' دور'; }

// تايمر الراحة
function startRest(sec){ restSec=sec; clearInterval(restInt); tickRest(); restInt=setInterval(()=>{ restSec--; if(restSec<=0){clearInterval(restInt); try{navigator.vibrate&&navigator.vibrate(300);}catch(e){} } tickRest(); },1000); }
function tickRest(){ const el=document.getElementById('restTimer'); if(!el) return; if(restSec<=0){el.style.display='none';return;} el.style.display='block'; const m=Math.floor(restSec/60), s=restSec%60; el.textContent='⏱ راحة: '+m+':'+String(s).padStart(2,'0')+' — دوس ✔ لما تخلص الدور'; }
function stopRest(){ clearInterval(restInt); restSec=0; }
function customRest(){ const v=prompt('مدة الراحة بالثواني (مثال: 90):','90'); if(v&&+v>0) startRest(+v); }

// ===== السجل =====
function delLog(id){ if(confirm('حذف التمرينة دي من السجل؟')){ db.logs=db.logs.filter(l=>l.id!==id); save(); render(); } }
function clearAll(){ if(confirm('تحذير: هيمسح كل الأنظمة والسجل! اعمل تصدير الأول. متأكد؟') && confirm('تأكيد أخير: امسح كل حاجة؟')){ db={programs:[],logs:[]}; session=null; save(); go('home'); } }

// ===== نسخ احتياطي =====
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='gym-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.programs||!d.logs) throw 0; db=d; save(); go('home'); alert('تم الاستيراد ✅'); }catch(e){ alert('الملف غير صالح ❌'); } };
    r.readAsText(f); };
  inp.click();
}
function shareWhatsApp(){
  if(!db.logs.length) return alert('العب تمرينة الأول عشان تشاركها');
  const l=db.logs[db.logs.length-1];
  let txt='🏋️ تمرينتي النهارده: '+l.pname+' - '+l.dname+'%0A';
  l.exercises.forEach(e=>{ txt+='• '+e.name+': '+e.sets.map(s=>s.w+'كجم×'+s.r).join(' | ')+'%0A'; });
  window.open('https://wa.me/?text='+encodeURIComponent(decodeURIComponent(txt.replaceAll('%0A','\n'))),'_blank');
}

// ===== مثال جاهز =====
function loadSample(){
  if(db.programs.length && !confirm('عندك أنظمة موجودة. تحب تضيف مثال جاهز جنبهم؟')) return;
  db.programs.push({id:uid(), name:'نظام تضخيم (مثال)', days:[
    {id:uid(), name:'صدر + تراي', exercises:[
      {name:'بنش مستوي بار', sets:[{w:'30',r:'8'},{w:'35',r:'6'},{w:'40',r:'4'}]},
      {name:'بنش عالي دمبل', sets:[{w:'20',r:'10'},{w:'22',r:'8'}]},
      {name:'تراي حبل', sets:[{w:'15',r:'12'},{w:'17',r:'10'}]}
    ]},
    {id:uid(), name:'ضهر + باي', exercises:[
      {name:'سحب علوي', sets:[{w:'40',r:'10'},{w:'45',r:'8'}]},
      {name:'رو دمبل', sets:[{w:'20',r:'10'},{w:'22',r:'8'}]}
    ]},
    {id:uid(), name:'رجل', exercises:[
      {name:'سكوات', sets:[{w:'40',r:'8'},{w:'50',r:'6'},{w:'60',r:'4'}]}
    ]}
  ]});
  save(); render();
}

// ===== العرض =====
function render(){
  updateBadge();
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  const a=document.getElementById('app');
  const v=view.name;

  if(v==='home'){
    document.getElementById('nav-home').classList.add('active');
    a.innerHTML = `
    <div class="card"><div class="title">📋 الأنظمة التدريبية</div>
      <p class="muted">كل نظام = جدول كامل (مثال: تضخيم / تنشيف). جواه أيام، وكل يوم تمارين وأدوار.</p>
      ${db.programs.map(p=>`<div class="row">
        <button class="big" style="flex:1;text-align:right" onclick="go('prog',{pid:'${p.id}'})">📦 ${esc(p.name)}<br><span class="badge">${p.days.length} يوم • ${p.days.reduce((n,d)=>n+d.exercises.length,0)} تمرين</span></button></div>
        <div class="row"><button class="gray" onclick="renameProg('${p.id}')">✏️ تعديل الاسم</button>
