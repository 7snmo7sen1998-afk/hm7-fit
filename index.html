<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0d13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HM Fit | سجّل تمرينك وتابع تطوّرك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d13; --card:#131926; --card2:#0e1420; --line:#233052; --line2:#2e3d63;
  --text:#f5f7fc; --muted:#9aa6bd; --faint:#67738c;
  --b1:#ff7a18; --b2:#ff2d55; --green:#22c55e; --green-d:#15803d;
  --red:#ef4444; --blue:#3b82f6; --gold:#f5a623;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;
  background:radial-gradient(1000px 480px at 85% -5%,rgba(255,45,85,.12),transparent 60%),
  radial-gradient(900px 480px at 10% -5%,rgba(255,122,24,.12),transparent 60%),
  radial-gradient(1200px 700px at 50% 110%,#141d33 0%,var(--bg) 60%) fixed,var(--bg)}
::selection{background:rgba(255,122,24,.45)}
/* ===== header ===== */
header{position:sticky;top:0;z-index:20;background:rgba(10,13,19,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hwrap{max-width:640px;margin:auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand .tile{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--b1),var(--b2));display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(255,70,60,.42)}
.brand .tile{color:#fff;font-weight:900;font-size:17px;letter-spacing:-.5px;font-family:Arial,sans-serif}
.brand b i{font-style:normal;background:linear-gradient(135deg,var(--b1),var(--b2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand b{font-size:20px;font-weight:900;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{font-size:11px;color:var(--muted);font-weight:600}
/* ===== layout ===== */
main{padding:16px 14px 120px;max-width:640px;margin:auto}
#app>*{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,#161e30,#101624);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 14px 34px rgba(0,0,0,.42)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:800}
.card .sub{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.8}
/* ===== hero ===== */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px;margin-bottom:14px;border:1px solid #3a2b4d;
  background:linear-gradient(135deg,#2a1440 0%,#3d1530 45%,#57200f 100%);box-shadow:0 16px 40px rgba(255,45,85,.22)}
.hero::after{content:"";position:absolute;left:-40px;top:-40px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,24,.35),transparent 70%)}
.hero h2{margin:0 0 4px;font-size:22px;font-weight:900}
.hero p{margin:0 0 14px;font-size:13.5px;color:#e8c9d4;line-height:1.8}
.hero .art{position:absolute;left:12px;bottom:-14px;opacity:.28}
.hero .art svg{width:120px;height:120px;color:#fff}
/* ===== stats ===== */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:linear-gradient(180deg,#172033,#101624);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center}
.stat .v{font-size:21px;font-weight:900;line-height:1.2}
.stat .v em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.stat.hl{border-color:rgba(255,122,24,.5);box-shadow:0 0 0 1px rgba(255,122,24,.25),0 10px 26px rgba(255,90,40,.18)}
/* ===== buttons ===== */
button{font-family:inherit;cursor:pointer;transition:transform .07s,filter .15s,box-shadow .15s}
button:active{transform:scale(.96)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#222c44;color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800}
.btn:hover{filter:brightness(1.12)}
.btn .ic{width:19px;height:19px}
.btn-primary{background:linear-gradient(135deg,var(--b1),var(--b2));border:0;color:#fff;box-shadow:0 10px 26px rgba(255,80,50,.42)}
.btn-green{background:linear-gradient(135deg,var(--green-d),var(--green));border:0;color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.35)}
.btn-red{background:linear-gradient(135deg,#b91c1c,var(--red));border:0;color:#fff;box-shadow:0 8px 22px rgba(239,68,68,.32)}
.btn-gold{background:linear-gradient(135deg,#b45309,var(--gold));border:0;color:#241100}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#cfd8ea}
.btn-block{width:100%;padding:16px;font-size:16px;border-radius:16px}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn-sm .ic{width:16px;height:16px}
.ibtn{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#1b2440;border:1px solid var(--line2);color:#c6d0e2;padding:0;margin:2px}
.ibtn .ic{width:18px;height:18px}
.ibtn.danger{color:#ff8f8f;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4)}
.ibtn.go{color:#7dffa9;background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.45)}
/* compat with old class names */
button.green{composes:btn-green}
.green{background:linear-gradient(135deg,var(--green-d),var(--green));border:0;color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.35);display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.red{background:linear-gradient(135deg,#b91c1c,var(--red));border:0;color:#fff;box-shadow:0 8px 22px rgba(239,68,68,.32);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.gray{background:#1a2233;border:1px solid #2c3a57;color:#c6d0e2;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.orange{background:linear-gradient(135deg,#ea580c,var(--gold));border:0;color:#241100;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.big{width:100%;padding:16px;font-size:16px;border-radius:16px;background:linear-gradient(135deg,var(--b1),var(--b2));border:0;color:#fff;font-weight:800;box-shadow:0 10px 26px rgba(255,80,50,.42);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;cursor:pointer}
/* ===== forms ===== */
input,select{padding:11px 8px;font-size:16px;font-weight:700;border-radius:12px;border:1px solid #31405e;background:#0b1120;color:#fff;text-align:center;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--b1);box-shadow:0 0 0 3px rgba(255,122,24,.25)}
input.w{width:84px} input.r{width:84px} input.full{width:100%;text-align:right;margin:6px 0}
select.full{width:100%;text-align:right;margin:6px 0;background:#0b1120}
.row{display:flex;align-items:center;gap:6px;margin:7px 0;flex-wrap:wrap}
.title{font-size:18px;font-weight:800;margin-bottom:4px}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800;color:#d5ddee}
.badge .ic{width:15px;height:15px;color:var(--b1)}
.badge.hot{border-color:rgba(255,122,24,.5);color:#ffd9ad}
/* ===== list items ===== */
.item{display:flex;align-items:center;gap:8px;background:#0d1424;border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:15.5px}
.item .meta{font-size:12px;color:var(--muted);font-weight:600}
.item.mainbtn{cursor:pointer;border-color:#33436b;background:linear-gradient(180deg,#17223a,#10182b)}
.item.mainbtn:hover{border-color:var(--b1)}
.thumb{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#233052,#10182b);border:1px solid var(--line2)}
.thumb svg{width:24px;height:24px;color:var(--b1)}
.thumb.g svg{color:var(--green)} .thumb.r svg{color:var(--red)} .thumb.b svg{color:var(--blue)}
/* ===== sets ===== */
.setbox{background:#0b1120;border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0}
.setbox .shead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.snum{min-width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#2b3a5e,#16203a);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.done-set{background:rgba(34,197,94,.1) !important;border-color:rgba(34,197,94,.55) !important;box-shadow:0 0 0 1px rgba(34,197,94,.35) inset}
.checkbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:11px;font-weight:800;font-size:14px;border:1px solid var(--line2);background:#1a2233;color:#aeb9cf;font-family:inherit;cursor:pointer}
.checkbtn.on{background:linear-gradient(135deg,var(--green-d),var(--green));border:0;color:#fff;box-shadow:0 6px 18px rgba(34,197,94,.4)}
.mini{font-size:12px;font-weight:800;color:var(--muted);background:transparent;border:1px dashed #33436b;border-radius:10px;padding:7px 10px;font-family:inherit;cursor:pointer}
/* ===== timer / progress ===== */
.timer{position:sticky;top:66px;z-index:5;background:linear-gradient(135deg,#4c1d95,#7c3aed);border:1px solid #8b5cf6;border-radius:18px;padding:12px;text-align:center;font-size:19px;font-weight:800;margin-bottom:12px;box-shadow:0 10px 28px rgba(124,58,237,.45)}
.progress{height:10px;background:#0a0f1c;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:linear-gradient(90deg,var(--green-d),#4ade80);transition:width .3s}
.rest-row{display:flex;gap:6px}
/* ===== nav ===== */
nav{position:fixed;bottom:12px;right:12px;left:12px;background:rgba(14,19,31,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:24px;display:flex;max-width:616px;margin:auto;z-index:20;box-shadow:0 16px 44px rgba(0,0,0,.6);overflow:hidden;padding:5px}
nav button{flex:1;background:transparent;border:0;color:#7d89a1;border-radius:18px;padding:9px 2px 7px;margin:2px;font-family:inherit;cursor:pointer}
nav button .ni{display:flex;justify-content:center}
nav button .ni svg{width:23px;height:23px}
nav button .nl{display:block;font-size:10.5px;font-weight:800;margin-top:2px}
nav button.active{background:linear-gradient(135deg,rgba(255,122,24,.28),rgba(255,45,85,.28));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,122,24,.45)}
/* ===== misc ===== */
canvas.chart{width:100%;height:220px;background:#080c15;border:1px solid var(--line);border-radius:16px;margin-top:8px}
details{background:#0b1120;border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
summary{cursor:pointer;font-weight:800;color:#ffd9a8;font-size:14px}
.exname{font-size:16px;font-weight:800;flex:1}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
.section-head h2{margin:0;font-size:17px;font-weight:900}
.logline{font-size:13.5px;margin:5px 0;line-height:1.9;color:#dbe2ef}
.logline b{color:#fff}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty svg{width:64px;height:64px;color:#3b4a6e;margin-bottom:8px}
.ic{width:20px;height:20px;flex:none}
.danger-zone{border-color:rgba(239,68,68,.45) !important}
.danger-zone h3{color:#ff9c9c}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0}
.kv b{color:var(--text)}
#picker{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88vh;background:#0f1522;border:1px solid var(--line2);border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding:14px;animation:rise .25s ease}
.sheet .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet .top b{font-size:17px;font-weight:900}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:#1a2233;border:1px solid var(--line2);color:#aeb9cf;font-weight:800;font-size:13px;font-family:inherit}
.chip.on{background:linear-gradient(135deg,var(--b1),var(--b2));border:0;color:#fff}
#pkList{overflow-y:auto;flex:1;padding-bottom:10px}
.pk{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:#0d1424;border:1px solid var(--line);border-radius:14px;padding:11px;margin:6px 0;color:var(--text);font-family:inherit;font-size:15px;font-weight:800}
.pk small{margin-right:auto;color:var(--muted);font-weight:700;font-size:11.5px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <span class="brand"><span class="tile" id="logoTile">HM</span><span><b>HM <i>Fit</i></b><small>سجّل • تتبّع • تطوّر</small></span></span>
    <span class="badge" id="statBadge">…</span>
  </div>
</header>
<main id="app"></main>
<div id="picker" onclick="if(event.target===this)closePicker()"><div class="sheet">
  <div class="top"><b>اختار التمرين</b><button class="ibtn" onclick="closePicker()"></button></div>
  <input class="full" id="pkQ" placeholder="ابحث عن تمرين… أو اكتب اسم جديد" oninput="pk.q=this.value;pkRender()">
  <div class="chips" id="pkChips"></div>
  <div id="pkList"></div>
</div></div>
<nav>
  <button id="nav-home" onclick="go('home')"></button>
  <button id="nav-workout" onclick="go('today')"></button>
  <button id="nav-backup" onclick="go('backup')"></button>
  <button id="nav-history" onclick="go('history')"></button>
</nav>

<script>
/* ================= أيقونات SVG ================= */
const ICONS = {
home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/>',
gym:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
chart:'<path d="M4 20h16"/><path d="M7 20v-6M12 20V6M17 20v-9"/>',
gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/>',
play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
trash:'<path d="M4 7h16M9 7V5h6v2M6.5 7l1 13h9l1-13"/><path d="M10 11v6M14 11v6"/>',
pen:'<path d="M4 20l1-4L16.6 4.4a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/>',
check:'<path d="M4.5 12.5l5 5L19.5 7"/>',
clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
bolt:'<path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/>',
trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 5H4.5v1.5A4.5 4.5 0 0 0 9 11M16 5h3.5v1.5A4.5 4.5 0 0 1 15 11M12 13v3M8.5 20.5h7M9.5 16.5h5"/>',
up:'<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>',
down:'<path d="M12 5v14M5.5 12.5 12 19l6.5-6.5"/>',
x:'<path d="M6 6l12 12M18 6 6 18"/>',
dl:'<path d="M12 4v11M7 11l5 5 5-5M4.5 20h15"/>',
ul:'<path d="M12 15V4M7 8.5 12 3.5l5 5M4.5 20h15"/>',
share:'<circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M8.8 10.8l6.4-4M8.8 13.2l6.4 4"/>',
cal:'<rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
fire:'<path d="M12 22c4.2 0 7-2.9 7-6.8 0-2.8-1.8-5.2-3.3-6.7-.4 1.2-1 2.3-2.2 3.1.2-2.4-.7-5-2.5-6.6C8.6 7.3 5 11 5 15.2 5 19.1 7.8 22 12 22z"/>',
back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
box:'<path d="M4 8l8-4 8 4v8l-8 4-8-4V8z"/><path d="M4 8l8 4 8-4M12 12v8"/>',
redo:'<path d="M3.5 8a8.5 8.5 0 1 1-1 6"/><path d="M3.5 3.5V8H8"/>'
};
const icon = (n, cls) => `<svg class="${cls||'ic'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;
const NAV = { home:['home','الرئيسية'], today:['gym','تمرين اليوم'], history:['chart','السجل'], backup:['gear','الإعدادات'] };
Object.keys(NAV).forEach(k => { document.getElementById('nav-'+k).innerHTML = `<span class="ni">${icon(NAV[k][0])}</span><span class="nl">${NAV[k][1]}</span>`; });

/* ================= البيانات ================= */
let db = null;
try { db = JSON.parse(localStorage.getItem('gymdb_v2') || localStorage.getItem('gymdb') || '{"programs":[],"logs":[]}'); }
catch(e){ db = {programs:[], logs:[]}; }
if(!db.programs) db.programs = [];
if(!db.logs) db.logs = [];
if(!localStorage.getItem('gymdb_v2')){ localStorage.setItem('gymdb_v2', JSON.stringify(db)); }

let view = {name:'home'};
let session = null;
let restSec = 0, restInt = null;

const save = () => { localStorage.setItem('gymdb_v2', JSON.stringify(db)); updateBadge(); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
function updateBadge(){
  const w = weekCount();
  document.getElementById('statBadge').innerHTML = w > 0 ? `${icon('bolt')} ${w} هذا الأسبوع` : `${icon('gym')} ابدأ التمرين`;
  document.getElementById('statBadge').classList.toggle('hot', w > 0);
}
function go(name, extra={}){ view = {...view, name, ...extra}; stopRest(); render(); window.scrollTo(0,0); }
const prog = () => db.programs.find(p => p.id === view.pid);
const day = () => { const p = prog(); return p ? p.days.find(d => d.id === view.did) : null; };

function lastLog(exName){
  for(let i=db.logs.length-1;i>=0;i--){
    const e = db.logs[i].exercises.find(x=>x.name===exName);
    if(e) return {date:db.logs[i].date, sets:e.sets};
  }
  return null;
}
function exerciseHistory(exName){
  const out=[];
  db.logs.forEach(l=>{
    const e=l.exercises.find(x=>x.name===exName);
    if(e){ let best=0; e.sets.forEach(s=>{ const w=num(s.w); if(w>best) best=w; }); out.push({date:l.date, best, sets:e.sets}); }
  });
  return out;
}
function allExerciseNames(){
  const s=new Set();
  db.programs.forEach(p=>p.days.forEach(d=>d.exercises.forEach(e=>s.add(e.name))));
  db.logs.forEach(l=>l.exercises.forEach(e=>s.add(e.name)));
  return [...s];
}
function weekCount(){

function totalVolume(){

function drawProgressChart(canvasId, exName){
  const c=document.getElementById(canvasId); if(!c) return;
  const h=exerciseHistory(exName); if(!h.length) return;
  const dpr=window.devicePixelRatio||1;
  const W=c.clientWidth||560, H=220;
  c.width=W*dpr; c.height=H*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr);
  x.clearRect(0,0,W,H);
  const vals=h.slice(-12).map(o=>o.best);
  const max=Math.max(...vals,10), min=Math.min(...vals,0);
  const pad={t:16,r:12,b:28,l:40};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  x.strokeStyle='rgba(255,255,255,.08)'; x.fillStyle='#9aa6bd'; x.font='11px Cairo,Tahoma'; x.lineWidth=1;
  for(let g=0;g<=4;g++){ const v=min+(max-min)*g/4; const y=pad.t+ih-(ih*g/4);
    x.beginPath(); x.moveTo(pad.l,y); x.lineTo(W-pad.r,y); x.stroke();
    x.fillText((Math.round(v*10)/10)+' ك',2,y+4); }
  const px=i=> vals.length===1 ? pad.l+iw/2 : pad.l+iw*i/(vals.length-1);
  const py=v=> pad.t+ih-((v-min)/((max-min)||1)*ih);
  const grd=x.createLinearGradient(0,pad.t,0,pad.t+ih); grd.addColorStop(0,'rgba(255,122,24,.35)'); grd.addColorStop(1,'rgba(255,122,24,0)');
  x.beginPath(); vals.forEach((v,i)=>{ const X=px(i),Y=py(v); i?x.lineTo(X,Y):x.moveTo(X,Y); });
  x.strokeStyle='#ff7a18'; x.lineWidth=3; x.lineJoin='round'; x.stroke();
  x.lineTo(px(vals.length-1),pad.t+ih); x.lineTo(px(0),pad.t+ih); x.closePath(); x.fillStyle=grd; x.fill();
  vals.forEach((v,i)=>{ const X=px(i),Y=py(v);
    x.beginPath(); x.arc(X,Y,5,0,7); x.fillStyle='#22c55e'; x.fill();
    x.beginPath(); x.arc(X,Y,2.2,0,7); x.fillStyle='#fff'; x.fill();
    x.fillStyle='#fff'; x.fillText(v,X-10,Y-11); });
}
function refreshChart(){
  const sel=document.getElementById('chartEx'); if(!sel) return;
  const h=exerciseHistory(sel.value);
  const info=document.getElementById('chartInfo');
  if(!h.length){ if(info) info.innerHTML='لسه ملعبتش التمرين ده ولا مرة.'; return; }
  const best=Math.max(...h.map(o=>o.best));
  const first=h[0].best, last=h[h.length-1].best;
  const diff=Math.round((last-first)*10)/10;
  if(info) info.innerHTML=`لعبت <b>${h.length}</b> مرة • من <b>${first}</b> لـ <b>${last} كجم</b> • الأحسن <b>${best} كجم</b> • <b style="color:${diff>=0?'#4ade80':'#ff8f8f'}">${diff>=0?'▲ +':''}${diff} كجم</b>`;
  drawProgressChart('pchart', sel.value);
}

  session={pname:prog().name, dname:d.name, pid:view.pid, did:view.did, startTime:new Date().toLocaleString('ar-EG'),

function finishWorkout(){
  const log={id:uid(), ts:Date.now(), date:new Date().toLocaleString('ar-EG'), pname:session.pname, dname:session.dname, pid:session.pid, did:session.did,
    exercises:session.exercises.map(e=>({name:e.name, sets:e.sets.filter(s=>s.w!==''||s.r!=='').map(s=>({w:s.w,r:s.r}))}))};
  if(!log.exercises.length || log.exercises.every(e=>!e.sets.length)) return alert('سجّل وزن وعدات الأول');
  db.logs.push(log);
  const upd = confirm('تم حفظ التمرين\n\nتحب تحدّث الجدول الأساسي بأرقام النهارده؟');
  if(upd){
    const p=db.programs.find(x=>x.id===session.pid);
    if(p){ const d=p.days.find(x=>x.id===session.did);
      if(d){ d.exercises = log.exercises.map(e=>({name:e.name, sets:e.sets.length?e.sets:[{w:'',r:''}]})); } }
  }
  save(); session=null; stopRest();

}

    </div>`;
  }
  if(view.name==='history') setTimeout(refreshChart,50);
}
render(); updateBadge();
</script>
