<style>
:root{--bg:#0A0E0F;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.1);--line:rgba(0,230,118,.3);--line2:rgba(0,230,118,.55);
--text:#FFFFFF;--muted:#C3D6CC;--neon:#00E676;--neon2:#4DFF9D;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Tajawal","Cairo","Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;
background-color:#0A0E0F;background-image:radial-gradient(900px 420px at 85% -5%,rgba(0,230,118,.10),transparent 60%),radial-gradient(800px 420px at 10% -5%,rgba(0,255,136,.07),transparent 60%)}}
header{position:sticky;top:0;z-index:20;background:rgba(10,14,15,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hwrap{max-width:640px;margin:auto;padding:10px 14px;padding-top:max(10px, env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
body{padding-top:env(safe-area-inset-top, 0px);}
html,body{max-width:100%;overflow-x:hidden}
img{max-width:100%}.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}table.wt{min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand .tile{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;color:#04120a;font-weight:900;font-size:15px;font-family:Arial,sans-serif;box-shadow:0 0 22px rgba(0,230,118,.45)}
.brand b{font-size:20px;font-weight:900;display:block;line-height:1.1;letter-spacing:.5px}
.brand b i{font-style:normal;color:var(--neon)}
.brand small{font-size:11px;color:var(--muted);font-weight:500}
main{padding:16px 14px 120px;max-width:640px;margin:auto;overflow-x:hidden}
#app>*{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.card.glow{border-color:var(--line2);box-shadow:0 0 26px rgba(0,230,118,.16),0 12px 30px rgba(0,0,0,.35)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:800}
.card .sub{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.9}
button{font-family:inherit;cursor:pointer;transition:transform .07s,filter .15s}
button:active{transform:scale(.96)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800}
.btn .ic{width:19px;height:19px}
.btn-neon{background:linear-gradient(135deg,var(--neon),var(--neon2));border:0;color:#04120a;box-shadow:0 0 24px rgba(0,230,118,.4)}
.btn-block{width:100%;padding:15px;font-size:16px;border-radius:16px}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn-sm .ic{width:16px;height:16px}
.ibtn{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line2);color:#d6e4db;padding:0;margin:2px}
.ibtn .ic{width:18px;height:18px}
.ibtn.danger{color:#ff9c9c;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}
input,select{padding:11px 8px;font-size:16px;font-weight:700;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.4);color:#fff;text-align:center;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,230,118,.2)}
input.w{width:84px}input.r{width:84px}input.full{width:100%;text-align:right;margin:6px 0}
select.full{width:100%;text-align:right;margin:6px 0}
.row{display:flex;align-items:center;gap:6px;margin:7px 0;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,230,118,.08);border:1px solid var(--line2);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800;color:#c9f5da}
.badge .ic{width:15px;height:15px;color:var(--neon)}
.item{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:15.5px}
.item .meta{font-size:12px;color:var(--muted);font-weight:500}
.item.mainbtn{cursor:pointer}
.thumb{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(0,230,118,.1);border:1px solid var(--line2)}
.thumb svg{width:24px;height:24px;color:var(--neon)}
.setbox{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0}
.snum{min-width:30px;height:30px;border-radius:10px;background:rgba(0,230,118,.12);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:var(--neon2)}
.mini{font-size:12px;font-weight:700;color:var(--muted);background:transparent;border:1px dashed var(--line2);border-radius:10px;padding:7px 10px;font-family:inherit;cursor:pointer}
nav{position:fixed;bottom:12px;right:12px;left:12px;background:rgba(12,18,19,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:24px;display:flex;max-width:616px;margin:auto;z-index:20;overflow:hidden;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
nav button{flex:1;background:transparent;border:0;color:#a9bcb1;border-radius:18px;padding:9px 2px 7px;margin:2px;font-family:inherit;cursor:pointer}
nav button .ni{display:flex;justify-content:center}
nav button .ni svg{width:23px;height:23px}
nav button .nl{display:block;font-size:10px;font-weight:800;margin-top:2px}
nav button.active{color:var(--neon2);background:rgba(0,230,118,.12);box-shadow:inset 0 0 0 1px rgba(0,230,118,.4),0 0 18px rgba(0,230,118,.25)}
details{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
summary{cursor:pointer;font-weight:800;color:#b9f5d3;font-size:14px}
.exname{font-size:16px;font-weight:800;flex:1}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
.section-head h2{margin:0;font-size:17px;font-weight:900}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty svg{width:64px;height:64px;color:#47655a;margin-bottom:8px}
.ic{width:20px;height:20px;flex:none}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0}
.kv b{color:var(--text)}
#picker{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88vh;background:#0d1314;border:1px solid var(--line2);border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding:14px;animation:rise .25s ease}
.sheet .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet .top b{font-size:17px;font-weight:900}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line2);color:#d8e8de;font-weight:800;font-size:13px;font-family:inherit}
.chip.on{background:linear-gradient(135deg,var(--neon),var(--neon2));border:0;color:#04120a}
#pkList{overflow-y:auto;flex:1;padding-bottom:10px}
.pk{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:11px;margin:6px 0;color:var(--text);font-family:inherit;font-size:15px;font-weight:800}
.pk small{margin-right:auto;color:var(--muted);font-weight:700;font-size:11.5px}
#ob{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:24px 18px 40px}
.obbox{max-width:480px;margin:0 auto}
.obbox .step{font-size:13px;color:var(--neon);font-weight:800;margin-bottom:6px}
.obbox h1{font-size:26px;font-weight:900;margin:0 0 6px}
.obbox h1 i{font-style:normal;color:var(--neon)}
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.dchip{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line2);color:#fff;font-size:18px;font-weight:900;font-family:inherit}
.dchip.on{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#04120a;border:0;box-shadow:0 0 20px rgba(0,230,118,.45)}
.goalopt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;color:var(--text);font-family:inherit;font-size:16px;font-weight:800}
.goalopt.on{border-color:var(--neon);box-shadow:0 0 18px rgba(0,230,118,.25)}
#errbox{display:none;position:fixed;bottom:100px;right:12px;left:12px;z-index:99;background:#3b0d0d;border:1px solid #ef4444;border-radius:14px;padding:10px 14px;font-size:12.5px;font-weight:700}
.photo{width:100%;border-radius:14px;border:1px solid var(--line2);margin-top:8px}
table.wt{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.wt th{color:var(--neon);font-size:12px;padding:6px;border-bottom:1px solid var(--line2)}
table.wt td{text-align:center;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:700}
.meal{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:10px;margin:7px 0}
.meal .grow{flex:1}
.meal .nm{font-weight:800;font-size:14.5px}
.meal .kcal{font-size:12px;color:var(--neon);font-weight:800}
.verline{text-align:center;color:var(--muted);font-size:11px;margin:18px 0 4px;font-weight:700}
.subtabs{display:flex;gap:8px;margin-bottom:12px}
.subtabs button{flex:1;padding:11px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#b9cdc2;font-weight:800;font-size:14px;font-family:inherit}
.subtabs button.on{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#04120a;border:0}
.btn-outline{background:transparent;border:1.5px solid var(--neon);color:var(--neon2);box-shadow:0 0 18px rgba(0,230,118,.22)}
.heroart{position:relative;overflow:hidden;border-radius:24px;padding:22px 18px;margin-bottom:14px;border:1px solid var(--line2);background:linear-gradient(to left,rgba(4,12,9,.95) 28%,rgba(4,12,9,.55) 58%,rgba(4,12,9,.12) 85%),url('hero-bg.jpg') center left/cover;box-shadow:0 0 30px rgba(0,230,118,.15);min-height:215px}
.heroart h2{margin:0 0 4px;font-size:24px;font-weight:900;position:relative}
.heroart h2 i{font-style:normal;color:var(--neon2)}
.heroart p{margin:0 0 14px;font-size:14px;color:#eaf6ee;position:relative;line-height:1.9;font-weight:500}
.howto{display:flex;gap:12px;align-items:flex-start}
.howto img{width:42%;flex:none;border-radius:14px;border:1px solid var(--line)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}.stat2{min-width:0;overflow:hidden;padding:10px 6px}.stat2 .k{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.6}.stat2 .n{font-size:20px}
.stat2{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 9px}
.stat2 .n{font-size:19px;font-weight:900;line-height:1.1;white-space:nowrap}
.wmmark{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:30px;font-weight:900;color:#fff;opacity:.055;pointer-events:none;user-select:none;z-index:5;white-space:nowrap;letter-spacing:1px}.stat2 .k{font-size:10px;color:var(--muted);font-weight:700;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.5;word-break:break-word}
.stat2.hl{border-color:var(--line2);box-shadow:0 0 20px rgba(0,230,118,.22)}
.stat2.clickable{cursor:pointer}
.workout-cta{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px;margin-bottom:14px;border:1px solid var(--line2);background:linear-gradient(135deg,#03130b,#0a4a26 60%,#0d6b34);box-shadow:0 0 30px rgba(0,230,118,.25);display:flex;align-items:center;gap:12px;cursor:pointer}
.workout-cta .big{font-size:20px;font-weight:900;flex:1;line-height:1.5}
.workout-cta .big small{display:block;font-size:12.5px;font-weight:500;color:#c9e8d4}
.workout-cta .go{width:58px;height:58px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(0,230,118,.6)}
.workout-cta .go svg{width:26px;height:26px;color:#04120a}
@keyframes pulseGlow{0%{box-shadow:0 0 0 0 rgba(0,230,118,.55);}70%{box-shadow:0 0 0 18px rgba(0,230,118,0);}100%{box-shadow:0 0 0 0 rgba(0,230,118,0);}}
.workout-cta .go{animation:pulseGlow 2.2s infinite}
.ringwrap{display:flex;align-items:center;gap:10px}
#restbar{display:none;background:rgba(10,14,15,.95);border:1px solid var(--line2);border-radius:16px;padding:10px 14px;margin-bottom:10px;align-items:center;gap:10px;box-shadow:0 0 24px rgba(0,230,118,.3)}
#restbar{margin:10px 0 0}#restbar .lbl{font-size:12px;color:#c9e8d4;margin-bottom:6px}#restbar.done{border-color:#f5a623;box-shadow:0 0 24px rgba(245,166,35,.45)}#restbar.done .t{color:#f5a623}
#restbar .t{font-size:24px;font-weight:900;color:var(--neon2);min-width:70px;text-align:center}
#restbar .bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
#restbar .bar>div{height:100%;background:linear-gradient(90deg,var(--neon),var(--neon2));width:0%}
.prbanner{background:linear-gradient(135deg,#3a2a05,#6b4d08);border:1px solid #f5a623;border-radius:16px;padding:12px;margin:8px 0;text-align:center;box-shadow:0 0 24px rgba(245,166,35,.35);animation:rise .4s ease}
.prbanner b{font-size:17px;color:#ffd98a}
.noteinput{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line2);color:var(--muted);font-size:12px;padding:4px 2px;margin-top:4px;font-family:inherit;outline:none}
.noteinput:focus{border-color:var(--neon);color:#fff}
.prchip{display:inline-flex;align-items:center;gap:5px;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.5);color:#ffd98a;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;margin:3px}
.warmnote{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.4);border-radius:12px;padding:8px 12px;font-size:12.5px;color:#bcd3f5;margin:6px 0;line-height:1.8}
.steps{list-style:none;margin:8px 0 0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;margin:11px 0;font-size:14px;line-height:1.9;color:#e6f2ea}
.steps li b{flex:none;width:26px;height:26px;border-radius:9px;background:rgba(0,230,118,.14);border:1px solid var(--line2);color:var(--neon2);display:flex;align-items:center;justify-content:center;font-size:13px}
.field{position:relative;flex:1;display:flex;min-width:0}
.field svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--neon);pointer-events:none}
.field input{width:100%;text-align:right;padding-right:42px}
.dashedbtn{width:100%;border:1.5px dashed var(--line2);border-radius:14px;background:transparent;color:var(--muted);padding:12px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;margin:7px 0}
.dashedbtn .ic{width:19px;height:19px}
.swapbtn{font-size:11.5px;font-weight:800;color:var(--neon2);background:rgba(0,230,118,.1);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-family:inherit}
.swapbtn .ic{width:13px;height:13px;vertical-align:-2px}
.startpill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--neon);color:var(--neon2);border-radius:999px;padding:8px 16px;font-weight:900;font-size:13.5px;background:rgba(0,230,118,.07);box-shadow:0 0 18px rgba(0,230,118,.3);font-family:inherit}
.startpill svg{width:17px;height:17px}
.hlogo{width:42px;height:42px;border-radius:14px;box-shadow:0 0 18px rgba(0,230,118,.45)}
.side2{display:flex;gap:10px}
.side2 .card{flex:1;margin-bottom:14px;text-align:center;cursor:pointer}
.side2 .thumb{margin:0 auto 6px}
.side2 b{font-size:14px}
input::placeholder{color:#93aca0;opacity:1}
select{color:#fff}
#lb{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:18px}
.lbbox{max-width:520px;width:100%;background:#0d1314;border:1px solid var(--line2);border-radius:22px;padding:14px;animation:rise .25s ease}
.lbbox img{width:100%;border-radius:14px;border:1px solid var(--line)}
.lbbox h3{margin:10px 0 4px;font-size:18px;font-weight:900}
.exthumb{width:52px;height:52px;flex:none;border-radius:14px;object-fit:cover;border:1px solid var(--line2);background:rgba(0,230,118,.08)}
.exthumb.fallback{display:flex;align-items:center;justify-content:center}
.exthumb.fallback svg{width:24px;height:24px;color:var(--neon)}
.sessbox{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.7}.sessbox.today{border-color:rgba(0,230,118,.35)}
.loginhero{text-align:center;padding:34px 18px}.loginhero img{width:110px;height:110px;border-radius:30px;box-shadow:0 0 40px rgba(0,230,118,.4)}
.paybox{border:2px solid var(--neon);border-radius:18px;padding:14px;margin:10px 0;background:rgba(0,230,118,.06)}
.paybox.hot{box-shadow:0 0 26px rgba(0,230,118,.3)}
.admrow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;flex-wrap:wrap;min-width:0;overflow:hidden}.admrow>*{min-width:0}.admrow img{flex:none}
.syncdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.wmodal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:20px}
.repctl{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.repctl input{flex:1;min-width:0}
.repctl .ibtn{width:44px;height:44px;font-size:22px;font-weight:900}
.repchips{display:flex;gap:6px;margin:2px 0 6px}
.btn-danger{background:linear-gradient(135deg,#ef4444,#f87171);border:0;color:#2a0a0a;box-shadow:0 0 24px rgba(239,68,68,.35)}
#sheetIn{width:100%;text-align:right;margin:6px 0}
.planchips{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.planchip{flex:1;min-width:70px;text-align:center;font-size:12.5px;font-weight:800;padding:7px 4px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--muted)}
.planchip.on{background:rgba(0,230,118,.18);border-color:var(--neon);color:#c9f5da;box-shadow:0 0 12px rgba(0,230,118,.3)}
.affhead{display:flex;align-items:center;gap:8px;background:rgba(0,230,118,.06);border:1px solid var(--line2);border-radius:14px;padding:10px;margin:8px 0;cursor:pointer}
.statgrid3{display:flex;gap:6px;margin:6px 0}
.statgrid3 div{flex:1;text-align:center;background:rgba(255,255,255,.04);border-radius:10px;padding:6px 2px;font-size:12px}
.adot{position:absolute;top:8px;inset-inline-start:14px;width:10px;height:10px;border-radius:50%;background:#ff5252;box-shadow:0 0 8px #ff5252}
nav button{position:relative}
.cardio-banner{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;cursor:pointer;border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.cardio-banner img{width:100%;height:130px;object-fit:cover;display:block}
.cardio-banner .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(4,8,7,.92) 10%,rgba(4,8,7,.15) 70%);display:flex;align-items:flex-end;gap:10px;padding:12px 14px}
.cardio-banner .ov b{font-size:19px;font-weight:900;display:block}
.cardio-banner .ov small{font-size:12px;color:var(--muted)}
.offergo{width:40px;height:40px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;color:#04120a;font-size:20px;font-weight:900}
.cardio-banner .go{width:44px;height:44px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;color:#04120a}
#cdone{font-size:15px;font-weight:800;color:var(--neon2)}
select.w{min-height:44px}
.repchips button{flex:1;background:rgba(0,230,118,.08);border:1px solid var(--line2);color:var(--neon2);border-radius:10px;padding:7px 0;font-size:14px;font-weight:800;font-family:inherit}
.wmodal .sheet{background:#0d1512;border:2px solid var(--neon);border-radius:24px;max-width:420px;width:100%;padding:22px;text-align:center;box-shadow:0 0 40px rgba(0,230,118,.35);max-height:88vh;overflow:auto}
.stepper{display:flex;align-items:stretch;gap:6px;flex:1;min-width:0}.stepval{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.4);border:1px solid var(--line2);border-radius:12px;min-height:58px;min-width:0}.stepval b{font-size:22px;line-height:1}.stepval small{font-size:10px;color:var(--muted)}.stepcol{display:flex;flex-direction:column;gap:6px}.stepcol .ibtn{width:36px;height:26px;font-size:15px;border-radius:9px}details.howto summary::-webkit-details-marker{display:none}html[dir="ltr"] body{text-align:left;font-family:"Segoe UI",Arial,Tahoma,sans-serif}html[dir="ltr"] button,html[dir="ltr"] input,html[dir="ltr"] select,html[dir="ltr"] textarea{font-family:inherit}html[dir="ltr"] input,html[dir="ltr"] textarea,html[dir="ltr"] select{text-align:left !important}html[dir="ltr"] [style*="text-align:right"]{text-align:left !important}</style>

<script>
'use strict';
/* ============ HM Fit v4 — النسخة النيون ============ */
const VER='7.0.0';
const GOALS={lose:'تخسيس',same:'ثبات',gain:'زيادة'};
const ICONS={
home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/>',

function icon(n,cls){return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}
/* ============ البيانات ============ */
function blankProfile(){return {onboarded:false,days:3,weight:'',height:'',age:'',gender:'m',goal:'lose',nutrition:false,notif:{on:false,time:'20:00',days:[0,1,2,3,4,5,6]},rest:120,tpl:2000};}
function blankDB(){return {v:4,uid:uid(),profile:blankProfile(),program:null,weights:{},prs:{},body:[]};}
function cleanSet(s){s=s||{};return{w:(s.w==null?'':String(s.w)),r:(s.r==null?'':String(s.r))};}
function cleanEx(e){e=e||{};const arr=(e.sets&&e.sets.length)?e.sets:[{w:'',r:''}];return{name:String(e.name||'تمرين'),muscle:String(e.muscle||'عام'),desc:String(e.desc||''),sets:arr.map(cleanSet)};}
let db=blankDB();
function migrate(){
  if(!db.prs)db.prs={};if(!db.profile.notif)db.profile.notif={on:false,time:'20:00',days:[0,1,2,3,4,5,6]};
  Object.keys(db.weights).forEach(function(n){
    const a=db.weights[n]||[];
    a.forEach(function(x){if(!x.s)x.s='old';});
    a.forEach(function(x){const w=num(x.w);const cur=db.prs[n];if(w>0&&(!cur||w>num(cur.w)))db.prs[n]={w:String(x.w),r:String(x.r||''),d:x.d||''};const rm=epley1RM(x.w,x.r);if(rm>0&&(!db.prs[n].rm||rm>db.prs[n].rm))db.prs[n].rm=rm;});
  });
  if(db.program&&db.program.tpl&&db.program.tpl!=='custom'){
    db.program.days.forEach(function(d){if(/^[A-Za-z +()\/]+ [A-F]( \/ [A-Za-z +]+ [A-F])?$/.test(d.name))d.name=d.name.replace(/ ([A-F])(?= \/|$)/g,function(m,c){return ' '+(c.charCodeAt(0)-64);});});
  }
}
try{
  const raw=localStorage.getItem('hmfit_v4');
  if(raw){db=JSON.parse(raw);if(!db.profile)db.profile=blankProfile();if(!db.weights)db.weights={};if(!db.body)db.body=[];migrate();}
  else{
    const oldRaw=localStorage.getItem('hmfit_v1')||localStorage.getItem('gymdb_v2')||localStorage.getItem('gymdb');
    if(oldRaw){
      const o=JSON.parse(oldRaw);db.profile=blankProfile();
      if(o.programs&&o.programs.length){
        const p=o.programs[0];
        db.program={id:(p.id||uid()),name:String(p.name||'برنامجي'),tpl:'custom',days:(p.days||[]).map(function(d){return{id:String(d.id||uid()),name:String(d.name||'يوم'),exercises:(d.exercises||[]).map(cleanEx)};})};
      }
      if(o.goal){if(o.goal.targetWeight)db.profile.tpl=2000;}
      (o.body||[]).forEach(function(x){db.body.push({ts:(x.ts||0),date:String(x.date||''),weight:(x.weight||''),fat:'',photo:String(x.photo||''),chest:(x.chest||''),waist:(x.waist||''),arm:(x.arm||''),thigh:(x.thigh||'')});});
    }
  }
}catch(e){db=blankDB();}
let view={name:'home'};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':String(s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
let _saveWarned=0;
function save(){let ok=true;try{localStorage.setItem('hmfit_v4',JSON.stringify(db));}catch(e){ok=false;if(Date.now()-_saveWarned>15000){_saveWarned=Date.now();alert('مساحة التخزين على الجهاز اتملت ومش قادر أحفظ التعديل ده!\nامسح شوية صور تقدم قديمة من «جسمي»، واعمل نسخة احتياطية من «المزيد».');}}updateBadge();queueCloud();return ok;}
function storeKB(){try{return Math.round((localStorage.getItem('hmfit_v4')||'').length*2/1024);}catch(e){return 0;}}
function go(name,extra){view.name=name;if(extra)for(const k in extra)view[k]=extra[k];render();setTimeout(lazyWatch,30);if(window.scrollTo)window.scrollTo(0,0);}
function updateBadge(){const el=document.getElementById('goalBadge');if(el)el.innerHTML=icon('bolt')+' '+(GOALS[db.profile.goal]||'');
 try{const nm=document.getElementById('nav-more');if(nm){nm.innerHTML=nm.innerHTML.replace(/<span class="adot"><\/span>/g,'');if(anncUnseen()&&view.name!=='more')nm.innerHTML+='<span class="adot"></span>';}}catch(e){}}
function anncUnseen(){try{return !!(view.annc&&view.annc.msg&&(view.annc.ts>+(localStorage.getItem('hmfit_annc_seen')||0)));}catch(e){return false;}}
function anncSeen(){try{if(view.annc)localStorage.setItem('hmfit_annc_seen',''+(view.annc.ts||Date.now()));}catch(e){}updateBadge();render();}
function dateKey(t){const d=t?new Date(t):new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayDoneId(did){try{var dd=(db.program&&db.program.doneDays)||{};return dd[did]||0;}catch(e){return 0;}}
function markDayDone(did){try{if(!db.program)return;db.program.doneDays=db.program.doneDays||{};db.program.doneDays[did]=Date.now();db.program.lastDid=did;db.program.lastDate=dateKey();save();}catch(e){}}
function nextDayIdx(){try{var pg=db.program;if(!pg||!pg.days.length)return -1;var dones=0,firstOpen=-1;for(var i=0;i<pg.days.length;i++){var dd=pg.days[i];var dn=dayDoneId(dd.id);var isToday=(dn&&new Date(dn).toDateString()===new Date().toDateString());if(!dn&&firstOpen<0)firstOpen=i;}if(firstOpen>=0)return firstOpen;return 0;}catch(e){return 0;}}
function todayIdx(){const p=db.program;if(!p||!p.days.length)return -1;if(!p.lastDid)return 0;const i=p.days.findIndex(function(d){return d.id===p.lastDid;});if(i<0)return 0;return p.lastDate===dateKey()?i:(i+1)%p.days.length;}
function startToday(){const ti=todayIdx();if(ti<0)return go('workout');go('trainday',{did:db.program.days[ti].id});}
const LIB=[
['صدر',[['بنش مستوي بار','نام على ضهرك على البنش المسطح، رجلك ثابتة على الأرض. امسك البار بقبضة أوسع من الكتف بشوية، نزّله ببطء لحد ما يلمس منتصف صدرك، وادفع لفوق. حافظ على كوعك بزاوية 45 درجة من جسمك (لا تلزقه ولا تفتحه 90).'],['بنش مستوي دمبل','نام على ضهرك على البنش المسطح ودمبل في كل إيد عند مستوى الصدر. انزل بالدمبلين لتحت ببطء (كوعك 45 درجة) لحد ما تحس بشد في الصدر، وادفع لفوق لحد ما يتقابلوا فوق صدرك.'],['بنش عالي بار','البنش مائل لفوق حوالي 30 درجة. امسك البار بقبضة أوسع من الكتف ونزّله لأعلى الصدر (تحت الترقوة) وادفع لفوق بخط مستقيم.'],['بنش عالي دمبل','على بنش مائل 30 درجة ودمبل في كل إيد. انزل بالدمبلين لحد أعلى الصدر (كوعك 45 درجة) وادفع لفوق.'],['بنش منخفض','البنش مائل لتحت ورجلك متثبتة. نزّل البار لأسفل صدرك وادفع لفوق — بيركّز على الجزء السفلي.'],['بنش جهاز','ضهرك لازق في الكرسي ورجلك ثابتة على الأرض. امسك المقبضين وادفع لقدام لحد ما دراعك تتفرد، ورجّع ببطء.'],['فلاي دمبل','نام ودراعك شبه مفرودة (تنية بسيطة في الكوع) ودمبل في كل إيد. افتح على شكل حضن واسع وانزل لتحت، وسكّر لفوق.'],['فلاي كابل','واقف في النص بين الكابلين واخد خطوة لقدام. بدراع شبه مفرودة اسحب الكابلين لتحت وقدام صدرك على شكل حضن.'],['فلاي جهاز','اظبط الكرسي بحيث المقابض عند مستوى صدرك. اسحب الدراعين لبعض قدام صدرك واعصر، ورجّع ببطء.'],['كروس أوفر كابل','الكابلين فوق على العالي. امسك واحد في كل إيد واسحب لتحت على شكل X قدام جسمك.'],['ضغط صدر جهاز','قاعد في جهاز الصدر وضهرك لازق في الكرسي. ادفع المقابض لقدام لحد ما دراعك تتفرد، ورجّع ببطء من غير ما الأوزان تخبط.'],['بوش أب','جسمك خط واحد من الراس للكعب وإيدك تحت كتفك. انزل بصدرك لتحت وادفع لفوق. لو صعب اعمله على ركبك.'],['متوازي للصدر','على جهاز المتوازي (الدبس) ميّل جسمك لقدام. انزل بصدرك لتحت لحد ما كوعك 90 درجة وادفع لفوق — كل ما تميل أكتر الصدر يشتغل أكتر.'],['بول أوفر دمبل','نام بالعرض على البنش وامسك دمبل واحد بإيديك الاتنين فوق صدرك. نزّله ورا راسك لحد ما تحس بشد خفيف بس (متنزلش للآخر) وارجع — المدى الزيادة بيضغط على الكتف.'],['بنش عالي جهاز','اقعد في جهاز البنش العالي وضهرك لازق في الكرسي. ادفع المقبضين لفوق لحد ما دراعك تتفرد، ورجّع ببطء.']]],
['ضهر',[['العقلة','اتعلق على البار بقبضة أوسع من كتفك وراحة الإيد لقدام. اسحب جسمك لفوق لحد ما دقنك تعدي البار وانزل ببطء للآخر.'],['سحب علوي واسع','قاعد في جهاز السحب والبار فوقك بقبضة واسعة. اسحب البار لتحت لحد أعلى صدرك وصدرك لبره، ورجّع ببطء.'],['سحب علوي ضيق','نفس العلوي بس قبضة ضيقة (مثلث أو متوازي وراحة الإيد لبعض). اسحب لتحت لحد صدرك وركّز على اللاتس.'],['سحب أرضي كابل','قاعد في جهاز السحب الأرضي ورجلك متثبتة وضهرك مفرود. اسحب مقبض الكابل لبطنك وكوعك لورا جنب جسمك، ورجّع ببطء.'],['رو بار منحني','واقف وميّل ضهرك 45 درجة وركبك متنية والبار تحتك. اسحب البار لبطنك وضهرك ثابت ومفرود تمامًا.'],['رو دمبل','إيد وركبة على البنش، والدمبل في الإيد التانية مدلدل لتحت. اسحب الدمبل لفوق لجنبك لحد وسطك وانزل ببطء.'],['رو جهاز','الصدر لازق في مسند الجهاز. اسحب المقابض لورا وكوعك جنب جسمك، ورجّع ببطء.'],['تي بار رو','واقف على جهاز التي بار وماسك المقبض بإيديك الاتنين. اسحب لصدرك وضهرك ثابت، وانزل بتحكم.'],['تي بار جهاز','صدرك لازق في مسند الجهاز ورجلك متثبتة. اسحب المقابض لصدرك وكوعك لورا، وانزل بتحكم — ثبات كامل بدون تحميل على القطنية.'],['سحب أمامي بذراع مفرودة','واقف قدام الكابل وماسك البار المستقيم بدراع مفرودة. اسحب المقبض لتحت لحد وراك من غير ما تتني كوعك.'],['ديدلفت','للمتقدمين فقط — اتقن الروماني الأول. البار على الأرض قدام قصبة رجلك، ضهرك مفرود تمامًا طول الحركة، وارفّع بفخادك وضهرك. أي تقويس في الضهر = وقف فورًا.'],['هايبر اكستنشن','ثبّت رجلك في الجهاز وانزل بجسمك لتحت، واطلع لفوق بأسفل ضهرك لحد ما جسمك خط واحد.']]],
['أكتاف',[['ضغط أكتاف دمبل','اقعد على بنش وضهرك مسنود ودمبل في كل إيد عند مستوى ودنك. ادفع لفوق لحد ما يتقابلوا وانزل ببطء لحد مستوى الودن — القعدة بتثبّت ضهرك وتمنع الإصابة.'],['ضغط أكتاف بار قاعد','قاعد والبار قدام وشك على مستوى الترقوة. ادفع لفوق من غير ما تقوّس ضهرك وانزل بتحكم.'],['ضغط أكتاف جهاز','اظبط الكرسي بحيث المقابض عند ودنك. ادفع لفوق ورجّع ببطء.'],['رفرفة جانبي دمبل','واقف ودمبل في كل إيد جنبك. ارفع الدمبلين للجنب لحد مستوى الكتف — مرفقك أعلى من إيدك بشوية وكوعك متني تنية خفيفة ثابتة — وانزل ببطء.'],['رفرفة جانبي كابل','واقف جنب الكابل السفلي وماسك المقبض بالإيد البعيدة والكابل معدي من قدام جسمك. ارفع دراعك للجنب لحد مستوى الكتف ورجّع ببطء — المقاومة ثابتة طول الحركة.'],['رفرفة أمامي','واقف ودمبل في كل إيد قدام فخادك. ارفع دراع واحد لقدام لحد مستوى الكتف وانزل، وبدّل.'],['رفرفة خلفي منحني','ميّل جسمك لقدام وضهرك مفرود ودمبل في كل إيد مدلدلين. افتح دراعك للجنب لورا وركّز على الكتف الخلفي.'],['فيس بول','الكابل على مستوى وشك وماسك الحبل (المقبض الحبلي) بإيديك الاتنين. اسحب الحبل لوشك وكوعك لفوق ولبره، واعصر كتفك الخلفي في الآخر.'],['أرنولد برس','ابدأ والدمبل قدام صدرك وراحة الإيد ليك. وانت طالع لفوق لف إيدك لبره لحد ما يتقابلوا فوق راسك.'],['سحب بار للذقن','واقف وماسك البار بقبضة واسعة (أوسع من الكتف بكتير) وارفع لحد نص الصدر بس — مترفعش للدقن. لو كتفك بيضايقك شيله خالص واستبدله برفرفة جانبي.'],['رفرفة خلفي جهاز','اقعد في جهاز الفراشة بالعكس (صدرك ناحية المسند). امسك المقبضين وافتح دراعك للجنب لورا واعصر كتفك الخلفي، ورجّع ببطء.']]],
['باي',[['باي بار مستقيم','واقف والبار المستقيم في إيدك وراحة الإيد لقدام. كوعك لازق في جنبك واطلع بالبار لفوق وانزل للآخر.'],['باي بار متعرج','نفس المستقيم بس بالبار المتعرج (EZ) — القبضة مريحة أكتر للرسغ. اطلع وانزل للآخر.'],['باي دمبل بالتبادل','واقف ودمبل في كل إيد. اطلع بدراع واحدة ونزّل التانية بالتبادل، ولف رسغك وانت طالع.'],['باي هامر','واقف ودمبل في كل إيد بالقبضة المحايدة (راحة الإيد لجوه زي المطرقة). اطلع لفوق وكوعك ثابت في جنبك وانزل ببطء للآخر.'],['باي بريتشر','دراعك على مسند البريتشر وماسك البار أو الدمبل. اطلع وانزل للآخر بوزن معتدل من غير ما تحدف.'],['باي كابل','واقف قدام الكابل السفلي وماسك البار المستقيم أو الحبل. اسحب لفوق وكوعك لازق في جنبك، وانزل للآخر ببطء.'],['باي تركيز','قاعد وكوعك ساند على فخدك من جوه وماسك الدمبل. اطلع بتركيز وانزل ببطء للآخر.'],['باي مقعد مائل','قاعد على كرسي مائل 45 درجة والدمبل مدلدل لتحت. اطلع وانزل للآخر — الوضعية دي بتطوّل الرأس الطويلة.']]],
['تراي',[['تراي حبل','الكابل فوق وماسك الحبل (المقبض الحبلي) بإيديك الاتنين وكوعك لازق في جنبك. افرد دراعك لتحت وافتح الحبل في الآخر واعصر التراي.'],['تراي بار كابل','واقف قدام الكابل وماسك البار المستقيم بإيديك الاتنين وكوعك لازق في جنبك. اسحب البار لتحت لحد ما دراعك تتفرد تمامًا.'],['تراي خلف الرأس دمبل','الدمبل ورا راسك بإيد واحدة أو اتنين. افرد دراعك لفوق من غير ما يتحرك كوعك.'],['تراي خلف الرأس بالكابل','ضهرك للكابل وماسك الحبل ورا راسك بإيديك الاتنين. افرد دراعك لفوق من غير ما يتحرك كوعك — أأمن على الكوع من الدمبل.'],['سكال كراشر','نام على ضهرك وماسك البار المتعرج (EZ) فوق وشك. نزّل البار لجبهتك بتحريك الساعد بس وافرد لفوق — بوزن معتدل، ولو كوعك بيوجعك استبدله بخلف الرأس دمبل.'],['ضغط ضيق','نام على البنش وامسك البار بقبضة بعرض الكتف (مش أضيق). انزل بصدرك وادفع لفوق — القبضة الأضيق من كده بتوجع الرسغ والكوع.'],['ديبس مقعد','إيدك على البنش وراك ورجلك قدامك. انزل لحد ما كوعك 90 درجة بس (متنزلش للآخر) واطلع — النزول العميق بيضغط على الكتف الأمامي.'],['كيك باك','ميّل جسمك لقدام وضهرك مفرود ودمبل في إيدك وكوعك متني لورا عند وسطك. افرد دراعك لورا بالكامل واعصر التراي فوق.'],['تراي جهاز','قاعد في جهاز التراي وماسك المقبض. ادفع المقبض لتحت لحد الفرد ورجّع ببطء.']]],
['رجل',[['سكوات بار','البار الحر على كتفك الخلفي ورجلك أوسع من الكتف بشوية. انزل لحد ما فخدك يوازي الأرض (أو لتحت لو تقدر) وضهرك مفرود، واطلع.'],['سكوات أمامي','البار قدام كتفك على الترقوة وكوعك لفوق. انزل بضهر مفرود تمامًا واطلع.'],['هاك سكوات','ضهرك لازق في مسند الجهاز ورجلك على البليت. انزل واطلع من غير ما ركبك تعدي مشط رجلك.'],['ليج بريس','قاعد ورجلك على البليت أوسع من الكتف. نزّل البليت لتحت وادفع لفوق من غير ما تفرد ركبك للآخر.'],['ليج اكستنشن','قاعد والرول على مشط رجلك. افرد رجلك لفوق وثبّت ثانية فوق وانزل ببطء.'],['ليج كيرل نائم','نايم على بطنك والرول ورا كعبك. اتني رجلك لفوق لورا وانزل ببطء.'],['ليج كيرل جلوس','قاعد في الجهاز ومتثبت. اتني رجلك لتحت بتحكم للآخر — أحسن من النائم للنمو.'],['رومانيان ديدلفت','واقف والبار أو الدمبل في إيدك ورجلك شبه مفرودة. ادفع وركك لورا وانزل بالوزن لحد نص الساق (البار قريب من رجلك) وضهرك مفرود، وارجع — الفرق عن الديدلفت إن الوزن مش بينزل الأرض.'],['لانجز دمبل','واقف ودمبل في كل إيد. خد خطوة لقدام وانزل بركبتك الخلفية لتحت (90 درجة) وارجع. بدّل الرجلين.'],['بلغاري سبليت سكوات','رجل ورا على البنش ورجل قدامك. انزل باللي قدام واطلع — من أقوى تمارين الرجل الأمامية.'],['هيب ثرست','كتفك على البنش ورجلك على الأرض والبار على وسطك. ادفع وسطك لفوق واعصر الجلوتس فوق.'],['سمانة واقف','واقف على مشط رجلك على درجة (كعبك في الهوا). اطلع لفوق على قد ما تقدر وانزل للآخر ببطء.'],['سمانة جلوس','قاعد في جهاز السمانة والوزن على فخادك. اطلع على مشط رجلك وانزل للآخر ببطء.'],['تقريب جهاز','اقعد في جهاز التقريب (رجلك بره المساند). سكّر رجلك لبعض ببطء واعصر الفخد الداخلي، وارجع بتحكم.']]],
['بطن',[['كرانش','نام على ضهرك ورجلك متنية وإيدك ورا راسك من غير شد. اطلع بكتفك لفوق.'],['رفع رجل معلق','متعلق على البار ورجلك مدلدلة. ارفع رجلك لفوق لحد 90 درجة (أو ركبك لصدرك) وانزل ببطء.'],['بلانك','على كوعك ومشط رجلك وجسمك خط واحد من الراس للكعب. ثبّت بطنك مشدودة ومتنزّلش وسطك.'],['كرانش كابل','راكع قدام الكابل وماسكه ورا راسك. انزل بصدرك لتحت واعصر بطنك.'],['روسيان تويست','قاعد ورجلك مرفوعة (أو على الأرض) وماسك وزن. لف وسطك يمين وشمال.'],['عجلة البطن','على ركبك وماسك العجلة بإيديك الاتنين. افرد لقدام على قد ما تقدر وارجع ببطنك مش بضهرك.'],['رفع رجل أرضي','نام على ضهرك وارفع رجلك المفرودة لفوق وانزل ببطء من غير ما ضهرك يقوّس.'],['سايد بلانك','على جنبك على كوع واحد ورجلك فوق بعض. جسمك خط واحد وثبّت الجنب مشدود.']]],
['ترابيس وساعد',[['شراغز بار','واقف وماسك البار بإيديك الاتنين جنبك. ارفع كتفك لفوق ناحية ودنك من غير ما تتني كوعك، وثبّت ثانية ونزّل ببطء.'],['شراغز دمبل','واقف ودمبل تقيل في كل إيد جنبك. ارفع كتفك لفوق على قد ما تقدر ونزّل ببطء — متحركش دراعك.'],['ساعد بار','قاعد وساعدك على فخدك أو بنش وماسك البار وراحة إيدك لفوق. اطلع بالبار لرسغك لفوق وانزل للآخر ببطء.'],['ساعد عكسي','نفس الساعد بس راحة الإيد لتحت وماسك البار أو الدمبل. اطلع وانزل بتحكم — بيقوّي الساعد الخارجي.']]],
['كارديو',[['مشي على السير','مشي سريع 20-30 دقيقة.'],['جري','جري متوسط الشدة للإحماء أو التخسيس.'],['دراجة ثابتة','بدّل بمقاومة متوسطة 20 دقيقة.'],['إليبتكال','حركة كاملة إيد ورجل 20 دقيقة.'],['حبل نط','3 جولات دقيقة مع راحة.'],['تجديف','اقعد في جهاز التجديف (أو الكابل) وامسك المقبض. ادفع برجلك واسحب المقبض لصدرك مع بعض، وارجع بتحكم.'],['جامبنج جاكس','نط مع فتح الرجلين ورفع الإيدين لفوق زي الرفرفة الجانبي، وانزل لجنب جسمك — وكرر بإيقاع ثابت.'],['هاي نيز','اجري في مكانك وارفع ركبتك لفوق لحد ما تقرب من إيدك، والإيد التانية بتتحرك زي الجري — وبدّل بسرعة.'],['قفز تبديلي','نط وبدّل: رجل قدام ورجل ورا، مع رفع الإيدين تبادلي لقدام — وانزل سوفت وكرر.']]]
];
function libMuscles(){return LIB.map(function(x){return x[0];});}
/* ============ نوافذ التطبيق (بدل رسائل المتصفح) ============ */
let _sheetFn=null,_sheetCb=null;
function openSheet(title,body){pkMode='sheet';const p=document.getElementById('picker');p.style.display='flex';document.getElementById('pkTitle').textContent=title;document.getElementById('pkClose').innerHTML=icon('x');const q=document.getElementById('pkQ');q.style.display='none';document.getElementById('pkChips').innerHTML='';document.getElementById('pkList').innerHTML=body;}
function noteSheet(msg){openSheet('HM Fit','<p class="sub" style="text-align:center;line-height:2.1">'+msg+'</p><button class="btn btn-neon btn-block" onclick="closePicker()">تمام</button>');}
function askSheet(title,msg,ok,danger,fn){_sheetFn=fn;openSheet(title,'<p class="sub" style="text-align:center;line-height:2.1">'+msg+'</p><div class="row"><button class="btn" style="flex:1" onclick="closePicker()">إلغاء</button><button class="btn '+(danger?'btn-danger':'btn-neon')+'" style="flex:1" onclick="sheetGo()">'+ok+'</button></div>');}
function sheetGo(){closePicker();try{if(_sheetFn)_sheetFn();}catch(e){} _sheetFn=null;}
function inputSheet(title,initial,chips,okLabel,cb){_sheetCb=cb;let h='<input class="full" id="sheetIn" value="'+esc(initial||'')+'" placeholder="'+(myRegion()==='en'?'Type the name':'اكتب الاسم')+'">';

let swapTarget=null;
function swapEx(dx,ei){
  const d=(dx&&dx.exercises)?dx:((db.program&&db.program.days)?db.program.days[dx]:null);if(!d)return;
  const e=d.exercises[ei];if(!e)return;

  if(!alts.length)return alert('مفيش بدائل للتمرين ده — اختار بديل من المكتبة');
  swapTarget={d:d,ei:ei,alts:alts,cur:e.name};
  pkMode='swap';
  document.getElementById('pkTitle').textContent='اختار البديل';
  document.getElementById('pkQ').style.display='';
  document.getElementById('picker').style.display='flex';
  document.getElementById('pkClose').innerHTML=icon('x');
  const q=document.getElementById('pkQ');q.value='';q.placeholder='ابحث في البدائل…';

  swapRender('');

function swapRender(q){

  const list=t.alts.filter(function(a){return !q||a.indexOf(q)>-1;});
  document.getElementById('pkList').innerHTML=list.length?list.map(function(a){
    const i=t.alts.indexOf(a);
    return '<button class="pk" onclick="pickSwapEx('+i+')">'+exThumb(a)+'<span class="grow" style="text-align:right"><span dir="ltr">'+esc(exEN(a))+'</span><br><small>'+(myRegion()==='en'?'':esc(a))+'</small></span>'+icon('swap')+'</button>';

}
function pickSwapEx(i){
  const t=swapTarget;if(!t)return;

}

function mkSets(n){const a=[];for(let i=0;i<n;i++)a.push({w:'',r:''});return a;}
function ex(name,sets){return {name:name,muscle:'',desc:libDesc(name),sets:mkSets(sets||2),base:true};}
function makeProgramGo(tplKey,days){
  const P=BUILD[tplKey+'_'+days]||BUILD[tplKey+'_3'];
  let names,daysEx;
  if(tplKey==='custom'){names=[];for(let i=0;i<days;i++)names.push((myRegion&&myRegion()==='en'?'Day ':'يوم ')+(i+1));daysEx=names.map(function(){return [];});}
  else{names=P.map(function(d){return d[0];});daysEx=P.map(function(d){return d[1].map(function(t){return ex(t[0],t[1]);});});}
  if(tplKey!=='custom'&&(db.profile.gender==='f')){const ad=adaptForWomen(names,daysEx);names=ad.names;daysEx=ad.daysEx;}
  db.program={id:uid(),name:tplKey==='custom'?(myRegion&&myRegion()==='en'?'My Custom Program':'برنامجي الخاص'):tplName(tplKey),tpl:tplKey,days:names.map(function(n,i){return{id:uid(),name:n,exercises:daysEx[i]};})};

}

/* نسخة البنات: نفس التمارين الأساسية + تركيز جلوتس/رجل أعلى وتردد أعلى — حسب الأبحاث */
const GLUTE_ROT=[['هيب ثرست',2],['تقريب جهاز',2],['بلغاري سبليت سكوات',2],['لانجز دمبل',2]];
const GLUTE_SET=['هيب ثرست','تقريب جهاز','بلغاري سبليت سكوات','لانجز دمبل','رومانيان ديدلفت','سكوات بار','ليج بريس'];
function adaptForWomen(names,daysEx){
  let gi=0;
  const out=daysEx.map(function(exs,di){
    const has=exs.filter(function(e){return GLUTE_SET.indexOf(e.name)>-1;}).length;
    const isLower=/رجل|Legs|سفلي|Lower/i.test(names[di]||'');
    const need=isLower?(has<3?1:0):(has<1?1:0);
    if(!need||exs.length>=11)return exs.slice();
    const pick=GLUTE_ROT[gi++%GLUTE_ROT.length];
    if(exs.some(function(e){return e.name===pick[0];}))return exs.slice();
    const cp=exs.slice();cp.push(ex(pick[0],pick[1]));return cp;
  });
  return {names:names,daysEx:out};
}

function makeProgram(tplKey,days){
  if(tplKey!=='custom'){
    const need={ppl:3,arnold:3,bro:3}[tplKey]||0;
    if(days<need){noteSheet('نظام '+tplName(tplKey)+' محتاج '+need+' أيام على الأقل.<br>اختار عدد أيام أكبر، أو جرّب Full Body.');return;}

    if((tplKey==='ppl'||tplKey==='arnold')&&days===3){askSheet('جلسات تقيلة','النظام ده في 3 أيام = جلسات طويلة (20-30 مجموعة).<br>لو طاقتك قليلة جرّب Full Body أو زوّد يوم.','كمّل كده',false,function(){makeProgramGo(tplKey,days);});return;}
  }
  makeProgramGo(tplKey,days);
}

/* ============ أوزاني — آخر 3 جلسات ============ */
function prOf(n){const p=db.prs&&db.prs[n];return p?num(p.w):0;}
function epley1RM(w,r){w=num(w);r=parseInt(r)||0;if(!w||!r)return 0;return Math.round(w*(1+r/30));}
function best1RM(n){const p=db.prs&&db.prs[n];return p&&p.rm?p.rm:0;}
/* جلسات التمرين: كل يوم = جلسة، بنحتفظ بآخر 3 جلسات بكل مجموعاتها */
function sessionsOf(n){const a=db.weights[n]||[];const out=[],map={};a.forEach(function(x,i){const k=x.s||('old'+i);if(!map[k]){map[k]={k:k,d:x.d,sets:[]};out.push(map[k]);}map[k].sets.push({w:x.w,r:x.r,note:x.note,i:i});});out.forEach(function(se){se.sets.reverse();let mx=0;se.sets.forEach(function(t){if(num(t.w)>mx)mx=num(t.w);});se.max=mx;se.first=se.sets[0];se.last=se.sets[se.sets.length-1];});return out;}
function sessLabel(se){const EN=myRegion()==='en';if(se.k===dateKey())return EN?'Today':'النهارده';if(/^old/.test(se.k))return EN?'Old session':'جلسة قديمة';const p=se.k.split('-');return p[2]+'/'+p[1];}
function fmtSet(t){return esc(t.w||'—')+(myRegion()==='en'?' kg × ':' كجم × ')+esc(t.r||'—');}
let restTimer=null,restTotal=0,restLeft=0,restEnd=0,restEx=null,restDone=false;
let _actx=null;
function unlockAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!_actx)_actx=new C();if(_actx.state==='suspended')_actx.resume();const o=_actx.createOscillator(),g=_actx.createGain();g.gain.value=0.0001;o.connect(g);g.connect(_actx.destination);o.start();o.stop(_actx.currentTime+0.02);}catch(e){}}
function beep(){try{if(!_actx)return;if(_actx.state==='suspended')_actx.resume();[0,0.35,0.7].forEach(function(t){const o=_actx.createOscillator(),g=_actx.createGain();o.type='sine';o.frequency.value=t>0.6?1175:880;const st=_actx.currentTime+t;g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(0.5,st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,st+0.28);o.connect(g);g.connect(_actx.destination);o.start(st);o.stop(st+0.3);});}catch(e){}}
function startRest(sec,exKey){unlockAudio();restTotal=sec;restEnd=Date.now()+sec*1000;restEx=exKey||null;restDone=false;clearInterval(restTimer);restTimer=setInterval(tickRest,250);}
function tickRest(){restLeft=Math.max(0,Math.ceil((restEnd-Date.now())/1000));drawRest();if(restLeft<=0&&!restDone){restDone=true;clearInterval(restTimer);beep();try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}}
try{document.addEventListener('visibilitychange',function(){if(!document.hidden&&restEnd&&!restDone)tickRest();});}catch(e){}
function drawRest(){const el=document.getElementById('restbar');if(!el)return;el.style.display='flex';el.classList.toggle('done',restLeft<=0);const t=el.querySelector('.t'),b=el.querySelector('.bar>div'),l=el.querySelector('.lbl');const m=Math.floor(restLeft/60),ss=restLeft%60;const ENR=myRegion()==='en';if(t)t.textContent=restLeft<=0?(ENR?'Go!':'يلا!'):(m+':'+String(ss).padStart(2,'0'));const bt=el.querySelector('button');if(bt)bt.textContent=restLeft<=0?(ENR?'Done':'تمام'):(ENR?'Skip':'تخطي');if(l)l.textContent=restLeft<=0?(ENR?'Rest over — start your next set':'الراحة خلصت — ابدأ المجموعة الجاية'):(ENR?'Rest before next set':'راحة قبل المجموعة الجاية');if(b)b.style.width=(restTotal?Math.round((restTotal-restLeft)/restTotal*100):0)+'%';}
function stopRest(){clearInterval(restTimer);restEx=null;restEnd=0;const el=document.getElementById('restbar');if(el)el.remove();}
function restBarHTML(){const EN=myRegion()==='en';return '<div id="restbar"><div style="flex:1;min-width:0"><div class="lbl">'+(EN?'Rest before next set':'راحة قبل المجموعة الجاية')+'</div><div class="bar"><div></div></div></div><span class="t">0:00</span><button class="btn btn-sm" onclick="stopRest()">'+(EN?'Skip':'تخطي')+'</button></div>';}
function attachRest(scroll){if(!restEx||!restEnd)return;restLeft=Math.max(0,Math.ceil((restEnd-Date.now())/1000));drawRest();if(scroll){const el=document.getElementById('restbar');if(el){const r=el.getBoundingClientRect();if(r.bottom>innerHeight-90||r.top<70)el.scrollIntoView({block:'center',behavior:'smooth'});}}}
function wGet(n){return db.weights[n]||[];}
function wAdd(n,w,r,note){
  if(!n||(!w&&!r))return;
  const a=db.weights[n]||[];
  const d=new Date().toLocaleString(loc());
  a.unshift({w:String(w),r:String(r),note:(typeof note!=='undefined'?note:''),d:d,s:dateKey()});
  const keep=[];a.forEach(function(x,i){const k=x.s||('old'+i);if(keep.indexOf(k)<0)keep.push(k);});
  const last3=keep.slice(0,3);
  db.weights[n]=a.filter(function(x,i){return last3.indexOf(x.s||('old'+i))>-1;});
  if(!db.prs)db.prs={};
  const cur=db.prs[n]||{w:'0',rm:0};
  if(num(w)>num(cur.w)){cur.w=String(w);cur.r=String(r);cur.d=d;}
  const rm=epley1RM(w,r);if(rm>(cur.rm||0))cur.rm=rm;
  if(num(cur.w)>0||cur.rm)db.prs[n]=cur;
  save();
}
function wDel(n,idx){askSheet('حذف المجموعة؟','المجموعة دي هتتمسح من السجل نهائي.','حذف',true,function(){const a=db.weights[n]||[];a.splice(idx,1);if(!a.length){delete db.weights[n];view.wex=null;}save();render();});}
function prReset(n){askSheet('تصفير أحسن وزن؟','«أحسن وزن» للتمرين ده هيرجع يتحسب من جديد. السجل نفسه مش هيتمسح.','صفّر',true,function(){doPrReset(n);});}
function doPrReset(n){delete db.prs[n];const a=db.weights[n]||[];a.forEach(function(x){wPRtouch(n,x);});save();render();}
function wPRtouch(n,x){const cur=db.prs[n]||{w:'0',rm:0};if(num(x.w)>num(cur.w)){cur.w=String(x.w);cur.r=String(x.r);cur.d=x.d;}const rm=epley1RM(x.w,x.r);if(rm>(cur.rm||0))cur.rm=rm;if(num(cur.w)>0)db.prs[n]=cur;}

  const w=document.getElementById('wW'),r=document.getElementById('wR'),nt=document.getElementById('wN');

function repStep(i,d){const el=document.getElementById('tr_'+i);if(!el)return;let v=(parseInt(el.value)||8)+d;v=Math.max(1,Math.min(99,v));const dp=document.getElementById('trv_'+i);if(dp)dp.textContent=String(v);let f=false;for(let k=0;k<el.options.length;k++)if(el.options[k].value==String(v))f=true;if(!f){const o=document.createElement('option');o.value=String(v);o.textContent=v+(myRegion()==='en'?' reps':' عدات');el.appendChild(o);}el.value=String(v);}
function repPick(i,v){const el=document.getElementById('tr_'+i);if(!el)return;repStep(i,0);el.value=String(v);}
function logSet(i){
  const d=day();if(!d||!d.exercises[i])return;const n=d.exercises[i].name;
  const w=document.getElementById('tw_'+i),r=document.getElementById('tr_'+i),nt=document.getElementById('tn_'+i);
  const wv=w?w.value.trim():'',rv=r?r.value.trim():'';
  if(!wv&&!rv)return alert('دخل الوزن أو العدات الأول');
  const prevPR=prOf(n);
  wAdd(n,wv,rv,(nt&&nt.value.trim())||'');
  view.lastPR=(num(wv)>prevPR)?{i:i,w:wv,first:!(prevPR>0)}:null;
  if(!view.keepIn)view.keepIn={};view.keepIn[i]={w:wv,r:rv};
  try{var _dk=dateKey();db.wdays=db.wdays||[];if(db.wdays.indexOf(_dk)<0){db.wdays.push(_dk);if(db.wdays.length>90)db.wdays=db.wdays.slice(-90);}}catch(e){}
  db.program.lastDid=d.id;db.program.lastDate=dateKey();save();
  startRest(num(db.profile.rest)||120,d.id+':'+i);render();attachRest(true);
}

function ctDraw(i){const box=document.getElementById('ctxt_'+i);if(!box)return;const s=_ct[i];if(!s){box.innerHTML='';return;}const m=Math.floor(Math.max(0,s.left)/60),ss=Math.max(0,s.left)%60;const t=m+':'+String(ss).padStart(2,'0');
 if(s.done){box.innerHTML=s.mode==='work'?'<span id="cdone">خلص! عاش \uD83D\uDCAA</span> <button class="btn btn-sm" onclick="cardioRest('+i+')">راحة</button> <button class="btn btn-sm" onclick="cardioStart('+i+')">من الأول</button>':'<span id="cdone">يلا اللي بعده \uD83D\uDD25</span> <button class="btn btn-sm" onclick="cardioStart('+i+')">من الأول</button>';return;}
 box.innerHTML='<span class="muted">'+(s.mode==='work'?'التمرين: ':'راحة: ')+'</span><span id="cdone">'+t+'</span> <button class="btn btn-sm" onclick="cardioPause('+i+')">'+(s.run?'إيقاف مؤقت':'كمّل')+'</button> <button class="btn btn-sm" onclick="cardioRest('+i+')">راحة</button>';}

function cardioStart(i){const sl=document.getElementById('cdur_'+i);const mins=sl?+sl.value:2;ctStop(i);unlockAudio();_ct[i]={left:mins*60,mode:'work',run:true,done:false,timer:null};_ct[i].timer=setInterval(function(){ctStep(i);},1000);ctDraw(i);}

function shareDay(did){
  const p=db.program;if(!p)return;const d=p.days.find(function(x){return x.id===did;});if(!d)return;
  const EN2=myRegion()==='en';const rows=d.exercises.map(function(e){const ss=sessionsOf(e.name);const t=ss[0]&&ss[0].k===dateKey()?ss[0]:null;return {n:e.name,v:t?(EN2?('top '+t.max+' kg'+' \u2022 '+t.sets.length+(t.sets.length===1?' set':' sets')):('أعلى '+t.max+' كجم • '+t.sets.length+' '+(t.sets.length===1?'مجموعة':'مجموعات'))):''};}).filter(function(x){return x.v;});
  if(!rows.length)return noteSheet(EN2?'Log at least one set today first, then share your workout.':'سجّل مجموعة واحدة على الأقل النهارده الأول، وبعدين شارك تمرينتك.');
  const txt=EN2?('My workout today from HM Fit ('+d.name+'):\n'+rows.map(function(x){return '• '+x.n+': '+x.v;}).join('\n')+'\n#HM_Fit'):('تمرينتي النهارده من HM Fit ('+d.name+'):\n'+rows.map(function(x){return '• '+x.n+': '+x.v;}).join('\n')+'\n#HM_Fit');
  const W=1080,rowH=76;
  const H=480+rows.length*rowH+120;
  const build=function(logo){
    let cv=null;
    try{
      cv=document.createElement('canvas');cv.width=W;cv.height=H;
      const x=cv.getContext('2d');
      x.fillStyle='#0A0E0F';x.fillRect(0,0,W,H);
      x.fillStyle='#00E676';x.fillRect(0,0,W,12);
      const gr=x.createLinearGradient(0,0,0,420);gr.addColorStop(0,'rgba(0,230,118,.20)');gr.addColorStop(1,'rgba(0,230,118,0)');
      x.fillStyle=gr;x.fillRect(0,12,W,408);
      try{x.direction='rtl';}catch(e){}
      x.textAlign='center';
      if(logo){try{x.save();x.beginPath();x.arc(W/2,140,85,0,7);x.clip();x.drawImage(logo,W/2-85,55,170,170);x.restore();}catch(e){logo=null;}}
      if(!logo){x.fillStyle='#00E676';x.font='bold 110px Tahoma, Arial';x.fillText('HM',W/2,200);}
      x.fillStyle='#00E676';x.font='bold 56px Tahoma, Arial';x.fillText('HM Fit',W/2,300);
      x.fillStyle='#ffffff';x.font='bold 48px Tahoma, Arial';x.fillText(d.name,W/2,365);
      x.fillStyle='#8a9a9c';x.font='28px Tahoma, Arial';x.fillText(new Date().toLocaleDateString(loc()),W/2,405);
      x.strokeStyle='#00E676';x.lineWidth=3;x.beginPath();x.moveTo(90,432);x.lineTo(W-90,432);x.stroke();
      rows.forEach(function(r,i){const y=500+i*rowH;
        x.textAlign='right';x.fillStyle='#ffffff';x.font='34px Tahoma, Arial';x.fillText(r.n,W-70,y);
        x.textAlign='left';x.fillStyle='#00E676';x.font='bold 34px Tahoma, Arial';x.fillText(r.v,70,y);
        x.strokeStyle='#1c2a2c';x.lineWidth=1;x.beginPath();x.moveTo(70,y+22);x.lineTo(W-70,y+22);x.stroke();});
      x.textAlign='center';x.fillStyle='#00E676';x.font='bold 30px Tahoma, Arial';
      x.fillText('سجل • تتبع • تطور',W/2,H-45);
    }catch(e){cv=null;}
    if(!cv){window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');return;}
    let url=null;try{url=cv.toDataURL('image/png');}catch(e){url=null;}
    if(!url){window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');return;}
    const dlOnly=function(){
      try{const a2=document.createElement('a');a2.href=url;a2.download='hmfit-'+dateKey()+'.png';document.body.appendChild(a2);a2.click();setTimeout(function(){a2.remove();},2000);}catch(e){}
      openSheet('صورة تمرينتك جاهزة ✅','<div style="text-align:center"><img src="'+url+'" style="width:100%;border-radius:14px;border:1px solid var(--line2)"><p class="sub">اتحفظت الصورة بهوية HM Fit — شاركها مع رسالتك:</p></div><div class="row"><button class="btn" style="flex:1" onclick="closePicker()">تمام</button><button class="btn btn-neon" style="flex:1" onclick="window.open(\'https://wa.me/?text='+encodeURIComponent(txt)+'\',\'_blank\')">مشاركة واتساب</button></div>');
    };
    try{
      if(navigator.canShare&&url.indexOf('data:')===0){
        fetch(url).then(function(r){return r.blob();}).then(function(bl){
          try{
            const f=new File([bl],'hmfit-'+dateKey()+'.png',{type:'image/png'});
            if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:'HM Fit',text:txt}).catch(function(err){if(err&&err.name!=='AbortError')dlOnly();});return;}
          }catch(e){}
          dlOnly();
        }).catch(function(){dlOnly();});
      }else dlOnly();
    }catch(e){dlOnly();}
  };
  const img=new Image();try{img.crossOrigin='anonymous';}catch(e){}let done=false;
  const go=function(){if(done)return;done=true;build(img.complete&&img.naturalWidth?img:null);};
  img.onload=go;img.onerror=go;img.src='hm-logo-192.png';setTimeout(go,1500);
}

const I18N_PART=Object.keys(I18N).filter(function(k){return k&&(k.length>=4||k.charAt(0)===' ');}).sort(function(a,b){return b.length-a.length;});
function enRep(h){let out=h;for(let i=0;i<I18N_PART.length;i++){const k=I18N_PART[i];if(out.indexOf(k)>-1)out=out.split(k).join(I18N[k]);}return out;}
const MSA_PART=Object.keys(MSA).filter(function(k){return k&&(k.length>=4||k.charAt(0)===' ');}).sort(function(a,b){return b.length-a.length;});
function msaRep(h){let out=h;for(let i=0;i<MSA_PART.length;i++){const k=MSA_PART[i];if(out.indexOf(k)>-1)out=out.split(k).join(MSA[k]);}return out;}
function msaNode(s){const t=s.trim();if(!t)return s;if(Object.prototype.hasOwnProperty.call(MSA,t)){return s.replace(t,MSA[t]);}return msaRep(s);}
function msaDOM(root){if(!root||myRegion()!=='ar')return;try{
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){const p=n.parentNode;if(!p)return NodeFilter.FILTER_REJECT;const t=p.tagName;if(t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA')return NodeFilter.FILTER_REJECT;if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
 const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(function(n){const o=n.nodeValue;if(/[\u0600-\u06FF]/.test(o))n.nodeValue=msaNode(o);});
 const els=root.querySelectorAll?root.querySelectorAll('*'):[];
 els.forEach(function(el){['placeholder','title','aria-label','alt'].forEach(function(a){try{const v=el.getAttribute&&el.getAttribute(a);if(v&&/[\u0600-\u06FF]/.test(v))el.setAttribute(a,msaNode(v));}catch(e){}});});
}catch(e){}}
function enNode(s){const t=s.trim();if(!t)return s;if(Object.prototype.hasOwnProperty.call(I18N,t)){return s.replace(t,I18N[t]);}return enRep(s);}
function T9(h){try{return appLang()==='en'?enRep(h):h;}catch(e){return h;}}

 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){const p=n.parentNode;if(!p)return NodeFilter.FILTER_REJECT;const t=p.tagName;if(t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA')return NodeFilter.FILTER_REJECT;if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
 const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(function(n){const o=n.nodeValue;if(/[\u0600-\u06FF]/.test(o))n.nodeValue=enNode(o);});
 const els=root.querySelectorAll?root.querySelectorAll('*'):[];
 els.forEach(function(el){['placeholder','title','aria-label','alt'].forEach(function(a){try{const v=el.getAttribute&&el.getAttribute(a);if(v&&/[\u0600-\u06FF]/.test(v))el.setAttribute(a,enNode(v));}catch(e){}});});

function i18nObserve(){if(_i18nObs)return;try{_i18nObs=new MutationObserver(function(ms){try{const r=myRegion();if(r!=='en'&&r!=='ar')return;ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1){if(r==='en')translateDOM(n);else msaDOM(n);}else if(n.nodeType===3&&n.parentNode&&/[\u0600-\u06FF]/.test(n.nodeValue||''))if(r==='en')n.nodeValue=enNode(n.nodeValue);else n.nodeValue=msaNode(n.nodeValue);});});}catch(e){}});_i18nObs.observe(document.body,{childList:true,subtree:true});}catch(e){}}

const MEALS_AR=[['الفطار',.28],['الغداء',.38],['سناك',.10],['العشاء',.24]];
function mealDefs(){const r=myRegion();return r==='en'?MEALS_EN:(r==='ar'?MEALS_GULF:MEALS_AR);}
function calcBMR(){const p=db.profile,W=num(p.weight),H=num(p.height),A=num(p.age);if(!W||!H||!A)return 0;return Math.round(10*W+6.25*H-5*A+(p.gender==='f'?-161:5));}
function curAdj(){const p=db.profile;if(typeof p.adj==='number')return p.adj;return p.goal==='lose'?-400:(p.goal==='gain'?300:0);}
function adjOpts(){const g=db.profile.goal;if(myRegion()==='en')return adjOptsEN();if(g==='lose')return[[-500,'آمن'],[-750,'متوسط'],[-1000,'\u26A0\uFE0F عالي — لفترة قصيرة']];if(g==='gain')return[[250,'عضل صافي'],[400,'متوسط'],[600,'سريع — دهون أعلى']];return[[0,'ثبات']];}
function setAdj(v){db.profile.adj=+v;save();view.ntpl=null;view.nmeals=null;render();}
function calcTDEE(){
  const p=db.profile,W=num(p.weight),H=num(p.height),A=num(p.age);
  if(!W||!H||!A)return 0;
  let bmr=10*W+6.25*H-5*A+(p.gender==='f'?-161:5);
  const act=num(p.act)||1.55;
  let t=bmr*act;
  t+=curAdj();
  const minSafe=p.gender==='f'?1200:1500;
  if(t<minSafe)t=minSafe;
  return Math.round(t/10)*10;
}
function seededRand(seed){let s=seed;return function(){s=(s*9301+49297)%233280;return s/233280;};}
function foodOK(fi){const f=FOODS[fi];if(!f||!f.al)return true;for(let i=0;i<f.al.length;i++)if(view.noFood&&view.noFood.indexOf(f.al[i])>-1)return false;return true;}
function toggleNoFood(k){if(!view.noFood)view.noFood=[];const i=view.noFood.indexOf(k);if(i>-1)view.noFood.splice(i,1);else view.noFood.push(k);view.nmeals=null;save();render();}
function mealSlotDefs(){
 const r=myRegion();
 if(r==='ar')return[
  {key:'bf',share:.28,maxItems:3,groups:['bf']},
  {key:'lu',share:.38,maxItems:3,groups:['lu']},
  {key:'sn',share:.10,maxItems:2,groups:['sn']},
  {key:'di',share:.24,maxItems:3,groups:['di']}
 ];
 return[
  {key:'bf',share:.25,maxItems:3,groups:['bf']},
  {key:'lu',share:.35,maxItems:3,groups:['lu']},
  {key:'sn',share:.10,maxItems:2,groups:['sn']},
  {key:'di',share:.30,maxItems:3,groups:['di']}
 ];
}
function buildMeals(tpl){
 const rnd=seededRand(tpl*7+3);
 const slots=mealSlotDefs();
 const names={bf:'الفطور',lu:'الغداء',sn:'وجبة خفيفة',di:'العشاء'};
 if(myRegion()==='en'){names.bf='Breakfast';names.lu='Lunch';names.sn='Snack';names.di='Dinner';}
 const pool=FOODS.map(function(f,i){return{i:i,f:f};}).filter(function(x){return foodOK(x.i);});
 const bySlot={bf:[],lu:[],sn:[],di:[],any:[]};
 pool.forEach(function(x){
  const s=x.f.slot||'any';
  if(bySlot[s])bySlot[s].push(x);else bySlot.any.push(x);
 });
 const pickN=function(arr,n){
  const c=arr.slice().sort(function(){return rnd()-.5;});
  return c.slice(0,n);
 };
 const used={};
 const meals=slots.map(function(s){
  const m={name:names[s.key]||s.key,target:Math.round(tpl*s.share),items:[],slot:s.key};
  let cand=bySlot[s.key].concat(bySlot.any);
  if(!cand.length)cand=pool.slice();
  const core=cand.filter(function(x){return isCore(x.i);});
  const rest=cand.filter(function(x){return !isCore(x.i);});
  const ord=pickN(core,core.length).concat(pickN(rest,rest.length));
  var groups={};
  m.items.forEach(function(it){var gg=FOODS[it.fi].g;groups[gg]=(groups[gg]||0)+1;});
  let sum=0;
  for(let k=0;k<ord.length&&m.items.length<s.maxItems;k++){
   const cand=ord[k];
   const kc=cand.f.a[1];
   if(used[cand.i])continue;
   var gg=cand.f.g;
   if(gg!=='free'&&(groups[gg]||0)>=1){
    var hasRoom=false;
    for(let q=k+1;q<ord.length;q++){if(!used[ord[q].i]&&ord[q].f.g!==gg&&(ord[q].f.g==='free'||!(groups[ord[q].f.g]||0))){hasRoom=true;break;}}
    if(hasRoom&&sum+kc<=m.target+80)continue;
   }
   if(sum+kc<=m.target+80){m.items.push({fi:cand.i,side:'a'});sum+=kc;used[cand.i]=1;groups[gg]=(groups[gg]||0)+1;}
  }
  if(!m.items.length&&ord.length)m.items.push({fi:ord[0].i,side:'a'});
  return m;
 });
 view.maxItemsBySlot={};
 slots.forEach(function(s){view.maxItemsBySlot[s.key]=s.maxItems;});
 view.nmeals=meals;
}
function mealTotal(m){let s=0;m.items.forEach(function(it){const f=FOODS[it.fi];s+=it.side==='a'?f.a[1]:f.b[1];});return s;}

function readPhoto(inp){
  try{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=function(){
      try{
        const img=new Image();
        img.onload=function(){
          try{
            const mx=700,sc=Math.min(1,mx/Math.max(img.width,img.height));
            const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
            cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
            const prev=document.getElementById('photoPrev');
            if(prev){prev.src=cv.toDataURL('image/jpeg',.65);prev.style.display='block';}
          }catch(e){alert('الصورة دي مش نافعة');}
        };
        img.src=r.result;
      }catch(e){alert('الصورة دي مش نافعة');}
    };
    r.readAsDataURL(f);
  }catch(e){alert('المتصفح ده مش بيدعم الصور');}
}

function weekReport(){
  const ws=(db.body||[]).filter(function(x){return num(x.weight)>0;}).sort(function(a,b){return a.ts-b.ts;});
  if(ws.length<2)return '';
  const EN=myRegion()==='en';
  const cur=ws[ws.length-1];let prev=null;
  for(let i=ws.length-2;i>=0;i--){if(cur.ts-ws[i].ts>=6*86400000){prev=ws[i];break;}}
  if(!prev)prev=ws[ws.length-2];
  const d=Math.round((num(cur.weight)-num(prev.weight))*10)/10;
  const days=Math.max(1,Math.round((cur.ts-prev.ts)/86400000));
  const line=d<0?(EN?'Down <b style="color:var(--neon)">'+Math.abs(d)+' kg</b> \uD83D\uDC89':'نزلت <b style="color:var(--neon)">'+Math.abs(d)+' كجم</b> \uD83D\uDC89'):d>0?(EN?'Up <b style="color:#ffb74d">'+d+' kg</b> \uD83D\uDCAA':'زدت <b style="color:#ffb74d">'+d+' كجم</b> \uD83D\uDCAA'):(EN?'Weight steady \u2705':'وزنك ثابت \u2705');

}

function pickAvatar(inp){
 try{
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){
   try{
    const img=new Image();
    img.onload=function(){
     try{
      const mx=256,sc=Math.min(1,mx/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*sc));cv.height=Math.max(1,Math.round(img.height*sc));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const u=cv.toDataURL('image/jpeg',.85);
      view._avatar=u;const pv=document.getElementById('avPrev');if(pv)pv.src=u;
     }catch(e){noteSheet('الصورة دي مش نافعة');}
    };
    img.src=r.result;
   }catch(e){noteSheet('الصورة دي مش نافعة');}
  };
  r.readAsDataURL(f);
 }catch(e){}
 inp.value='';
}

function adminAct(uid,act){
  const ref=firebase.firestore().collection('users').doc(uid);
  ref.get().then(function(ds){
    const o=ds.exists?ds.data():{};
    const now=Date.now(),D=86400000;
    let u={};
    if(act==='month')u={subUntil:Math.max(now,o.subUntil||0)+30*D,blocked:false};
    if(act==='quarter')u={subUntil:Math.max(now,o.subUntil||0)+90*D,blocked:false};
    if(act==='year')u={subUntil:Math.max(now,o.subUntil||0)+365*D,blocked:false};
    if(act==='week')u={subUntil:Math.max(now,o.subUntil||0)+7*D,blocked:false};
    if(act==='block')u={blocked:!o.blocked};else{u.measUnlockUntil=now+24*3600000;u.actNote=now;}
    const label=act==='month'?'تفعيل شهر لـ ':act==='quarter'?'تفعيل 3 شهور لـ ':act==='year'?'تفعيل سنة لـ ':act==='week'?'تمديد أسبوع لـ ':'تغيير حالة ';
    _sheetFn=function(){ref.set(u,{merge:true}).then(function(){adminLoad();}).catch(function(e){noteSheet('فشل: '+(e&&e.message));});};
    askSheet('تأكيد','هل '+label+'<b>'+esc(o.email||uid)+'</b>؟','تأكيد',act==='block',function(){ref.set(u,{merge:true}).then(function(){adminLoad();}).catch(function(e){noteSheet('فشل: '+(e&&e.message));});});
    return;
  });
}
