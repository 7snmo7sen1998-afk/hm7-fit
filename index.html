<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0d13">
<title>HM Fit | سجّل تمرينك وتابع تطوّرك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d13;--card:#131926;--line:#233052;--line2:#2e3d63;--text:#f5f7fc;--muted:#9aa6bd;
--b1:#ff7a18;--b2:#ff2d55;--green:#22c55e;--green-d:#15803d;--red:#ef4444;--blue:#3b82f6;--gold:#f5a623;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;
background:radial-gradient(1000px 480px at 85% -5%,rgba(255,45,85,.12),transparent 60%),radial-gradient(900px 480px at 10% -5%,rgba(255,122,24,.12),transparent 60%),radial-gradient(1200px 700px at 50% 110%,#141d33 0%,var(--bg) 60%) fixed,var(--bg)}
header{position:sticky;top:0;z-index:20;background:rgba(10,13,19,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hwrap{max-width:640px;margin:auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand .tile{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--b1),var(--b2));display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(255,70,60,.42);color:#fff;font-weight:900;font-size:16px;font-family:Arial,sans-serif}
.brand b{font-size:20px;font-weight:900;display:block;line-height:1.1}
.brand b i{font-style:normal;background:linear-gradient(135deg,var(--b1),var(--b2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-size:11px;color:var(--muted);font-weight:600}
main{padding:16px 14px 120px;max-width:640px;margin:auto}
#app>*{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,#161e30,#101624);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 14px 34px rgba(0,0,0,.42)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:800}
.card .sub{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.8}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px;margin-bottom:14px;border:1px solid #3a2b4d;background:linear-gradient(135deg,#2a1440 0%,#3d1530 45%,#57200f 100%);box-shadow:0 16px 40px rgba(255,45,85,.22)}
.hero h2{margin:0 0 4px;font-size:22px;font-weight:900}
.hero p{margin:0 0 14px;font-size:13.5px;color:#e8c9d4;line-height:1.8}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:linear-gradient(180deg,#172033,#101624);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center}
.stat .v{font-size:21px;font-weight:900;line-height:1.2}
.stat .v em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.stat.hl{border-color:rgba(255,122,24,.5);box-shadow:0 0 0 1px rgba(255,122,24,.25),0 10px 26px rgba(255,90,40,.18)}
button{font-family:inherit;cursor:pointer;transition:transform .07s,filter .15s}
button:active{transform:scale(.96)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#222c44;color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800}
.btn:hover{filter:brightness(1.12)}
.btn .ic{width:19px;height:19px}
.btn-primary{background:linear-gradient(135deg,var(--b1),var(--b2));border:0;color:#fff;box-shadow:0 10px 26px rgba(255,80,50,.42)}
.btn-green{background:linear-gradient(135deg,var(--green-d),var(--green));border:0;color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.35)}
.btn-red{background:linear-gradient(135deg,#b91c1c,var(--red));border:0;color:#fff}
.btn-gold{background:linear-gradient(135deg,#b45309,var(--gold));border:0;color:#241100}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#cfd8ea}
.btn-block{width:100%;padding:16px;font-size:16px;border-radius:16px}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn-sm .ic{width:16px;height:16px}
.ibtn{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#1b2440;border:1px solid var(--line2);color:#c6d0e2;padding:0;margin:2px}
.ibtn .ic{width:18px;height:18px}
.ibtn.danger{color:#ff8f8f;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4)}
.ibtn.go{color:#7dffa9;background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.45)}
input,select{padding:11px 8px;font-size:16px;font-weight:700;border-radius:12px;border:1px solid #31405e;background:#0b1120;color:#fff;text-align:center;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--b1)}
input.w{width:84px}input.r{width:84px}input.full{width:100%;text-align:right;margin:6px 0}
select.full{width:100%;text-align:right;margin:6px 0}
.row{display:flex;align-items:center;gap:6px;margin:7px 0;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800;color:#d5ddee}
.badge .ic{width:15px;height:15px;color:var(--b1)}
.badge.hot{border-color:rgba(255,122,24,.5);color:#ffd9ad}
.item{display:flex;align-items:center;gap:8px;background:#0d1424;border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:15.5px}
.item .meta{font-size:12px;color:var(--muted);font-weight:600}
.item.mainbtn{cursor:pointer;border-color:#33436b;background:linear-gradient(180deg,#17223a,#10182b)}
.thumb{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#233052,#10182b);border:1px solid var(--line2)}
.thumb svg{width:24px;height:24px;color:var(--b1)}
.thumb.g svg{color:var(--green)}.thumb.r svg{color:var(--red)}.thumb.b svg{color:var(--blue)}.thumb.y svg{color:var(--gold)}
.setbox{background:#0b1120;border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0}
.setbox .shead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.snum{min-width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#2b3a5e,#16203a);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.done-set{background:rgba(34,197,94,.1)!important;border-color:rgba(34,197,94,.55)!important}
.checkbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:11px;font-weight:800;font-size:14px;border:1px solid var(--line2);background:#1a2233;color:#aeb9cf;font-family:inherit;cursor:pointer}
.checkbtn.on{background:linear-gradient(135deg,var(--green-d),var(--green));border:0;color:#fff}
.mini{font-size:12px;font-weight:800;color:var(--muted);background:transparent;border:1px dashed #33436b;border-radius:10px;padding:7px 10px;font-family:inherit;cursor:pointer}
.timer{position:sticky;top:66px;z-index:5;background:linear-gradient(135deg,#4c1d95,#7c3aed);border:1px solid #8b5cf6;border-radius:18px;padding:12px;text-align:center;font-size:19px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.progress{height:10px;background:#0a0f1c;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:linear-gradient(90deg,var(--green-d),#4ade80);transition:width .3s}
nav{position:fixed;bottom:12px;right:12px;left:12px;background:rgba(14,19,31,.96);backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:24px;display:flex;max-width:616px;margin:auto;z-index:20;overflow:hidden;padding:5px}
nav button{flex:1;background:transparent;border:0;color:#7d89a1;border-radius:18px;padding:9px 2px 7px;margin:2px;font-family:inherit;cursor:pointer}
nav button .ni{display:flex;justify-content:center}
nav button .ni svg{width:23px;height:23px}
nav button .nl{display:block;font-size:10px;font-weight:800;margin-top:2px}
nav button.active{background:linear-gradient(135deg,rgba(255,122,24,.28),rgba(255,45,85,.28));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,122,24,.45)}
canvas.chart{width:100%;height:220px;background:#080c15;border:1px solid var(--line);border-radius:16px;margin-top:8px}
details{background:#0b1120;border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
summary{cursor:pointer;font-weight:800;color:#ffd9a8;font-size:14px}
.exname{font-size:16px;font-weight:800;flex:1}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
.section-head h2{margin:0;font-size:17px;font-weight:900}
.logline{font-size:13.5px;margin:5px 0;line-height:1.9;color:#dbe2ef}
.logline b{color:#fff}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty svg{width:64px;height:64px;color:#3b4a6e;margin-bottom:8px}
.ic{width:20px;height:20px;flex:none}
.danger-zone{border-color:rgba(239,68,68,.45)!important}
.danger-zone h3{color:#ff9c9c}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0}
.kv b{color:var(--text)}
#picker{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88vh;background:#0f1522;border:1px solid var(--line2);border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding:14px;animation:rise .25s ease}
.sheet .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet .top b{font-size:17px;font-weight:900}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:#1a2233;border:1px solid var(--line2);color:#aeb9cf;font-weight:800;font-size:13px;font-family:inherit}
.chip.on{background:linear-gradient(135deg,var(--b1),var(--b2));border:0;color:#fff}
#pkList{overflow-y:auto;flex:1;padding-bottom:10px}
.pk{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:#0d1424;border:1px solid var(--line);border-radius:14px;padding:11px;margin:6px 0;color:var(--text);font-family:inherit;font-size:15px;font-weight:800}
.pk small{margin-right:auto;color:var(--muted);font-weight:700;font-size:11.5px}
#prModal{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:20px}
.prbox{width:100%;max-width:420px;background:linear-gradient(180deg,#2a1a05,#141007);border:2px solid var(--gold);border-radius:26px;padding:26px 20px;text-align:center;animation:rise .3s ease}
.prbox svg{width:70px;height:70px;color:var(--gold)}
.prbox h2{margin:8px 0 4px;font-size:24px;font-weight:900;color:#ffd98a}
#errbox{display:none;position:fixed;bottom:100px;right:12px;left:12px;z-index:99;background:#3b0d0d;border:1px solid var(--red);border-radius:14px;padding:10px 14px;font-size:12.5px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0}
.cal span{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:6px 0}
.cal b{text-align:center;font-size:12px;font-weight:800;padding:7px 0;border-radius:10px;background:#0b1120;border:1px solid var(--line)}
.cal b.hit{background:linear-gradient(135deg,var(--green-d),var(--green));border:0;color:#fff}
.cal b.today{outline:2px solid var(--gold)}
.mbar{margin:7px 0}
.mbar .lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:3px}
.mbar .tr{height:11px;background:#0a0f1c;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.mbar .fl{height:100%;background:linear-gradient(90deg,var(--b1),var(--b2))}
.photo{width:100%;border-radius:14px;border:1px solid var(--line2);margin-top:8px}
.prchip{display:inline-flex;align-items:center;gap:5px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.5);color:#ffd98a;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;margin:3px}
.prchip .ic{width:14px;height:14px}
.plate{display:inline-block;background:#1b2440;border:1px solid var(--line2);border-radius:12px;padding:8px 14px;font-weight:900;margin:3px;font-size:15px}
.verline{text-align:center;color:var(--muted);font-size:11px;margin:18px 0 4px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <span class="brand"><span class="tile">HM</span><span><b>HM <i>Fit</i></b><small>سجّل • تتبّع • تطوّر</small></span></span>
    <span class="badge" id="statBadge">…</span>
  </div>
</header>
<main id="app"></main>
<nav>
  <button id="nav-home"></button>
  <button id="nav-workout"></button>
  <button id="nav-history"></button>
  <button id="nav-measures"></button>
  <button id="nav-more"></button>
</nav>
<div id="picker"><div class="sheet">
  <div class="top"><b id="pkTitle">اختار التمرين</b><button class="ibtn" id="pkClose"></button></div>
  <input class="full" id="pkQ" placeholder="ابحث عن تمرين… أو اكتب اسم جديد">
  <div class="chips" id="pkChips"></div>
  <div id="pkList"></div>
</div></div>
<div id="prModal"><div class="prbox" id="prBox"></div></div>
<div id="errbox"></div>
<script>
window.addEventListener('error',function(e){var d=document.getElementById('errbox');if(d){d.style.display='block';d.textContent='عطل تقني: '+(e.message||'غير معروف')+' — خد سكرين شوت وابعته';}});
</script>
<script>
'use strict';
/* ============ HM Fit v3 — إعادة بناء كاملة ============ */
const VER='3.0.0';
const ICONS={
home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/>',
gym:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
chart:'<path d="M4 20h16"/><path d="M7 20v-6M12 20V6M17 20v-9"/>',
gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/>',
play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
trash:'<path d="M4 7h16M9 7V5h6v2M6.5 7l1 13h9l1-13"/><path d="M10 11v6M14 11v6"/>',
pen:'<path d="M4 20l1-4L16.6 4.4a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/>',
check:'<path d="M4.5 12.5l5 5L19.5 7"/>',
clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
bolt:'<path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/>',
trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 5H4.5v1.5A4.5 4.5 0 0 0 9 11M16 5h3.5v1.5A4.5 4.5 0 0 1 15 11M12 13v3M8.5 20.5h7M9.5 16.5h5"/>',
up:'<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>',
down:'<path d="M12 5v14M5.5 12.5 12 19l6.5-6.5"/>',
x:'<path d="M6 6l12 12M18 6 6 18"/>',
dl:'<path d="M12 4v11M7 11l5 5 5-5M4.5 20h15"/>',
ul:'<path d="M12 15V4M7 8.5 12 3.5l5 5M4.5 20h15"/>',
share:'<circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M8.8 10.8l6.4-4M8.8 13.2l6.4 4"/>',
cal:'<rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
box:'<path d="M4 8l8-4 8 4v8l-8 4-8-4V8z"/><path d="M4 8l8 4 8-4M12 12v8"/>',
redo:'<path d="M3.5 8a8.5 8.5 0 1 1-1 6"/><path d="M3.5 3.5V8H8"/>',
body:'<circle cx="12" cy="5.5" r="2.3"/><path d="M12 8v6M12 10.5 6.5 13M12 10.5l5.5 2.5M12 14l-3 7M12 14l3 7"/>',
book:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5V4.5z"/><path d="M5 19.5A1.5 1.5 0 0 1 6.5 18H19v3H6.5A1.5 1.5 0 0 1 5 19.5z"/>',
disc:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/>',
flag:'<path d="M5 21V4"/><path d="M5 4.5h12l-2.5 4L17 12.5H5"/>',
users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.7M17.5 14.6a5.5 5.5 0 0 1 3 5.4"/>'
};
function icon(n,cls){return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}
/* ============ التخزين والترحيل ============ */
function blankDB(){return {v:3, uid:uid(), programs:[], logs:[], body:[], goal:{perWeek:3, targetWeight:''}};}
function cleanSet(s){ s=s||{}; return {w:(s.w==null?'':String(s.w)), r:(s.r==null?'':String(s.r))}; }
function cleanEx(e){ e=e||{}; const arr=(e.sets&&e.sets.length)?e.sets:[{w:'',r:''}]; return {name:String(e.name||'تمرين'), muscle:String(e.muscle||'عام'), desc:String(e.desc||''), sets:arr.map(cleanSet)}; }
function cleanLogEx(e){ e=e||{}; return {name:String(e.name||''), muscle:String(e.muscle||'عام'), sets:(e.sets||[]).map(cleanSet)}; }
function normalizeDB(d){
  const b=blankDB();
  if(!d||typeof d!=='object') return b;
  if(d.uid) b.uid=d.uid;
  (d.programs||[]).forEach(function(p){
    p=p||{};
    const days=(p.days||[]).map(function(dy){
      dy=dy||{};
      return {id:String(dy.id||uid()), name:String(dy.name||'يوم'), exercises:(dy.exercises||[]).map(cleanEx)};
    });
    b.programs.push({id:String(p.id||uid()), name:String(p.name||'نظام'), days:days});
  });
  (d.logs||[]).forEach(function(l){
    l=l||{};
    b.logs.push({id:String(l.id||uid()), ts:(l.ts||0), date:String(l.date||''), pname:String(l.pname||''), dname:String(l.dname||''), pid:(l.pid||''), did:(l.did||''), exercises:(l.exercises||[]).map(cleanLogEx)});
  });
  (d.body||[]).forEach(function(x){ x=x||{}; b.body.push({ts:(x.ts||0), date:String(x.date||''), weight:(x.weight||''), chest:(x.chest||''), waist:(x.waist||''), arm:(x.arm||''), thigh:(x.thigh||''), photo:String(x.photo||'')}); });
  if(d.goal){ if(d.goal.perWeek) b.goal.perWeek=d.goal.perWeek; if(d.goal.targetWeight!=null) b.goal.targetWeight=d.goal.targetWeight; }
  return b;
}
let db=blankDB();
try{
  const raw=localStorage.getItem('hmfit_v1')||localStorage.getItem('gymdb_v2')||localStorage.getItem('gymdb');
  if(raw) db=normalizeDB(JSON.parse(raw));
}catch(e){ db=blankDB(); }
function save(){ try{localStorage.setItem('hmfit_v1',JSON.stringify(db));}catch(e){} updateBadge(); }
let view={name:'home'};
let session=null, restSec=0, restInt=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function prog(){for(let i=0;i<db.programs.length;i++) if(db.programs[i].id===view.pid) return db.programs[i]; return null;}
function day(){const p=prog(); if(!p) return null; for(let i=0;i<p.days.length;i++) if(p.days[i].id===view.did) return p.days[i]; return null;}
function go(name,extra){view.name=name; if(extra) for(const k in extra) view[k]=extra[k]; stopRest(); render(); if(window.scrollTo) window.scrollTo(0,0);}
function updateBadge(){
  const el=document.getElementById('statBadge'); if(!el) return;
  const s=streak();
  el.innerHTML = s>1 ? icon('bolt')+' سلسلة '+s+' أيام' : (weekCount()>0 ? icon('bolt')+' '+weekCount()+' هذا الأسبوع' : icon('gym')+' ابدأ التمرين');
  if(el.classList&&el.classList.toggle) el.classList.toggle('hot', s>1||weekCount()>0);
}
function weekCount(){const w=Date.now()-7*24*3600*1000;let n=0;db.logs.forEach(function(l){if(l.ts&&l.ts>=w)n++;});return n;}
function totalVolume(){let v=0;db.logs.forEach(function(l){l.exercises.forEach(function(e){e.sets.forEach(function(s){v+=num(s.w)*(parseInt(s.r)||0);});});});return Math.round(v);}
function fmtVol(v){return v>=1000 ? (Math.round(v/100)/10)+' طن' : v+' كجم';}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
function streak(){
  const days={}; db.logs.forEach(function(l){if(l.ts)days[dayKey(l.ts)]=1;});
  let n=0; const d=new Date();
  if(!days[dayKey(d.getTime())]) d.setDate(d.getDate()-1);
  while(days[dayKey(d.getTime())]){n++;d.setDate(d.getDate()-1);}
  return n;
}

function libMuscles(){return LIB.map(function(x){return x[0];});}
function libFind(name){for(let i=0;i<LIB.length;i++){const a=LIB[i][1];for(let j=0;j<a.length;j++) if(a[j][0]===name) return {muscle:LIB[i][0],desc:a[j][1]};}return null;}

let pk={q:'',m:'الكل',items:[]};

  pk={q:'',m:'الكل',items:[]};
  document.getElementById('pkQ').value='';
  document.getElementById('pkClose').innerHTML=icon('x');

function closePicker(){document.getElementById('picker').style.display='none';}
function pkRender(){
  const chips=document.getElementById('pkChips');
  chips.innerHTML=['الكل'].concat(libMuscles()).map(function(m){return '<button class="chip '+(pk.m===m?'on':'')+'" onclick="pkSetM(\''+m+'\')">'+m+'</button>';}).join('');
  const q=pk.q.trim(); pk.items=[];
  LIB.forEach(function(g){if(pk.m!=='الكل'&&pk.m!==g[0])return;g[1].forEach(function(t){if(!q||t[0].indexOf(q)>-1)pk.items.push({m:g[0],n:t[0],d:t[1]});});});
  let h='';
  pk.items.forEach(function(x,i){h+='<button class="pk" onclick="pickEx('+i+')">'+icon('gym')+' '+esc(x.n)+'<small>'+esc(x.m)+'</small></button>';});
  if(q) h+='<button class="pk" style="border-color:var(--b1)" onclick="pickEx(-1)">'+icon('plus')+' أضف «'+esc(q)+'» كتمرين جديد</button>';
  document.getElementById('pkList').innerHTML=h||'<p class="muted" style="text-align:center">مفيش نتائج</p>';
}
function pkSetM(m){pk.m=m;pkRender();}

}

/* ============ جلسة التمرين ============ */
function quickStart(pid,did){view.pid=pid;view.did=did;startWorkout();}
function startWorkout(){
  const d=day();
  if(!d) return alert('اختار يوم الأول');
  if(!d.exercises.length) return alert('ضيف تمارين الأول في الجدول');
  session={pname:prog().name,dname:d.name,pid:view.pid,did:view.did,startTime:new Date().toLocaleString('ar-EG'),
    exercises:d.exercises.map(function(e){return {name:e.name,muscle:e.muscle||'عام',desc:e.desc||'',sets:e.sets.map(function(s){return {w:s.w,r:s.r,done:false};})};})};
  go('workout');
}
function setS(i,j,k,v){session.exercises[i].sets[j][k]=v;updateProgress();}
function toggleDone(i,j){const s=session.exercises[i].sets[j];s.done=!s.done;if(s.done)startRest(90);render();}
function addSSet(i){const s=session.exercises[i].sets;const l=s[s.length-1]||{w:'',r:''};s.push({w:l.w,r:l.r,done:false});render();}
function delSSet(i,j){session.exercises[i].sets.splice(j,1);render();}
function cancelWorkout(){if(confirm('إلغاء التمرين بدون حفظ؟')){session=null;stopRest();go('day',{pid:view.pid,did:view.did});}}
function bestWeight(name){let b=0;db.logs.forEach(function(l){l.exercises.forEach(function(e){if(e.name===name)e.sets.forEach(function(s){const w=num(s.w);if(w>b)b=w;});});});return b;}
function finishWorkout(){
  const prev={};
  session.exercises.forEach(function(e){prev[e.name]=bestWeight(e.name);});
  const log={id:uid(),ts:Date.now(),date:new Date().toLocaleString('ar-EG'),pname:session.pname,dname:session.dname,pid:session.pid,did:session.did,
    exercises:session.exercises.map(function(e){return {name:e.name,muscle:e.muscle,sets:e.sets.filter(function(s){return s.w!==''||s.r!=='';}).map(function(s){return {w:s.w,r:s.r};})};})};
  if(!log.exercises.length||log.exercises.every(function(e){return !e.sets.length;})) return alert('سجّل وزن وعدات الأول');
  db.logs.push(log);
  const prs=[];
  log.exercises.forEach(function(e){let tb=0;e.sets.forEach(function(s){const w=num(s.w);if(w>tb)tb=w;});if(tb>prev[e.name])prs.push({name:e.name,w:tb,first:!prev[e.name]});});
  const upd=confirm('تم حفظ التمرين\n\nتحب تحدّث الجدول الأساسي بأرقام النهارده؟');
  if(upd){const p=db.programs.find(function(x){return x.id===session.pid;});if(p){const d=p.days.find(function(x){return x.id===session.did;});if(d){d.exercises=log.exercises.map(function(e){const f=libFind(e.name);return {name:e.name,muscle:f?f.muscle:(e.muscle||'عام'),desc:f?f.desc:'',sets:e.sets.length?e.sets:[{w:'',r:''}]};});}}}
  save();session=null;stopRest();
  if(prs.length) showPR(prs);
  go('history');
}
function doneCount(){if(!session)return{d:0,t:0};let t=0,d=0;session.exercises.forEach(function(e){e.sets.forEach(function(s){t++;if(s.done)d++;});});return{d:d,t:t};}
function updateProgress(){const el=document.getElementById('pbar');if(!el||!session)return;const c=doneCount();el.style.width=(c.t?Math.round(c.d/c.t*100):0)+'%';const tx=document.getElementById('ptxt');if(tx)tx.textContent=c.d+' / '+c.t+' دور';}

  document.getElementById('prBox').innerHTML=icon('trophy')+'<h2>رقم جديد!</h2><p class="muted">عاش! كسرت رقمك القياسي في:</p>'+prs.map(function(p){return '<div class="prchip">'+icon('trophy')+' '+esc(p.name)+' — '+esc(String(p.w))+' كجم'+(p.first?' (أول رقم)':'')+'</div>';}).join('')+'<br><br><button class="btn btn-gold btn-block" onclick="closePR()">كمّل يا وحش</button>';
  document.getElementById('prModal').style.display='flex';

}

/* ============ تايمر الراحة ============ */
function startRest(sec){restSec=sec;clearInterval(restInt);tickRest();restInt=setInterval(function(){restSec--;if(restSec<=0){clearInterval(restInt);try{if(navigator.vibrate)navigator.vibrate(300);}catch(e){}}tickRest();},1000);}
function tickRest(){const el=document.getElementById('restTimer');if(!el)return;if(restSec<=0){el.style.display='none';return;}el.style.display='flex';const m=Math.floor(restSec/60),s=restSec%60;el.innerHTML=icon('clock')+' راحة '+m+':'+String(s).padStart(2,'0');}
function stopRest(){clearInterval(restInt);restSec=0;}
function customRest(){const v=prompt('مدة الراحة بالثواني (مثال: 90):','90');if(v&&+v>0)startRest(+v);}
/* ============ السجل والأرقام القياسية ============ */
function delLog(id){if(confirm('حذف التمرينة دي من السجل؟')){db.logs=db.logs.filter(function(l){return l.id!==id;});save();render();}}
function lastLog(exName){for(let i=db.logs.length-1;i>=0;i--){const e=db.logs[i].exercises.find(function(x){return x.name===exName;});if(e)return{date:db.logs[i].date,sets:e.sets};}return null;}
function exerciseHistory(exName){const out=[];db.logs.forEach(function(l){const e=l.exercises.find(function(x){return x.name===exName;});if(e){let best=0;e.sets.forEach(function(s){const w=num(s.w);if(w>best)best=w;});out.push({date:l.date,best:best,sets:e.sets});}});return out;}
function allExerciseNames(){const s={};const a=[];const add=function(n){if(!s[n]){s[n]=1;a.push(n);}};db.programs.forEach(function(p){p.days.forEach(function(d){d.exercises.forEach(function(e){add(e.name);});});});db.logs.forEach(function(l){l.exercises.forEach(function(e){add(e.name);});});return a;}
function prList(){const m={};db.logs.forEach(function(l){l.exercises.forEach(function(e){e.sets.forEach(function(s){const w=num(s.w);if(w>(m[e.name]||0))m[e.name]=w;});});});return Object.keys(m).map(function(n){return{name:n,w:m[n]};}).sort(function(a,b){return b.w-a.w;});}
function muscleWeek(){const w=Date.now()-7*24*3600*1000;const m={};db.logs.forEach(function(l){if(!l.ts||l.ts<w)return;l.exercises.forEach(function(e){const k=e.muscle||'عام';m[k]=(m[k]||0)+e.sets.length;});});const a=Object.keys(m).map(function(k){return{m:k,n:m[k]};});a.sort(function(x,y){return y.n-x.n;});return a;}
function monthGrid(){
  const now=new Date(),y=now.getFullYear(),mo=now.getMonth();
  const days={};db.logs.forEach(function(l){if(l.ts){const d=new Date(l.ts);if(d.getFullYear()===y&&d.getMonth()===mo)days[d.getDate()]=1;}});
  const first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();
  let h='<div class="cal">'+['سبت','أحد','اثنين','ثلا','أرب','خمي','جمع'].map(function(x){return '<span>'+x+'</span>';}).join('');
  const off=(first+1)%7;
  for(let i=0;i<off;i++)h+='<span></span>';
  for(let d=1;d<=dim;d++)h+='<b class="'+(days[d]?'hit':'')+(d===now.getDate()?' today':'')+'">'+d+'</b>';
  return h+'</div>';
}

function drawLine(canvasId,vals,color){
  const c=document.getElementById(canvasId);if(!c||!vals.length)return;
  const dpr=(window&&window.devicePixelRatio)||1;
  const W=c.clientWidth||560,H=220;
  c.width=W*dpr;c.height=H*dpr;
  const x=c.getContext('2d');if(!x)return;
  x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const max=Math.max.apply(null,vals.concat([10])),min=Math.min.apply(null,vals.concat([0]));
  const pad={t:16,r:12,b:28,l:40},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  x.strokeStyle='rgba(255,255,255,.08)';x.fillStyle='#9aa6bd';x.font='11px Cairo,Tahoma';x.lineWidth=1;
  for(let g=0;g<=4;g++){const v=min+(max-min)*g/4;const Y=pad.t+ih-(ih*g/4);x.beginPath();x.moveTo(pad.l,Y);x.lineTo(W-pad.r,Y);x.stroke();x.fillText((Math.round(v*10)/10)+'',2,Y+4);}
  const px=function(i){return vals.length===1?pad.l+iw/2:pad.l+iw*i/(vals.length-1);};
  const py=function(v){return pad.t+ih-((v-min)/((max-min)||1)*ih);};
  const grd=x.createLinearGradient(0,pad.t,0,pad.t+ih);grd.addColorStop(0,color+'55');grd.addColorStop(1,color+'00');
  x.beginPath();vals.forEach(function(v,i){const X=px(i),Y=py(v);if(i)x.lineTo(X,Y);else x.moveTo(X,Y);});
  x.strokeStyle=color;x.lineWidth=3;x.lineJoin='round';x.stroke();
  x.lineTo(px(vals.length-1),pad.t+ih);x.lineTo(px(0),pad.t+ih);x.closePath();x.fillStyle=grd;x.fill();
  vals.forEach(function(v,i){const X=px(i),Y=py(v);x.beginPath();x.arc(X,Y,5,0,7);x.fillStyle='#22c55e';x.fill();x.beginPath();x.arc(X,Y,2.2,0,7);x.fillStyle='#fff';x.fill();x.fillStyle='#fff';x.fillText(v,X-10,Y-11);});
}

function readPhoto(inp){
  try{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=function(){
      try{
        const img=new Image();
        img.onload=function(){
          try{
            const mx=700,sc=Math.min(1,mx/Math.max(img.width,img.height));
            const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
            cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
            const prev=document.getElementById('photoPrev');
            if(prev){prev.src=cv.toDataURL('image/jpeg',.65);prev.style.display='block';}
          }catch(e){alert('الصورة دي مش نافعة');}
        };
        img.src=r.result;
      }catch(e){alert('الصورة دي مش نافعة');}
    };
    r.readAsDataURL(f);
  }catch(e){alert('المتصفح ده مش بيدعم الصور');}
}

const PLATES=[25,20,15,10,5,2.5,1.25];
function plateCalc(){
  const t=num(document.getElementById('plTarget').value),bar=num(document.getElementById('plBar').value)||20;
  const out=document.getElementById('plOut');if(!out)return;
  if(t<=bar){out.innerHTML='<p class="muted">الوزن المستهدف لازم يكون أكبر من وزن البار ('+bar+' كجم).</p>';return;}
  let side=(t-bar)/2;const used=[];
  PLATES.forEach(function(p){while(side>=p-0.001){used.push(p);side=Math.round((side-p)*1000)/1000;}});
  out.innerHTML='<p class="muted">البار '+bar+' كجم — حط على <b>كل ناحية</b>:</p><div>'+used.map(function(p){return '<span class="plate">'+p+'</span>';}).join('')+'</div>'+(side>0.01?'<p class="muted">متبقي '+side+' كجم (مفيش قرص بالوزن ده).</p>':'<p class="muted">المجموع مظبوط بالمللي.</p>');
}

  const q=(view.libQ||'').trim();let h='';
  LIB.forEach(function(g){
    if(view.libM!=='الكل'&&view.libM!==g[0])return;
    g[1].forEach(function(t){
      if(q&&t[0].indexOf(q)<0&&t[1].indexOf(q)<0)return;
      h+='<div class="item"><span class="thumb g">'+icon('gym')+'</span><span class="grow"><span class="nm">'+esc(t[0])+'</span><br><span class="meta">'+esc(g[0])+' • '+esc(t[1])+'</span></span></div>';

}
