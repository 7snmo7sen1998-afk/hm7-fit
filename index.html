<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HM Fit | لياقتك على مزاجك</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0E0F;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.1);--line:rgba(0,230,118,.3);--line2:rgba(0,230,118,.55);
--text:#FFFFFF;--muted:#C3D6CC;--neon:#00E676;--neon2:#4DFF9D;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Tajawal","Cairo","Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;
background-color:#0A0E0F;background-image:radial-gradient(900px 420px at 85% -5%,rgba(0,230,118,.10),transparent 60%),radial-gradient(800px 420px at 10% -5%,rgba(0,255,136,.07),transparent 60%)}}
header{position:sticky;top:0;z-index:20;background:rgba(10,14,15,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hwrap{max-width:640px;margin:auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand .tile{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;color:#04120a;font-weight:900;font-size:15px;font-family:Arial,sans-serif;box-shadow:0 0 22px rgba(0,230,118,.45)}
.brand b{font-size:20px;font-weight:900;display:block;line-height:1.1;letter-spacing:.5px}
.brand b i{font-style:normal;color:var(--neon)}
.brand small{font-size:11px;color:var(--muted);font-weight:500}
main{padding:16px 14px 120px;max-width:640px;margin:auto}
#app>*{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.card.glow{border-color:var(--line2);box-shadow:0 0 26px rgba(0,230,118,.16),0 12px 30px rgba(0,0,0,.35)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:800}
.card .sub{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.9}
button{font-family:inherit;cursor:pointer;transition:transform .07s,filter .15s}
button:active{transform:scale(.96)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800}
.btn .ic{width:19px;height:19px}
.btn-neon{background:linear-gradient(135deg,var(--neon),var(--neon2));border:0;color:#04120a;box-shadow:0 0 24px rgba(0,230,118,.4)}
.btn-block{width:100%;padding:15px;font-size:16px;border-radius:16px}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn-sm .ic{width:16px;height:16px}
.ibtn{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line2);color:#d6e4db;padding:0;margin:2px}
.ibtn .ic{width:18px;height:18px}
.ibtn.danger{color:#ff9c9c;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}
input,select{padding:11px 8px;font-size:16px;font-weight:700;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.4);color:#fff;text-align:center;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,230,118,.2)}
input.w{width:84px}input.r{width:84px}input.full{width:100%;text-align:right;margin:6px 0}
select.full{width:100%;text-align:right;margin:6px 0}
.row{display:flex;align-items:center;gap:6px;margin:7px 0;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,230,118,.08);border:1px solid var(--line2);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800;color:#c9f5da}
.badge .ic{width:15px;height:15px;color:var(--neon)}
.item{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:15.5px}
.item .meta{font-size:12px;color:var(--muted);font-weight:500}
.item.mainbtn{cursor:pointer}
.thumb{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(0,230,118,.1);border:1px solid var(--line2)}
.thumb svg{width:24px;height:24px;color:var(--neon)}
.setbox{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0}
.snum{min-width:30px;height:30px;border-radius:10px;background:rgba(0,230,118,.12);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:var(--neon2)}
.mini{font-size:12px;font-weight:700;color:var(--muted);background:transparent;border:1px dashed var(--line2);border-radius:10px;padding:7px 10px;font-family:inherit;cursor:pointer}
nav{position:fixed;bottom:12px;right:12px;left:12px;background:rgba(12,18,19,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:24px;display:flex;max-width:616px;margin:auto;z-index:20;overflow:hidden;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
nav button{flex:1;background:transparent;border:0;color:#a9bcb1;border-radius:18px;padding:9px 2px 7px;margin:2px;font-family:inherit;cursor:pointer}
nav button .ni{display:flex;justify-content:center}
nav button .ni svg{width:23px;height:23px}
nav button .nl{display:block;font-size:10px;font-weight:800;margin-top:2px}
nav button.active{color:var(--neon2);background:rgba(0,230,118,.12);box-shadow:inset 0 0 0 1px rgba(0,230,118,.4),0 0 18px rgba(0,230,118,.25)}
details{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
summary{cursor:pointer;font-weight:800;color:#b9f5d3;font-size:14px}
.exname{font-size:16px;font-weight:800;flex:1}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
.section-head h2{margin:0;font-size:17px;font-weight:900}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty svg{width:64px;height:64px;color:#47655a;margin-bottom:8px}
.ic{width:20px;height:20px;flex:none}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0}
.kv b{color:var(--text)}
#picker{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88vh;background:#0d1314;border:1px solid var(--line2);border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding:14px;animation:rise .25s ease}
.sheet .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet .top b{font-size:17px;font-weight:900}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line2);color:#d8e8de;font-weight:800;font-size:13px;font-family:inherit}
.chip.on{background:linear-gradient(135deg,var(--neon),var(--neon2));border:0;color:#04120a}
#pkList{overflow-y:auto;flex:1;padding-bottom:10px}
.pk{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:11px;margin:6px 0;color:var(--text);font-family:inherit;font-size:15px;font-weight:800}
.pk small{margin-right:auto;color:var(--muted);font-weight:700;font-size:11.5px}
#ob{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:24px 18px 40px}
.obbox{max-width:480px;margin:0 auto}
.obbox .step{font-size:13px;color:var(--neon);font-weight:800;margin-bottom:6px}
.obbox h1{font-size:26px;font-weight:900;margin:0 0 6px}
.obbox h1 i{font-style:normal;color:var(--neon)}
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.dchip{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line2);color:#fff;font-size:18px;font-weight:900;font-family:inherit}
.dchip.on{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#04120a;border:0;box-shadow:0 0 20px rgba(0,230,118,.45)}
.goalopt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;color:var(--text);font-family:inherit;font-size:16px;font-weight:800}
.goalopt.on{border-color:var(--neon);box-shadow:0 0 18px rgba(0,230,118,.25)}
#errbox{display:none;position:fixed;bottom:100px;right:12px;left:12px;z-index:99;background:#3b0d0d;border:1px solid #ef4444;border-radius:14px;padding:10px 14px;font-size:12.5px;font-weight:700}
.photo{width:100%;border-radius:14px;border:1px solid var(--line2);margin-top:8px}
table.wt{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.wt th{color:var(--neon);font-size:12px;padding:6px;border-bottom:1px solid var(--line2)}
table.wt td{text-align:center;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:700}
.meal{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:10px;margin:7px 0}
.meal .grow{flex:1}
.meal .nm{font-weight:800;font-size:14.5px}
.meal .kcal{font-size:12px;color:var(--neon);font-weight:800}
.verline{text-align:center;color:var(--muted);font-size:11px;margin:18px 0 4px;font-weight:700}
.subtabs{display:flex;gap:8px;margin-bottom:12px}
.subtabs button{flex:1;padding:11px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#b9cdc2;font-weight:800;font-size:14px;font-family:inherit}
.subtabs button.on{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#04120a;border:0}
.btn-outline{background:transparent;border:1.5px solid var(--neon);color:var(--neon2);box-shadow:0 0 18px rgba(0,230,118,.22)}
.heroart{position:relative;overflow:hidden;border-radius:24px;padding:22px 18px;margin-bottom:14px;border:1px solid var(--line2);background:linear-gradient(to left,rgba(4,12,9,.95) 28%,rgba(4,12,9,.55) 58%,rgba(4,12,9,.12) 85%),url('hero-bg.jpg') center left/cover;box-shadow:0 0 30px rgba(0,230,118,.15);min-height:215px}
.heroart h2{margin:0 0 4px;font-size:24px;font-weight:900;position:relative}
.heroart h2 i{font-style:normal;color:var(--neon2)}
.heroart p{margin:0 0 14px;font-size:14px;color:#eaf6ee;position:relative;line-height:1.9;font-weight:500}
.howto{display:flex;gap:12px;align-items:flex-start}
.howto img{width:42%;flex:none;border-radius:14px;border:1px solid var(--line)}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat2{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 9px}
.stat2 .n{font-size:20px;font-weight:900;line-height:1.1}
.stat2 .k{font-size:11px;color:var(--muted);font-weight:700}
.stat2.hl{border-color:var(--line2);box-shadow:0 0 20px rgba(0,230,118,.22)}
.stat2.clickable{cursor:pointer}
.workout-cta{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px;margin-bottom:14px;border:1px solid var(--line2);background:linear-gradient(135deg,#03130b,#0a4a26 60%,#0d6b34);box-shadow:0 0 30px rgba(0,230,118,.25);display:flex;align-items:center;gap:12px;cursor:pointer}
.workout-cta .big{font-size:20px;font-weight:900;flex:1;line-height:1.5}
.workout-cta .big small{display:block;font-size:12.5px;font-weight:500;color:#c9e8d4}
.workout-cta .go{width:58px;height:58px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(0,230,118,.6)}
.workout-cta .go svg{width:26px;height:26px;color:#04120a}
#restbar{display:none;background:rgba(10,14,15,.95);border:1px solid var(--line2);border-radius:16px;padding:10px 14px;margin-bottom:10px;align-items:center;gap:10px;box-shadow:0 0 24px rgba(0,230,118,.3)}
#restbar{margin:10px 0 0}#restbar .lbl{font-size:12px;color:#c9e8d4;margin-bottom:6px}#restbar.done{border-color:#f5a623;box-shadow:0 0 24px rgba(245,166,35,.45)}#restbar.done .t{color:#f5a623}
#restbar .t{font-size:24px;font-weight:900;color:var(--neon2);min-width:70px;text-align:center}
#restbar .bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
#restbar .bar>div{height:100%;background:linear-gradient(90deg,var(--neon),var(--neon2));width:0%}
.prbanner{background:linear-gradient(135deg,#3a2a05,#6b4d08);border:1px solid #f5a623;border-radius:16px;padding:12px;margin:8px 0;text-align:center;box-shadow:0 0 24px rgba(245,166,35,.35);animation:rise .4s ease}
.prbanner b{font-size:17px;color:#ffd98a}
.noteinput{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line2);color:var(--muted);font-size:12px;padding:4px 2px;margin-top:4px;font-family:inherit;outline:none}
.noteinput:focus{border-color:var(--neon);color:#fff}
.prchip{display:inline-flex;align-items:center;gap:5px;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.5);color:#ffd98a;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;margin:3px}
.warmnote{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.4);border-radius:12px;padding:8px 12px;font-size:12.5px;color:#bcd3f5;margin:6px 0;line-height:1.8}
.steps{list-style:none;margin:8px 0 0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;margin:11px 0;font-size:14px;line-height:1.9;color:#e6f2ea}
.steps li b{flex:none;width:26px;height:26px;border-radius:9px;background:rgba(0,230,118,.14);border:1px solid var(--line2);color:var(--neon2);display:flex;align-items:center;justify-content:center;font-size:13px}
.field{position:relative;flex:1;display:flex;min-width:0}
.field svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--neon);pointer-events:none}
.field input{width:100%;text-align:right;padding-right:42px}
.dashedbtn{width:100%;border:1.5px dashed var(--line2);border-radius:14px;background:transparent;color:var(--muted);padding:12px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;margin:7px 0}
.dashedbtn .ic{width:19px;height:19px}
.swapbtn{font-size:11.5px;font-weight:800;color:var(--neon2);background:rgba(0,230,118,.1);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-family:inherit}
.swapbtn .ic{width:13px;height:13px;vertical-align:-2px}
.startpill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--neon);color:var(--neon2);border-radius:999px;padding:8px 16px;font-weight:900;font-size:13.5px;background:rgba(0,230,118,.07);box-shadow:0 0 18px rgba(0,230,118,.3);font-family:inherit}
.startpill svg{width:17px;height:17px}
.hlogo{width:42px;height:42px;border-radius:14px;box-shadow:0 0 18px rgba(0,230,118,.45)}
.side2{display:flex;gap:10px}
.side2 .card{flex:1;margin-bottom:14px;text-align:center;cursor:pointer}
.side2 .thumb{margin:0 auto 6px}
.side2 b{font-size:14px}
input::placeholder{color:#93aca0;opacity:1}
select{color:#fff}
#lb{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:18px}
.lbbox{max-width:520px;width:100%;background:#0d1314;border:1px solid var(--line2);border-radius:22px;padding:14px;animation:rise .25s ease}
.lbbox img{width:100%;border-radius:14px;border:1px solid var(--line)}
.lbbox h3{margin:10px 0 4px;font-size:18px;font-weight:900}
.exthumb{width:52px;height:52px;flex:none;border-radius:14px;object-fit:cover;border:1px solid var(--line2);background:rgba(0,230,118,.08)}
.exthumb.fallback{display:flex;align-items:center;justify-content:center}
.exthumb.fallback svg{width:24px;height:24px;color:var(--neon)}
.sessbox{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.7}.sessbox.today{border-color:rgba(0,230,118,.35)}
</style>

function icon(n,cls){return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}
/* ============ البيانات ============ */
function blankProfile(){return {onboarded:false,days:3,weight:'',height:'',age:'',gender:'m',goal:'lose',nutrition:false,notif:{on:false,time:'20:00',days:[0,1,2,3,4,5,6]},rest:120,tpl:2000};}
function blankDB(){return {v:4,uid:uid(),profile:blankProfile(),program:null,weights:{},prs:{},body:[]};}
function cleanSet(s){s=s||{};return{w:(s.w==null?'':String(s.w)),r:(s.r==null?'':String(s.r))};}
function cleanEx(e){e=e||{};const arr=(e.sets&&e.sets.length)?e.sets:[{w:'',r:''}];return{name:String(e.name||'تمرين'),muscle:String(e.muscle||'عام'),desc:String(e.desc||''),sets:arr.map(cleanSet)};}
let db=blankDB();
function migrate(){
  if(!db.prs)db.prs={};if(!db.profile.notif)db.profile.notif={on:false,time:'20:00',days:[0,1,2,3,4,5,6]};
  Object.keys(db.weights).forEach(function(n){
    const a=db.weights[n]||[];
    a.forEach(function(x){if(!x.s)x.s='old';});
    a.forEach(function(x){const w=num(x.w);const cur=db.prs[n];if(w>0&&(!cur||w>num(cur.w)))db.prs[n]={w:String(x.w),r:String(x.r||''),d:x.d||''};const rm=epley1RM(x.w,x.r);if(rm>0&&(!db.prs[n].rm||rm>db.prs[n].rm))db.prs[n].rm=rm;});
  });
  if(db.program&&db.program.tpl&&db.program.tpl!=='custom'){
    db.program.days.forEach(function(d){if(/^[A-Za-z +()\/]+ [A-F]( \/ [A-Za-z +]+ [A-F])?$/.test(d.name))d.name=d.name.replace(/ ([A-F])(?= \/|$)/g,function(m,c){return ' '+(c.charCodeAt(0)-64);});});
  }
}
try{
  const raw=localStorage.getItem('hmfit_v4');
  if(raw){db=JSON.parse(raw);if(!db.profile)db.profile=blankProfile();if(!db.weights)db.weights={};if(!db.body)db.body=[];migrate();}
  else{
    const oldRaw=localStorage.getItem('hmfit_v1')||localStorage.getItem('gymdb_v2')||localStorage.getItem('gymdb');
    if(oldRaw){
      const o=JSON.parse(oldRaw);db.profile=blankProfile();
      if(o.programs&&o.programs.length){
        const p=o.programs[0];
        db.program={id:(p.id||uid()),name:String(p.name||'برنامجي'),tpl:'custom',days:(p.days||[]).map(function(d){return{id:String(d.id||uid()),name:String(d.name||'يوم'),exercises:(d.exercises||[]).map(cleanEx)};})};
      }
      if(o.goal){if(o.goal.targetWeight)db.profile.tpl=2000;}
      (o.body||[]).forEach(function(x){db.body.push({ts:(x.ts||0),date:String(x.date||''),weight:(x.weight||''),fat:'',photo:String(x.photo||''),chest:(x.chest||''),waist:(x.waist||''),arm:(x.arm||''),thigh:(x.thigh||'')});});
    }
  }
}catch(e){db=blankDB();}
let view={name:'home'};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':String(s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
let _saveWarned=0;
function save(){let ok=true;try{localStorage.setItem('hmfit_v4',JSON.stringify(db));}catch(e){ok=false;if(Date.now()-_saveWarned>15000){_saveWarned=Date.now();alert('مساحة التخزين على الجهاز اتملت ومش قادر أحفظ التعديل ده!\nامسح شوية صور تقدم قديمة من «جسمي»، واعمل نسخة احتياطية من «المزيد».');}}updateBadge();return ok;}
function storeKB(){try{return Math.round((localStorage.getItem('hmfit_v4')||'').length*2/1024);}catch(e){return 0;}}
function go(name,extra){view.name=name;if(extra)for(const k in extra)view[k]=extra[k];render();setTimeout(lazyWatch,30);if(window.scrollTo)window.scrollTo(0,0);}
function updateBadge(){const el=document.getElementById('goalBadge');if(!el)return;el.innerHTML=icon('bolt')+' '+(GOALS[db.profile.goal]||'');}
function dateKey(t){const d=t?new Date(t):new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayIdx(){const p=db.program;if(!p||!p.days.length)return -1;if(!p.lastDid)return 0;const i=p.days.findIndex(function(d){return d.id===p.lastDid;});if(i<0)return 0;return p.lastDate===dateKey()?i:(i+1)%p.days.length;}
function startToday(){const ti=todayIdx();if(ti<0)return go('workout');go('trainday',{did:db.program.days[ti].id});}
const LIB=[
['صدر',[['بنش مستوي بار','نام على ضهرك على البنش المسطح، رجلك ثابتة على الأرض. امسك البار بقبضة أوسع من الكتف بشوية، نزّله ببطء لحد ما يلمس منتصف صدرك، وادفع لفوق. حافظ على كوعك بزاوية 45 درجة من جسمك (لا تلزقه ولا تفتحه 90).'],['بنش مستوي دمبل','نام على ضهرك على البنش المسطح ودمبل في كل إيد عند مستوى الصدر. انزل بالدمبلين لتحت ببطء (كوعك 45 درجة) لحد ما تحس بشد في الصدر، وادفع لفوق لحد ما يتقابلوا فوق صدرك.'],['بنش عالي بار','البنش مائل لفوق حوالي 30 درجة. امسك البار بقبضة أوسع من الكتف ونزّله لأعلى الصدر (تحت الترقوة) وادفع لفوق بخط مستقيم.'],['بنش عالي دمبل','على بنش مائل 30 درجة ودمبل في كل إيد. انزل بالدمبلين لحد أعلى الصدر (كوعك 45 درجة) وادفع لفوق.'],['بنش منخفض','البنش مائل لتحت ورجلك متثبتة. نزّل البار لأسفل صدرك وادفع لفوق — بيركّز على الجزء السفلي.'],['بنش جهاز','ضهرك لازق في الكرسي ورجلك ثابتة على الأرض. امسك المقبضين وادفع لقدام لحد ما دراعك تتفرد، ورجّع ببطء.'],['فلاي دمبل','نام ودراعك شبه مفرودة (تنية بسيطة في الكوع) ودمبل في كل إيد. افتح على شكل حضن واسع وانزل لتحت، وسكّر لفوق.'],['فلاي كابل','واقف في النص بين الكابلين واخد خطوة لقدام. بدراع شبه مفرودة اسحب الكابلين لتحت وقدام صدرك على شكل حضن.'],['فلاي جهاز','اظبط الكرسي بحيث المقابض عند مستوى صدرك. اسحب الدراعين لبعض قدام صدرك واعصر، ورجّع ببطء.'],['كروس أوفر كابل','الكابلين فوق على العالي. امسك واحد في كل إيد واسحب لتحت على شكل X قدام جسمك.'],['ضغط صدر جهاز','قاعد في جهاز الصدر وضهرك لازق في الكرسي. ادفع المقابض لقدام لحد ما دراعك تتفرد، ورجّع ببطء من غير ما الأوزان تخبط.'],['بوش أب','جسمك خط واحد من الراس للكعب وإيدك تحت كتفك. انزل بصدرك لتحت وادفع لفوق. لو صعب اعمله على ركبك.'],['متوازي للصدر','على جهاز المتوازي (الدبس) ميّل جسمك لقدام. انزل بصدرك لتحت لحد ما كوعك 90 درجة وادفع لفوق — كل ما تميل أكتر الصدر يشتغل أكتر.'],['بول أوفر دمبل','نام بالعرض على البنش وامسك دمبل واحد بإيديك الاتنين فوق صدرك. نزّله ورا راسك لحد ما تحس بشد خفيف بس (متنزلش للآخر) وارجع — المدى الزيادة بيضغط على الكتف.'],['بنش عالي جهاز','اقعد في جهاز البنش العالي وضهرك لازق في الكرسي. ادفع المقبضين لفوق لحد ما دراعك تتفرد، ورجّع ببطء.']]],
['ضهر',[['العقلة','اتعلق على البار بقبضة أوسع من كتفك وراحة الإيد لقدام. اسحب جسمك لفوق لحد ما دقنك تعدي البار وانزل ببطء للآخر.'],['سحب علوي واسع','قاعد في جهاز السحب والبار فوقك بقبضة واسعة. اسحب البار لتحت لحد أعلى صدرك وصدرك لبره، ورجّع ببطء.'],['سحب علوي ضيق','نفس العلوي بس قبضة ضيقة (مثلث أو متوازي وراحة الإيد لبعض). اسحب لتحت لحد صدرك وركّز على اللاتس.'],['سحب أرضي كابل','قاعد في جهاز السحب الأرضي ورجلك متثبتة وضهرك مفرود. اسحب مقبض الكابل لبطنك وكوعك لورا جنب جسمك، ورجّع ببطء.'],['رو بار منحني','واقف وميّل ضهرك 45 درجة وركبك متنية والبار تحتك. اسحب البار لبطنك وضهرك ثابت ومفرود تمامًا.'],['رو دمبل','إيد وركبة على البنش، والدمبل في الإيد التانية مدلدل لتحت. اسحب الدمبل لفوق لجنبك لحد وسطك وانزل ببطء.'],['رو جهاز','الصدر لازق في مسند الجهاز. اسحب المقابض لورا وكوعك جنب جسمك، ورجّع ببطء.'],['تي بار رو','واقف على جهاز التي بار وماسك المقبض بإيديك الاتنين. اسحب لصدرك وضهرك ثابت، وانزل بتحكم.'],['سحب أمامي بذراع مفرودة','واقف قدام الكابل وماسك البار المستقيم بدراع مفرودة. اسحب المقبض لتحت لحد وراك من غير ما تتني كوعك.'],['ديدلفت','للمتقدمين فقط — اتقن الروماني الأول. البار على الأرض قدام قصبة رجلك، ضهرك مفرود تمامًا طول الحركة، وارفّع بفخادك وضهرك. أي تقويس في الضهر = وقف فورًا.'],['هايبر اكستنشن','ثبّت رجلك في الجهاز وانزل بجسمك لتحت، واطلع لفوق بأسفل ضهرك لحد ما جسمك خط واحد.']]],
['أكتاف',[['ضغط أكتاف دمبل','اقعد على بنش وضهرك مسنود ودمبل في كل إيد عند مستوى ودنك. ادفع لفوق لحد ما يتقابلوا وانزل ببطء لحد مستوى الودن — القعدة بتثبّت ضهرك وتمنع الإصابة.'],['ضغط أكتاف بار قاعد','قاعد والبار قدام وشك على مستوى الترقوة. ادفع لفوق من غير ما تقوّس ضهرك وانزل بتحكم.'],['ضغط أكتاف جهاز','اظبط الكرسي بحيث المقابض عند ودنك. ادفع لفوق ورجّع ببطء.'],['رفرفة جانبي دمبل','واقف ودمبل في كل إيد جنبك. ارفع الدمبلين للجنب لحد مستوى الكتف — مرفقك أعلى من إيدك بشوية وكوعك متني تنية خفيفة ثابتة — وانزل ببطء.'],['رفرفة جانبي كابل','واقف جنب الكابل السفلي وماسك المقبض بالإيد البعيدة والكابل معدي من قدام جسمك. ارفع دراعك للجنب لحد مستوى الكتف ورجّع ببطء — المقاومة ثابتة طول الحركة.'],['رفرفة أمامي','واقف ودمبل في كل إيد قدام فخادك. ارفع دراع واحد لقدام لحد مستوى الكتف وانزل، وبدّل.'],['رفرفة خلفي منحني','ميّل جسمك لقدام وضهرك مفرود ودمبل في كل إيد مدلدلين. افتح دراعك للجنب لورا وركّز على الكتف الخلفي.'],['فيس بول','الكابل على مستوى وشك وماسك الحبل (المقبض الحبلي) بإيديك الاتنين. اسحب الحبل لوشك وكوعك لفوق ولبره، واعصر كتفك الخلفي في الآخر.'],['أرنولد برس','ابدأ والدمبل قدام صدرك وراحة الإيد ليك. وانت طالع لفوق لف إيدك لبره لحد ما يتقابلوا فوق راسك.'],['سحب بار للذقن','واقف وماسك البار بقبضة واسعة (أوسع من الكتف بكتير) وارفع لحد نص الصدر بس — مترفعش للدقن. لو كتفك بيضايقك شيله خالص واستبدله برفرفة جانبي.'],['رفرفة خلفي جهاز','اقعد في جهاز الفراشة بالعكس (صدرك ناحية المسند). امسك المقبضين وافتح دراعك للجنب لورا واعصر كتفك الخلفي، ورجّع ببطء.']]],
['باي',[['باي بار مستقيم','واقف والبار المستقيم في إيدك وراحة الإيد لقدام. كوعك لازق في جنبك واطلع بالبار لفوق وانزل للآخر.'],['باي بار متعرج','نفس المستقيم بس بالبار المتعرج (EZ) — القبضة مريحة أكتر للرسغ. اطلع وانزل للآخر.'],['باي دمبل بالتبادل','واقف ودمبل في كل إيد. اطلع بدراع واحدة ونزّل التانية بالتبادل، ولف رسغك وانت طالع.'],['باي هامر','واقف ودمبل في كل إيد بالقبضة المحايدة (راحة الإيد لجوه زي المطرقة). اطلع لفوق وكوعك ثابت في جنبك وانزل ببطء للآخر.'],['باي بريتشر','دراعك على مسند البريتشر وماسك البار أو الدمبل. اطلع وانزل للآخر بوزن معتدل من غير ما تحدف.'],['باي كابل','واقف قدام الكابل السفلي وماسك البار المستقيم أو الحبل. اسحب لفوق وكوعك لازق في جنبك، وانزل للآخر ببطء.'],['باي تركيز','قاعد وكوعك ساند على فخدك من جوه وماسك الدمبل. اطلع بتركيز وانزل ببطء للآخر.'],['باي مقعد مائل','قاعد على كرسي مائل 45 درجة والدمبل مدلدل لتحت. اطلع وانزل للآخر — الوضعية دي بتطوّل الرأس الطويلة.']]],
['تراي',[['تراي حبل','الكابل فوق وماسك الحبل (المقبض الحبلي) بإيديك الاتنين وكوعك لازق في جنبك. افرد دراعك لتحت وافتح الحبل في الآخر واعصر التراي.'],['تراي بار كابل','واقف قدام الكابل وماسك البار المستقيم بإيديك الاتنين وكوعك لازق في جنبك. اسحب البار لتحت لحد ما دراعك تتفرد تمامًا.'],['تراي خلف الرأس دمبل','الدمبل ورا راسك بإيد واحدة أو اتنين. افرد دراعك لفوق من غير ما يتحرك كوعك.'],['سكال كراشر','نام على ضهرك وماسك البار المتعرج (EZ) فوق وشك. نزّل البار لجبهتك بتحريك الساعد بس وافرد لفوق — بوزن معتدل، ولو كوعك بيوجعك استبدله بخلف الرأس دمبل.'],['ضغط ضيق','نام على البنش وامسك البار بقبضة بعرض الكتف (مش أضيق). انزل بصدرك وادفع لفوق — القبضة الأضيق من كده بتوجع الرسغ والكوع.'],['ديبس مقعد','إيدك على البنش وراك ورجلك قدامك. انزل لحد ما كوعك 90 درجة بس (متنزلش للآخر) واطلع — النزول العميق بيضغط على الكتف الأمامي.'],['كيك باك','ميّل جسمك لقدام وضهرك مفرود ودمبل في إيدك وكوعك متني لورا عند وسطك. افرد دراعك لورا بالكامل واعصر التراي فوق.'],['تراي جهاز','قاعد في جهاز التراي وماسك المقبض. ادفع المقبض لتحت لحد الفرد ورجّع ببطء.']]],
['رجل',[['سكوات بار','البار الحر على كتفك الخلفي ورجلك أوسع من الكتف بشوية. انزل لحد ما فخدك يوازي الأرض (أو لتحت لو تقدر) وضهرك مفرود، واطلع.'],['سكوات أمامي','البار قدام كتفك على الترقوة وكوعك لفوق. انزل بضهر مفرود تمامًا واطلع.'],['هاك سكوات','ضهرك لازق في مسند الجهاز ورجلك على البليت. انزل واطلع من غير ما ركبك تعدي مشط رجلك.'],['ليج بريس','قاعد ورجلك على البليت أوسع من الكتف. نزّل البليت لتحت وادفع لفوق من غير ما تفرد ركبك للآخر.'],['ليج اكستنشن','قاعد والرول على مشط رجلك. افرد رجلك لفوق وثبّت ثانية فوق وانزل ببطء.'],['ليج كيرل نائم','نايم على بطنك والرول ورا كعبك. اتني رجلك لفوق لورا وانزل ببطء.'],['ليج كيرل جلوس','قاعد في الجهاز ومتثبت. اتني رجلك لتحت بتحكم للآخر — أحسن من النائم للنمو.'],['رومانيان ديدلفت','واقف والبار أو الدمبل في إيدك ورجلك شبه مفرودة. ادفع وركك لورا وانزل بالوزن لحد نص الساق (البار قريب من رجلك) وضهرك مفرود، وارجع — الفرق عن الديدلفت إن الوزن مش بينزل الأرض.'],['لانجز دمبل','واقف ودمبل في كل إيد. خد خطوة لقدام وانزل بركبتك الخلفية لتحت (90 درجة) وارجع. بدّل الرجلين.'],['بلغاري سبليت سكوات','رجل ورا على البنش ورجل قدامك. انزل باللي قدام واطلع — من أقوى تمارين الرجل الأمامية.'],['هيب ثرست','كتفك على البنش ورجلك على الأرض والبار على وسطك. ادفع وسطك لفوق واعصر الجلوتس فوق.'],['سمانة واقف','واقف على مشط رجلك على درجة (كعبك في الهوا). اطلع لفوق على قد ما تقدر وانزل للآخر ببطء.'],['سمانة جلوس','قاعد في جهاز السمانة والوزن على فخادك. اطلع على مشط رجلك وانزل للآخر ببطء.'],['تقريب جهاز','اقعد في جهاز التقريب (رجلك بره المساند). سكّر رجلك لبعض ببطء واعصر الفخد الداخلي، وارجع بتحكم.']]],
['بطن',[['كرانش','نامي على ضهرك ورجلك متنية وإيدك ورا راسك من غير شد. اطلعي بكتفك لفوق.'],['رفع رجل معلق','متعلقة على البار ورجلك مدلدلة. ارفعي رجلك لفوق لحد 90 درجة (أو ركبك لصدرك) وانزلي ببطء.'],['بلانك','على كوعك ومشط رجلك وجسمك خط واحد من الراس للكعب. ثبّتي بطنك مشدودة ومتنزليش وسطك.'],['كرانش كابل','راكعة قدام الكابل وماسكاه ورا راسك. انزلي بصدرك لتحت واعصري بطنك.'],['روسيان تويست','قاعدة ورجلك مرفوعة (أو على الأرض) وماسكة وزن. لفي وسطك يمين وشمال.'],['عجلة البطن','على ركبك وماسكة العجلة بإيديك الاتنين. افردي لقدام على قد ما تقدري وارجعي ببطنك مش بضهرك.'],['رفع رجل أرضي','نامي على ضهرك وارفعي رجلك المفرودة لفوق وانزلي ببطء من غير ما ضهرك يقوّس.'],['سايد بلانك','على جنبك على كوع واحد ورجلك فوق بعض. جسمك خط واحد وثبّتي الجنب مشدود.']]],

function libMuscles(){return LIB.map(function(x){return x[0];});}
/* ============ نافذة اختيار التمرين ============ */
let pk={q:'',m:'الكل',items:[]};
let pkMode='day';
function addEx(){pkMode='day';openPicker();}
function addWEx(){pkMode='weights';openPicker();}
function openPicker(){
  pk={q:'',m:'الكل',items:[]};
  document.getElementById('pkQ').value='';
  document.getElementById('pkClose').innerHTML=icon('x');
  document.getElementById('picker').style.display='flex';
  document.getElementById('pkQ').oninput=function(){pk.q=this.value;pkRender();};
  pkRender();
}
const _lbCache={};
function openLb(name){const t=document.getElementById('lbT'),im=document.getElementById('lbI'),dd=document.getElementById('lbD');if(t)t.textContent=name;if(im){im.alt=name;const full=exSrc(name,true);im.src=full;if(full&&!_lbCache[full]){const f=new Image();f.onload=function(){_lbCache[full]=1;};f.src=full;}}if(dd)dd.textContent=libDesc(name)||'';const x=document.getElementById('lbX');if(x){x.innerHTML=icon('x');x.onclick=closeLb;}document.getElementById('lb').style.display='flex';}
function closeLb(){document.getElementById('lb').style.display='none';}
function exThumb(name){const u=exSrc(name,false);if(u)return '<img class="exthumb" loading="lazy" decoding="async" width="52" height="52" src="'+u+'" onerror="this.style.display=\'none\'" alt="" onclick="event.stopPropagation();openLb(\''+name.replace(/'/g,"\\'")+'\')">';return '<span class="thumb exthumb fallback">'+icon('gym')+'</span>';}
function closePicker(){document.getElementById('picker').style.display='none';}
function pkRender(){
  const chips=document.getElementById('pkChips');
  chips.innerHTML=['الكل'].concat(libMuscles()).map(function(m){return '<button class="chip '+(pk.m===m?'on':'')+'" onclick="pkSetM(\''+m+'\')">'+m+'</button>';}).join('');
  const q=pk.q.trim();pk.items=[];
  LIB.forEach(function(g){if(pk.m!=='الكل'&&pk.m!==g[0])return;g[1].forEach(function(t){if(!q||t[0].indexOf(q)>-1)pk.items.push({m:g[0],n:t[0],d:t[1]});});});
  let h='';
  pk.items.forEach(function(x,i){const _u=exImg(x.n);h+='<button class="pk" onclick="pickEx('+i+')">'+(_u?'<img class="exthumb" loading="lazy" decoding="async" style="width:44px;height:44px" src="'+_u+'">':icon('gym'))+' '+esc(x.n)+'<small>'+esc(x.m)+'</small></button>';});
  if(q)h+='<button class="pk" style="border-color:var(--neon)" onclick="pickEx(-1)">'+icon('plus')+' أضف &laquo;'+esc(q)+'&raquo; كتمرين جديد</button>';
  document.getElementById('pkList').innerHTML=h||'<p class="muted" style="text-align:center">مفيش نتائج</p>';
}
function pkSetM(m){pk.m=m;pkRender();}
function pickEx(i){
  const it=i<0?{m:'عام',n:pk.q.trim(),d:''}:pk.items[i];
  if(!it||!it.n)return;
  if(pkMode==='weights'){closePicker();wQuickAdd(it.n);return;}
  const d=day();if(!d)return;
  d.exercises.push({name:it.n,muscle:it.m,desc:it.d||'',sets:[{w:'',r:''}]});
  save();closePicker();render();
}

function day(){if(!db.program)return null;for(let i=0;i<db.program.days.length;i++)if(db.program.days[i].id===view.did)return db.program.days[i];return null;}
function renameEx(i){const e=day().exercises[i];const n=prompt('اسم التمرين الجديد:',e.name);if(n){e.name=n.trim();save();render();}}
function delEx(i){if(confirm('حذف التمرين ده؟')){day().exercises.splice(i,1);save();render();}}
function moveEx(i,dir){const ex=day().exercises;const j=i+dir;if(j<0||j>=ex.length)return;const t=ex[i];ex[i]=ex[j];ex[j]=t;save();render();}
function addSet(i){const s=day().exercises[i].sets;const l=s[s.length-1]||{w:'',r:''};s.push({w:l.w,r:l.r});save();render();}
function delSet(i,j){if(day().exercises[i].sets.length<=1)return alert('لازم يفضل دور واحد على الأقل');day().exercises[i].sets.splice(j,1);save();render();}
function setT(i,j,k,v){day().exercises[i].sets[j][k]=v;save();}
function renameDay(id){const p=db.program;if(!p)return;const d=p.days.find(function(x){return x.id===id;});if(!d)return;const n=prompt('اسم اليوم الجديد:',d.name);if(n){d.name=n.trim();save();render();}}
function addDayHome(){if(!db.program)return;const n=prompt('اسم اليوم الجديد (مثال: صدر + تراي):');if(!n)return;db.program.days.push({id:uid(),name:n.trim(),exercises:[]});save();render();}
function resetProgram(){if(!db.program)return go('workout');if(confirm('هتمسح البرنامج الحالي وتبدأ من جديد؟')){db.program=null;save();go('workout');}}
/* ============ أوزاني — آخر 3 جلسات ============ */
function prOf(n){const p=db.prs&&db.prs[n];return p?num(p.w):0;}
function epley1RM(w,r){w=num(w);r=parseInt(r)||0;if(!w||!r)return 0;return Math.round(w*(1+r/30));}
function best1RM(n){const p=db.prs&&db.prs[n];return p&&p.rm?p.rm:0;}
/* جلسات التمرين: كل يوم = جلسة، بنحتفظ بآخر 3 جلسات بكل مجموعاتها */
function sessionsOf(n){const a=db.weights[n]||[];const out=[],map={};a.forEach(function(x,i){const k=x.s||('old'+i);if(!map[k]){map[k]={k:k,d:x.d,sets:[]};out.push(map[k]);}map[k].sets.push({w:x.w,r:x.r,note:x.note,i:i});});out.forEach(function(se){se.sets.reverse();let mx=0;se.sets.forEach(function(t){if(num(t.w)>mx)mx=num(t.w);});se.max=mx;se.first=se.sets[0];se.last=se.sets[se.sets.length-1];});return out;}
function sessLabel(se){if(se.k===dateKey())return 'النهارده';if(/^old/.test(se.k))return 'جلسة قديمة';const p=se.k.split('-');return p[2]+'/'+p[1];}
function fmtSet(t){return esc(t.w||'—')+' كجم × '+esc(t.r||'—');}
let restTimer=null,restTotal=0,restLeft=0,restEnd=0,restEx=null,restDone=false;
let _actx=null;
function unlockAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!_actx)_actx=new C();if(_actx.state==='suspended')_actx.resume();const o=_actx.createOscillator(),g=_actx.createGain();g.gain.value=0.0001;o.connect(g);g.connect(_actx.destination);o.start();o.stop(_actx.currentTime+0.02);}catch(e){}}
function beep(){try{if(!_actx)return;if(_actx.state==='suspended')_actx.resume();[0,0.35,0.7].forEach(function(t){const o=_actx.createOscillator(),g=_actx.createGain();o.type='sine';o.frequency.value=t>0.6?1175:880;const st=_actx.currentTime+t;g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(0.5,st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,st+0.28);o.connect(g);g.connect(_actx.destination);o.start(st);o.stop(st+0.3);});}catch(e){}}
function startRest(sec,exKey){unlockAudio();restTotal=sec;restEnd=Date.now()+sec*1000;restEx=exKey||null;restDone=false;clearInterval(restTimer);restTimer=setInterval(tickRest,250);}
function tickRest(){restLeft=Math.max(0,Math.ceil((restEnd-Date.now())/1000));drawRest();if(restLeft<=0&&!restDone){restDone=true;clearInterval(restTimer);beep();try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}}
try{document.addEventListener('visibilitychange',function(){if(!document.hidden&&restEnd&&!restDone)tickRest();});}catch(e){}
function drawRest(){const el=document.getElementById('restbar');if(!el)return;el.style.display='flex';el.classList.toggle('done',restLeft<=0);const t=el.querySelector('.t'),b=el.querySelector('.bar>div'),l=el.querySelector('.lbl');const m=Math.floor(restLeft/60),ss=restLeft%60;if(t)t.textContent=restLeft<=0?'يلا!':(m+':'+String(ss).padStart(2,'0'));const bt=el.querySelector('button');if(bt)bt.textContent=restLeft<=0?'تمام':'تخطي';if(l)l.textContent=restLeft<=0?'الراحة خلصت — ابدأ المجموعة الجاية':'راحة قبل المجموعة الجاية';if(b)b.style.width=(restTotal?Math.round((restTotal-restLeft)/restTotal*100):0)+'%';}
function stopRest(){clearInterval(restTimer);restEx=null;restEnd=0;const el=document.getElementById('restbar');if(el)el.remove();}
function restBarHTML(){return '<div id="restbar"><div style="flex:1;min-width:0"><div class="lbl">راحة قبل المجموعة الجاية</div><div class="bar"><div></div></div></div><span class="t">0:00</span><button class="btn btn-sm" onclick="stopRest()">تخطي</button></div>';}
function attachRest(scroll){if(!restEx||!restEnd)return;restLeft=Math.max(0,Math.ceil((restEnd-Date.now())/1000));drawRest();if(scroll){const el=document.getElementById('restbar');if(el){const r=el.getBoundingClientRect();if(r.bottom>innerHeight-90||r.top<70)el.scrollIntoView({block:'center',behavior:'smooth'});}}}

const MEALS=[['الفطار',.25],['الغدا',.35],['سناك',.10],['العشا',.30]];
function calcBMR(){const p=db.profile,W=num(p.weight),H=num(p.height),A=num(p.age);if(!W||!H||!A)return 0;return Math.round(10*W+6.25*H-5*A+(p.gender==='f'?-161:5));}
function calcTDEE(){
  const p=db.profile,W=num(p.weight),H=num(p.height),A=num(p.age);
  if(!W||!H||!A)return 0;
  let bmr=10*W+6.25*H-5*A+(p.gender==='f'?-161:5);
  const act=num(p.act)||1.55;
  let t=bmr*act;
  if(p.goal==='lose')t-=400;else if(p.goal==='gain')t+=300;
  return Math.round(t/10)*10;
}
function seededRand(seed){let s=seed;return function(){s=(s*9301+49297)%233280;return s/233280;};}
function foodOK(fi){const f=FOODS[fi];if(!f||!f.al)return true;for(let i=0;i<f.al.length;i++)if(view.noFood&&view.noFood.indexOf(f.al[i])>-1)return false;return true;}
function toggleNoFood(k){if(!view.noFood)view.noFood=[];const i=view.noFood.indexOf(k);if(i>-1)view.noFood.splice(i,1);else view.noFood.push(k);view.nmeals=null;save();render();}
function buildMeals(tpl){
  const rnd=seededRand(tpl*7+3);
  const pool=FOODS.map(function(f,i){return{i:i,k:f.a[1]};}).filter(function(x){return foodOK(x.i);});
  const meals=MEALS.map(function(m){return{name:m[0],target:Math.round(tpl*m[1]),items:[]};});
  const msum=function(m){let s=0;m.items.forEach(function(it){s+=FOODS[it.fi].a[1];});return s;};
  const total=function(){let s=0;meals.forEach(function(m){s+=msum(m);});return s;};
  meals.forEach(function(m){
    const ord=pool.slice().sort(function(){return rnd()-.5;});
    for(let k=0;k<ord.length&&m.items.length<4;k++){if(msum(m)+ord[k].k<=m.target+80)m.items.push({fi:ord[k].i,side:'a'});}
    if(!m.items.length)m.items.push({fi:0,side:'a'});
  });
  let pass=0,changed=true;
  while(changed&&pass++<5){
    changed=false;
    let g1=0;
    while(total()<tpl-50&&g1++<30){
      let bm=meals[0];meals.forEach(function(m){if(msum(m)/m.target<msum(bm)/bm.target)bm=m;});
      if(bm.items.length>=7)break;
      const need=tpl-total();
      const fit=pool.filter(function(p){return p.k<=need+40;}).sort(function(a,b){return b.k-a.k;});
      const pick=fit.length?fit[0]:pool.slice().sort(function(a,b){return a.k-b.k;})[0];
      bm.items.push({fi:pick.i,side:'a'});changed=true;
    }
    let g2=0;
    while(total()>tpl+50&&g2++<30){
      let bm=null;meals.forEach(function(m){if(m.items.length>1&&(!bm||m.items.length>bm.items.length))bm=m;});
      if(!bm)break;
      let si=0;bm.items.forEach(function(it,i){if(FOODS[it.fi].a[1]<FOODS[bm.items[si].fi].a[1])si=i;});
      if(total()-FOODS[bm.items[si].fi].a[1]<tpl-50)break;
      bm.items.splice(si,1);changed=true;
    }
  }
  let g3=0,improved=true;
  while(improved&&g3++<30){
    improved=false;
    const t=total();
    if(t>tpl+50){
      for(const m of meals){for(let ii=0;ii<m.items.length;ii++){
        const cur=FOODS[m.items[ii].fi].a[1];
        for(const p of pool){if(p.k>=cur)continue;const nt=t-cur+p.k;if(nt<=tpl+50&&nt>=tpl-60){m.items[ii]={fi:p.i,side:'a'};improved=true;break;}}
        if(improved)break;
      }if(improved)break;}
    }else if(t<tpl-50){
      for(const m of meals){for(let ii=0;ii<m.items.length;ii++){
        const cur=FOODS[m.items[ii].fi].a[1];
        for(const p of pool){if(p.k<=cur)continue;const nt=t-cur+p.k;if(nt<=tpl+60&&nt>=tpl-50){m.items[ii]={fi:p.i,side:'a'};improved=true;break;}}
        if(improved)break;
      }if(improved)break;}
    }
  }
  view.nmeals=meals;
}
function mealTotal(m){let s=0;m.items.forEach(function(it){const f=FOODS[it.fi];s+=it.side==='a'?f.a[1]:f.b[1];});return s;}

function readPhoto(inp){
  try{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=function(){
      try{
        const img=new Image();
        img.onload=function(){
          try{
            const mx=700,sc=Math.min(1,mx/Math.max(img.width,img.height));
            const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
            cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
            const prev=document.getElementById('photoPrev');
            if(prev){prev.src=cv.toDataURL('image/jpeg',.65);prev.style.display='block';}
          }catch(e){alert('الصورة دي مش نافعة');}
        };
        img.src=r.result;
      }catch(e){alert('الصورة دي مش نافعة');}
    };
    r.readAsDataURL(f);
  }catch(e){alert('المتصفح ده مش بيدعم الصور');}
}

function nearestTpl(t){let best=1500;for(let v=1200;v<=3500;v+=50){if(Math.abs(v-t)<=Math.abs(best-t))best=v;}return best;}
function saveDaysGoal(){
  const d=document.getElementById('eDays'),g=document.getElementById('eGoal');
  if(d&&+d.value>=1&&+d.value<=7)db.profile.days=parseInt(d.value);
  if(g)db.profile.goal=g.value;
