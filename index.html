<style>
:root{--bg:#0A0E0F;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.1);--line:rgba(0,230,118,.3);--line2:rgba(0,230,118,.55);
--text:#FFFFFF;--muted:#C3D6CC;--neon:#00E676;--neon2:#4DFF9D;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Tajawal","Cairo","Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;
background-color:#0A0E0F;background-image:radial-gradient(900px 420px at 85% -5%,rgba(0,230,118,.10),transparent 60%),radial-gradient(800px 420px at 10% -5%,rgba(0,255,136,.07),transparent 60%)}}
header{position:sticky;top:0;z-index:20;background:rgba(10,14,15,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hwrap{max-width:640px;margin:auto;padding:10px 14px;padding-top:max(10px, env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
body{padding-top:env(safe-area-inset-top, 0px);}
html,body{max-width:100%;overflow-x:hidden}
img{max-width:100%}.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}table.wt{min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand .tile{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;color:#04120a;font-weight:900;font-size:15px;font-family:Arial,sans-serif;box-shadow:0 0 22px rgba(0,230,118,.45)}

.brand b i{font-style:normal;color:var(--neon)}
.brand small{font-size:12px;color:var(--muted);font-weight:500}
main{padding:16px 14px 120px;max-width:640px;margin:auto;overflow-x:hidden}
#app>*{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(0,0,0,.35)}

.card h3{margin:0 0 4px;font-size:17px;font-weight:800}
.card .sub{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.9}
button{font-family:inherit;cursor:pointer;transition:transform .07s,filter .15s}
button:active{transform:scale(.96)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800}
.btn .ic{width:19px;height:19px}
.btn-neon{background:linear-gradient(135deg,var(--neon),var(--neon2));border:0;color:#04120a;box-shadow:0 0 24px rgba(0,230,118,.4)}
.btn-block{width:100%;padding:15px;font-size:16px;border-radius:16px}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px}

.ibtn{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line2);color:#d6e4db;padding:0;margin:2px}

.ibtn.danger{color:#ff9c9c;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}
input,select{padding:11px 8px;font-size:16px;font-weight:700;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.4);color:#fff;text-align:center;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,230,118,.2)}
input.w{width:84px}input.r{width:84px}input.full{width:100%;text-align:right;margin:6px 0}
select.full{width:100%;text-align:right;margin:6px 0}
#splash{position:fixed;inset:0;z-index:100000;background:radial-gradient(circle at 50% 42%,#03200f 0%,#000 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .55s ease,visibility .55s ease}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:200px;height:200px;border-radius:50%;position:relative;animation:spIn .9s cubic-bezier(.2,.8,.2,1) both,spPulse 2.2s ease-in-out .9s infinite}
#splash .spglow{position:absolute;width:300px;height:300px;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-62%);background:radial-gradient(circle,rgba(0,230,118,.35),transparent 65%);filter:blur(10px);animation:spPulse 2.2s ease-in-out infinite}
#splash .sptag{color:#9fb0ad;font-weight:800;letter-spacing:.5px;font-size:14px;animation:spUp .9s ease .25s both}
#splash .spbar{width:150px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;animation:spUp .9s ease .35s both}
#splash .spbar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,#19e68c,transparent);animation:spRun 1.2s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes spPulse{0%,100%{filter:drop-shadow(0 0 10px rgba(0,230,118,.35))}50%{filter:drop-shadow(0 0 26px rgba(0,230,118,.75))}}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.restflash{position:fixed;inset:0;z-index:99995;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(0,230,118,.55),rgba(0,0,0,.85) 70%);animation:rfIn .25s ease both,rfOut .5s ease 1.7s both}

.restflash span{display:block;font-size:18px;color:#d8f5e6;font-weight:800;margin-top:6px}
@keyframes rfIn{from{opacity:0}to{opacity:1}}

.land .landtop{display:flex;justify-content:flex-end;margin-bottom:4px}

.landq summary{cursor:pointer;font-weight:800;color:#fff}
.landq p{margin:6px 0 0;color:#c9d6d3;line-height:1.9;font-size:14px}

#tourOv{position:fixed;inset:0;z-index:99990}
#tourOv .tourhole{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.74);border:2px solid var(--neon);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#tourOv .tourtip{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:#0f1a17;border:1px solid var(--neon);border-radius:16px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.6);opacity:0;transform:translateY(8px)}

#tourOv .tourn i.on{background:var(--neon);width:18px;border-radius:4px}
/* حركات */
#app.fxpage{animation:fxPage .28s cubic-bezier(.2,.8,.2,1)}
@keyframes fxPage{from{opacity:.4;transform:translateX(-14px)}to{opacity:1;transform:none}}
.fxcard{animation:fxCard .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fxCard{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.fxtoast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9997;background:#0f1a17;border:1px solid var(--neon);color:#fff;border-radius:999px;padding:9px 18px;font-weight:800;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 18px rgba(0,230,118,.25);animation:fxUp .35s cubic-bezier(.2,.9,.3,1.3) both;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}

.fxtoast.out{opacity:0;transform:translateX(-50%) translateY(10px);transition:all .4s ease}
@keyframes fxUp{from{opacity:0;transform:translateX(-50%) translateY(24px) scale(.9)}to{opacity:1;transform:translateX(-50%)}}
.fxchk{display:inline-block;color:var(--neon);animation:fxPop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes fxPop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1)}}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:#ffd166;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.25);border-radius:999px;padding:3px 10px;margin-bottom:8px}
.streak .flame{display:inline-block;animation:fxFlame 1.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes fxFlame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(4deg)}}
.chip.fxshine{animation:fxShine .9s ease both}
@keyframes fxShine{0%{transform:scale(.8) rotateY(90deg);opacity:.3}60%{transform:scale(1.08) rotateY(0);box-shadow:0 0 16px rgba(0,230,118,.6)}100%{transform:none}}
#restbar .bar>div{transition:width .3s linear}
#restbar.last5{animation:fxBeat .9s ease-in-out infinite}
#restbar.last5 .t{color:#ffd166}
@keyframes fxBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.025);box-shadow:0 0 30px rgba(255,209,102,.5)}}
.skel{border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 37%,rgba(255,255,255,.04) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}

function wAdd(n,w,r,note){

  const keep=[];a.forEach(function(x,i){const k=x.s||('old'+i);if(keep.indexOf(k)<0)keep.push(k);});
  const last3=keep.slice(0,3);
  db.weights[n]=a.filter(function(x,i){return last3.indexOf(x.s||('old'+i))>-1;});
  // سجل كامل مختصر لكل جلسة (أعلى وزن، أقصى متوقع، الحجم) — بيفضل محفوظ للأبد وبيترسم منه التقدم
  try{const k=dateKey();if(!db.whist)db.whist={};const H=db.whist[n]=db.whist[n]||[];let row=H.find(function(h){return h.k===k;});if(!row){row={k:k,max:0,rm:0,vol:0,sets:0};H.push(row);}
   const wv=num(w),rv=num(r);row.sets++;row.vol+=Math.round(wv*rv);if(wv>row.max)row.max=wv;const e1=epley1RM(w,r);if(e1>row.rm)row.rm=e1;if(H.length>400)H.splice(0,H.length-400);}catch(e){}

/* ===== محرك السعرات (أبحاث حديثة) =====
   - الاحتياج: Mifflin-St Jeor × معامل النشاط.
   - العجز/الفائض كنسبة من الاحتياج بدل رقم ثابت: تخسيس 15-25% (≈0.5-1% من الوزن أسبوعيًا)، زيادة 5-15% (Iraki 2019، Helms 2014).
   - البروتين بالجرام لكل كجم: تخسيس 1.8، ثبات 1.6، زيادة 1.8 (Morton 2018: الفايدة لحد ~1.6 والحد الأعلى ~2.2)، وبحد أقصى 35% من السعرات. للوزن العالي (BMI>30) بنحسب على وزن مرجعي.
   - الدهون 25% بحد أدنى 0.6 جم/كجم، والباقي كارب. الألياف 14 جم لكل 1000 سعرة. */
function calcMaint(){const b=calcBMR();if(!b)return 0;return Math.round(b*(num(db.profile.act)||1.55));}
function adjPctDefault(g){return g==='lose'?-0.20:(g==='gain'?0.10:0);}
function curAdjPct(){const p=db.profile,g=p.goal;if(g!=='lose'&&g!=='gain')return 0;const v=p.adjPct;if(typeof v==='number'&&((g==='lose'&&v<0)||(g==='gain'&&v>0)))return v;if(typeof p.adj==='number'){const m=calcMaint();if(m&&((g==='lose'&&p.adj<0)||(g==='gain'&&p.adj>0))){const r=p.adj/m;return g==='lose'?Math.max(-0.25,Math.min(-0.15,Math.round(r*20)/20)):Math.max(0.05,Math.min(0.15,Math.round(r*20)/20));}}return adjPctDefault(g);}
function curAdj(){return Math.round(calcMaint()*curAdjPct());}
function adjOpts(){const g=db.profile.goal;if(myRegion()==='en')return adjOptsEN();if(g==='lose')return[[-0.15,'آمن — حوالي ربع لنص كيلو في الأسبوع'],[-0.20,'متوسط — الموصى به'],[-0.25,'⚠️ سريع — لفترة قصيرة بس']];if(g==='gain')return[[0.05,'عضل صافي — أقل دهون'],[0.10,'متوسط — الموصى به'],[0.15,'سريع — دهون أعلى']];return[[0,'ثبات']];}

function calcTDEE(){
  const p=db.profile,m=calcMaint();
  if(!m)return 0;
  let t=m*(1+curAdjPct());
  const minSafe=p.gender==='f'?1200:1500;
  if(t<minSafe)t=minSafe;
  return Math.round(t/10)*10;
}
function macroTargets(t){
  const p=db.profile,W=num(p.weight),H=num(p.height);t=t||calcTDEE();
  if(!W||!t)return null;
  let refW=W;if(H){const hm=H/100,bmi=W/(hm*hm);if(bmi>30)refW=Math.round(27*hm*hm);}
  const g=p.goal,perKg=g==='lose'?1.8:(g==='gain'?1.8:1.6);
  let pr=Math.round(refW*perKg);if(pr*4>t*0.35)pr=Math.round(t*0.35/4);
  const fat=Math.max(Math.round(t*0.25/9),Math.round(refW*0.6));
  const carb=Math.max(0,Math.round((t-pr*4-fat*9)/4));
  return {kcal:t,p:pr,f:fat,c:carb,fiber:Math.round(t*14/1000),water:Math.round(W*35/50)*50,perKg:perKg};
}

// أقصى مضاعفة للصنف (عشان الكميات تفضل منطقية: البيض والدهون مش بتتضاعف كتير)
function itemMaxQ(f,nm){if(/بيض|egg/i.test(nm))return 1.35;if(f.g==='fat')return 1.5;if(f.g==='fruit')return 2;if(f.g==='free')return 1.75;return 2.5;}
function roundQ(q){return Math.max(0.5,Math.round(q*4)/4);}
function itemKc(it){const f=FOODS[it.fi];return Math.round((it.side==='a'?f.a[1]:f.b[1])*(it.q||1));}
function itemP(it){const f=FOODS[it.fi];return Math.round((f.p||0)*(it.q||1));}
function itemName(it){const f=FOODS[it.fi];return scaleName(it.side==='a'?f.a[0]:f.b[0],it.q||1);}
function fmtQty(v){v=Math.max(0.25,v);const w=Math.floor(v+1e-9),fr=Math.round((v-w)*4)/4;const s=fr===.25?'¼':(fr===.5?'½':(fr===.75?'¾':''));const EN=myRegion()==='en';return w?(w+(s?((EN?'':' و')+s):'')):(s||'¼');}
function scaleName(nm,q){if(Math.abs(q-1)<0.01)return nm;let hit=false;
 nm=nm.replace(/(\d+)\/(\d+)/g,function(_,a,b){return String(Math.round(a/b*100)/100);}).replace(/(^|\s)نص(\s)/g,'$10.5$2');
 const out=nm.replace(/(\d+(?:\.\d+)?)\s*(جم|g|مل|ml)(?![؀-ۿa-z])/gi,function(_,n,u){hit=true;let v=parseFloat(n)*q;v=v>=100?Math.round(v/10)*10:Math.max(5,Math.round(v/5)*5);return v+(u.length>2||/[a-z]/i.test(u)?'':'')+u;})
  .replace(/(\d+(?:\.\d+)?)\s*(حبات|حبة|بيضات|بيضة|بيضتين|شرائح|شريحة|رغيف|ملاعق|ملعقة|كوب|أكواب|slices?|eggs?|cups?|tbsp|pieces?)/gi,function(_,n,u){hit=true;const v=Math.round(parseFloat(n)*q*2)/2;return (Number.isInteger(v)?v:fmtQty(v))+' '+u;});
 if(hit)return out;
 return nm+' ×'+fmtQty(q);}
function fitMeal(m){
 // نوزّع الفرق على الأصناف لحد ما نوصل للمستهدف (±5%)
 for(let pass=0;pass<4;pass++){
  const sum=m.items.reduce(function(s,it){return s+itemKc(it);},0);if(!sum)return;
  const k=m.target/sum;if(Math.abs(k-1)<0.05)break;
  let free=m.items.filter(function(it){const f=FOODS[it.fi],nm=it.side==='a'?f.a[0]:f.b[0];return k>1?(it.q||1)<itemMaxQ(f,nm)-0.01:(it.q||1)>0.5;});
  if(!free.length)break;
  const fixedKc=sum-free.reduce(function(s,it){return s+itemKc(it);},0);
  const need=(m.target-fixedKc)/Math.max(1,sum-fixedKc);
  free.forEach(function(it){const f=FOODS[it.fi],nm=it.side==='a'?f.a[0]:f.b[0];it.q=roundQ(Math.min(itemMaxQ(f,nm),Math.max(0.5,(it.q||1)*need)));});
 }
}
function buildMeals(tpl){
 view.ntpl=tpl;
 const rnd=seededRand(tpl*7+3);
 const slots=mealSlotDefs();
 const names={bf:'الفطور',lu:'الغداء',sn:'وجبة خفيفة',di:'العشاء'};
 if(myRegion()==='en'){names.bf='Breakfast';names.lu='Lunch';names.sn='Snack';names.di='Dinner';}
 const pool=FOODS.map(function(f,i){return{i:i,f:f};}).filter(function(x){return foodOK(x.i);});
 const bySlot={bf:[],lu:[],sn:[],di:[],any:[]};
 pool.forEach(function(x){const s=x.f.slot||'any';if(bySlot[s])bySlot[s].push(x);else bySlot.any.push(x);});
 const shuffle=function(arr){return arr.slice().sort(function(){return rnd()-.5;});};
 const used={};
 const mt=macroTargets(tpl);
 const meals=slots.map(function(s){
  const m={name:names[s.key]||s.key,target:Math.round(tpl*s.share),items:[],slot:s.key};
  let cand=bySlot[s.key].concat(bySlot.any);if(!cand.length)cand=pool.slice();
  cand=cand.filter(function(x){return !used[x.i];});
  const core=shuffle(cand.filter(function(x){return isCore(x.i);})),rest=shuffle(cand.filter(function(x){return !isCore(x.i);}));
  const ord=core.concat(rest);
  // الوجبات الأساسية لازم تبدأ بصنف بروتين، والسناك بروتين أو ألبان لو متاح
  const wantProt=true;
  const groups={};
  const take=function(x){m.items.push({fi:x.i,side:'a',q:1});used[x.i]=1;groups[x.f.g]=(groups[x.f.g]||0)+1;};
  if(wantProt){const pi=ord.find(function(x){return x.f.g==='prot'||(s.key==='sn'&&x.f.g==='dairy');});if(pi)take(pi);}
  for(let k=0;k<ord.length&&m.items.length<s.maxItems;k++){const x=ord[k];if(used[x.i])continue;if(groups[x.f.g])continue;if(x.f.g==='free'&&m.items.length>=2)continue;take(x);}
  if(!m.items.length&&ord.length)take(ord[0]);
  fitMeal(m);
  return m;
 });
 // لو البروتين أقل من المستهدف: نكبّر أصناف البروتين ونقلل الكارب بنفس السعرات
 if(mt){let pTot=meals.reduce(function(s,m){return s+mealProt(m);},0);
  for(let guard=0;guard<6&&pTot<mt.p*0.9;guard++){let changed=false;
   meals.forEach(function(m){m.items.forEach(function(it){const f=FOODS[it.fi],nm=it.side==='a'?f.a[0]:f.b[0];if(f.g==='prot'&&(it.q||1)<itemMaxQ(f,nm)-0.01){it.q=roundQ((it.q||1)+0.25);changed=true;}});
    const carb=m.items.filter(function(it){return FOODS[it.fi].g==='carb'&&(it.q||1)>0.5;});carb.forEach(function(it){it.q=roundQ((it.q||1)-0.25);});});
   if(!changed)break;pTot=meals.reduce(function(s,m){return s+mealProt(m);},0);}
  meals.forEach(fitMeal);}
 view.maxItemsBySlot={};slots.forEach(function(s){view.maxItemsBySlot[s.key]=s.maxItems;});
 view.nmeals=meals;
}

function sparkHTML(vals){try{if(!vals||vals.length<2)return '';var w=120,h=36;var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx<=mn)mx=mn+1;var pts=vals.map(function(v,i){var x=vals.length===1?0:(i/(vals.length-1)*w);var y=h-3-((v-mn)/(mx-mn))*(h-8);return Math.round(x*10)/10+','+Math.round(y*10)/10;}).join(' ');return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="flex:none"><polyline points="'+pts+'" fill="none" stroke="var(--neon)" stroke-width="2.5" stroke-linecap="round"/></svg>';}catch(e){return '';}}
function histW(nm){try{var a=(db.weights[nm]||[]).slice(-12);return a.map(function(x){return num(x.w)||0;}).filter(function(w){return w>0;});}catch(e){return [];}}
function progressHTML(){var EN=myRegion()==='en';var keys=Object.keys(db.weights||{});var rows=[];keys.forEach(function(nm){var b=bestW(nm);if(!(b>0))return;var h=histW(nm);var first=h.length?h[0]:b;var pc=first>0?Math.round((b-first)/first*100):0;rows.push({nm:nm,b:b,first:first,pc:pc,h:h});});rows.sort(function(a,b2){return b2.pc-a.pc;});var h2='<div class="section-head"><h2>'+(EN?'My progress 📈':'تقدمي 📈')+'</h2></div>'+streakHTML();if(!rows.length)return h2+'<div class="card"><p class="muted">'+(EN?'Log weights while you train and your progress will appear here.':'سجّل أوزانك وانت بتتمرن وتقدمك هيظهر هنا.')+'</p></div>';rows.slice(0,12).forEach(function(r){var lbl=EN?('from '+r.first+' to '+r.b+' kg') : ('من '+r.first+' لـ '+r.b+' كجم');var pc=EN?('+'+r.pc+'%'):('+'+r.pc+'%');h2+='<div class="card"><div class="row" style="margin:0;align-items:center"><span class="grow" style="flex:1"><span class="nm">'+esc(EN?exEN(r.nm):r.nm)+'</span><br><span class="kcal">'+lbl+' <b style="color:var(--neon)">'+pc+'</b> 🔥</span></span>'+sparkHTML(r.h)+'</div></div>';});var prs=db.prs||{};var recs=Object.keys(prs).slice(0,8).map(function(nm){return '<span class="badge">🏆 '+esc(EN?exEN(nm):nm)+' '+(prs[nm].w||'')+(EN?' kg':' كجم')+'</span>';}).join(' ');if(recs)h2+='<div class="card"><h3>'+(EN?'Personal records':'أرقامك القياسية')+'</h3><p class="sub">'+recs+'</p></div>';return h2;}

function nearestTpl(t){let best=1500;for(let v=1200;v<=3500;v+=50){if(Math.abs(v-t)<=Math.abs(best-t))best=v;}return best;}
function saveDaysGoal(){
  const d=document.getElementById('eDays'),g=document.getElementById('eGoal');
  if(d&&+d.value>=1&&+d.value<=7)db.profile.days=parseInt(d.value);
  if(g&&g.value!==db.profile.goal){if(measLocked()){save();render();lockNote();return;}db.profile.goal=g.value;}
  save();render();
}
function toggleNday(i){const d=db.profile.notif.days||[0,1,2,3,4,5,6];const x=d.indexOf(i);if(x>-1)d.splice(x,1);else d.push(i);db.profile.notif.days=d;save();render();}
function calReminder(){
 try{
  const ndays=(db.profile.notif&&db.profile.notif.days)||[0,1,2,3,4,5,6];
  const tm=((document.getElementById('nTime')||{}).value)||db.profile.notif.time||'20:00';
  const parts=String(tm).split(':');const hh=+(parts[0]||20),mm=+(parts[1]||0);
  db.profile.notif.time=tm;db.profile.notif.on=true;save();
  const BY={0:'SU',1:'MO',2:'TU',3:'WE',4:'TH',5:'FR',6:'SA'};
  const by=ndays.map(function(d){return BY[d];}).filter(Boolean).join(',');
  const f=function(x){return x.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';};
  const now=new Date();let first=null;
  for(let k=0;k<8;k++){const dt=new Date(now);dt.setDate(dt.getDate()+k);if(ndays.indexOf(dt.getDay())>-1){dt.setHours(hh,mm,0,0);if(dt>now){first=dt;break;}}}
  if(!first){first=new Date(now);first.setHours(hh,mm,0,0);}
  const ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//HMFit//Workout//EN\r\nBEGIN:VEVENT\r\nUID:hmfit-'+Date.now()+'@hmfit\r\nDTSTAMP:'+f(new Date())+'\r\nDTSTART:'+f(first)+'\r\nDURATION:PT1H\r\nRRULE:FREQ=WEEKLY;BYDAY='+by+'\r\nSUMMARY:HM Fit Workout \uD83D\uDCAA\r\nEND:VEVENT\r\nEND:VCALENDAR';
  const bl=new Blob([ics],{type:'text/calendar;charset=utf-8'});const u=URL.createObjectURL(bl);const a=document.createElement('a');a.href=u;a.download='hmfit-reminders.ics';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u);},3000);
  render();

function pickAvatar(inp){
 try{
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){
   try{
    const img=new Image();
    img.onload=function(){
     try{
      const mx=256,sc=Math.min(1,mx/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*sc));cv.height=Math.max(1,Math.round(img.height*sc));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const u=cv.toDataURL('image/jpeg',.85);
      view._avatar=u;const pv=document.getElementById('avPrev');if(pv)pv.src=u;
     }catch(e){noteSheet('الصورة دي مش نافعة');}
    };
    img.src=r.result;
   }catch(e){noteSheet('الصورة دي مش نافعة');}
  };
  r.readAsDataURL(f);
 }catch(e){}
 inp.value='';
}

function planOf(o){if(!o||!o.createdAt)return{k:'new',label:'جديد'};if(o.blocked)return{k:'blocked',label:'\u26D4 موقوف'};const now=Date.now();if(o.subUntil&&now<o.subUntil){const left=o.subUntil-now,D=86400000;if(left>300*D)return{k:'y',label:'\u2705 سنوي'};if(left>60*D)return{k:'q',label:'\u2705 3 شهور'};return{k:'m',label:'\u2705 شهري'};}if(o.trialEnds&&now<o.trialEnds)return{k:'trial',label:'\U0001F193 تجربة'};return{k:'exp',label:'\u231B منتهي'};}
function admStatus(s){
  if(!s||!s.createdAt)return 'جديد';
  if(s.blocked)return '⛔ موقوف';
  const now=Date.now();
  if(s.subUntil&&now<s.subUntil)return '✅ مشترك حتى '+new Date(s.subUntil).toLocaleDateString(loc());
  if(s.trialEnds&&now<s.trialEnds)return '🆓 تجربة ('+Math.max(1,Math.ceil((s.trialEnds-now)/86400000))+' أيام)';
  return '⌛ منتهي';
}

 const cols=['users','coupons','affils','refs','reviews','payreq','annc','anncReads','content','feedback','errors','surveys'];
 function grab(name){return fs.collection(name).get().then(function(q){const o={};q.forEach(function(d){o[d.id]=d.data();});out.collections[name]=o;}).catch(function(e){out.collections[name]={_error:(e&&e.code)||'failed'};});}

  const uids=Object.keys(out.collections.users||{}).filter(function(k){return k!=='_error';});out.userData={};
  return Promise.all(uids.map(function(uid){return fs.collection('users').doc(uid).collection('data').get().then(function(q){const o={};q.forEach(function(d){o[d.id]=d.data();});out.userData[uid]=o;}).catch(function(){});}));

 }).catch(function(e){noteSheet('فشل: '+esc((e&&e.message)||''));});
}

function adminAct(uid,act){
  const ref=firebase.firestore().collection('users').doc(uid);
  ref.get().then(function(ds){
    const o=ds.exists?ds.data():{};
    const now=Date.now(),D=86400000;
    let u={};
    if(act==='month')u={subUntil:Math.max(now,o.subUntil||0)+30*D,blocked:false};
    if(act==='quarter')u={subUntil:Math.max(now,o.subUntil||0)+90*D,blocked:false};
    if(act==='year')u={subUntil:Math.max(now,o.subUntil||0)+365*D,blocked:false};
    if(act==='week')u={subUntil:Math.max(now,o.subUntil||0)+7*D,blocked:false};
    /* الطول والهدف والنشاط بيتفتحوا 24 ساعة مع كل اشتراك جديد بس (مش مع تمديد الأسبوع) */
    if(act==='block')u={blocked:!o.blocked};else{u.actNote=now;if(act!=='week')u.measUnlockUntil=now+24*3600000;}
    const label=act==='month'?'تفعيل شهر لـ ':act==='quarter'?'تفعيل 3 شهور لـ ':act==='year'?'تفعيل سنة لـ ':act==='week'?'تمديد أسبوع لـ ':'تغيير حالة ';
    _sheetFn=function(){ref.set(u,{merge:true}).then(function(){adminLoad();}).catch(function(e){noteSheet('فشل: '+(e&&e.message));});};
    askSheet('تأكيد','هل '+label+'<b>'+esc(o.email||uid)+'</b>؟','تأكيد',act==='block',function(){ref.set(u,{merge:true}).then(function(){adminLoad();}).catch(function(e){noteSheet('فشل: '+(e&&e.message));});});
    return;
  });
}
